/* ---- src/app/theme/tokens.css ---- */
/* Design tokens: docs/design.md §3–§6, one-to-one */
:root {
  --ink: #0d0f1f;
  --deck: #151831;
  --deck-2: #1d2142;
  --rim: #2c3160;
  --border: #3a4078;
  --border-2: #4a5196;
  --raised: #232852;
  --text: #eceeff;
  --muted: #9aa0c8;
  --placeholder: #6e74a0;
  --orange: #ff7a1a;
  --orange-2: #ffb020;
  --indigo: #4c5bff;
  --teal: #14c8c8;
  --violet: #8b5cf6;
  --danger: #ff4d5e;
  --got: #0fb98f;

  --grad-hot: linear-gradient(135deg, #ff7a1a 0%, #ffb020 100%);
  --grad-cool: linear-gradient(135deg, #4c5bff 0%, #14c8c8 100%);
  --grad-violet: linear-gradient(135deg, #6d4ae0 0%, #a78bfa 100%);
  --grad-mud: linear-gradient(135deg, #7a6046 0%, #b0916e 100%);
  --grad-red: linear-gradient(135deg, #c2183a 0%, #ff4d5e 100%);
  --grad-got: linear-gradient(135deg, #0fb98f 0%, #7cf0c5 100%);
  --grad-dusk: linear-gradient(135deg, #8b5cf6 0%, #4c5bff 55%, #14c8c8 100%);
  --grad-white: linear-gradient(135deg, #ffffff 0%, #c9cdf0 100%);
  --grad-separator: linear-gradient(90deg, #ff7a1a 0%, #8b5cf6 100%);

  --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  --lift: 0 8px 22px rgba(3, 4, 12, 0.55), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --glow: 0 0 0 1px var(--orange), 0 0 18px rgba(255, 122, 26, 0.45);

  --font-display: 'Chakra Petch', 'Avenir Next Condensed', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;
  --tap: 44px;
  --gutter: 16px;
  --column: 440px;
  --gap: 8px;

  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---- src/app/theme/base.css ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  font-weight: 700;
  margin: 0;
}
a {
  color: var(--orange-2);
}
.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Layout: the phone column (docs/design.md §6) */
.app {
  position: relative;
  max-width: var(--column);
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
.screen {
  position: relative;
  z-index: 1;
  padding: 0 var(--gutter);
}
.lead {
  color: var(--muted);
  margin: 0 0 16px;
  font-size: 14px;
}
.hex {
  clip-path: var(--hex);
}
.separator {
  height: 2px;
  border: 0;
  margin: 16px 0;
  background: var(--grad-separator);
  border-radius: 2px;
}

/* Surfaces */
.card {
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--lift);
  padding: 16px;
}
.field {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  padding: 0 14px;
  min-height: 50px;
}
.field:focus-within {
  border-color: var(--orange);
}
.field input,
.field select {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 12px 0;
}
.field input::placeholder {
  color: var(--placeholder);
}
.label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin: 0 0 6px;
}

/* Buttons (docs/design.md §7): text on gradients follows the contrast rule of §3 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 10px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-2);
  background: var(--raised);
  font-weight: 700;
  box-shadow: var(--lift);
  text-decoration: none;
  color: var(--text);
}
.btn-block {
  width: 100%;
}
.btn-primary {
  background: var(--grad-hot);
  border-color: transparent;
  color: var(--ink);
}
.btn-bought {
  background: var(--grad-got);
  border-color: transparent;
  color: var(--ink);
}
.btn-danger {
  /* --danger itself reaches only 4.4:1 on the raised surface; text needs 4.5:1 (docs/design.md §3) */
  color: #ff6b78;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  font-size: 18px;
  line-height: 1;
}

/* Badges and pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
}

/* Empty state */
.empty {
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
  padding: 40px 8px;
}
.empty .hex {
  width: 72px;
  height: 82px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.empty h2 {
  font-size: 18px;
}
.empty p {
  margin: 0;
  color: var(--muted);
}
.empty .actions {
  display: grid;
  gap: var(--gap);
  width: 100%;
  margin-top: 8px;
}

/* ---- src/app/theme/shell.css ---- */
/* App shell: app bar, menu, screen heading, sheet, toast (docs/design.md §6, §7) */

/* App bar: its own sticky band on every screen; above the menu's scrim, so ☰ closes it again */
.appbar {
  position: sticky;
  top: 0;
  z-index: 28;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 2px var(--gutter);
  background: var(--grad-hot);
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(255, 122, 26, 0.25);
}
.appbar-logo {
  width: 34px;
  height: auto;
}
.appbar-name {
  grid-column: 2;
  text-align: center;
  font: 700 19px/1 var(--font-display);
  letter-spacing: 0.02em;
}
/* a 38px translucent circle inside a 44px touch area */
.menu-btn {
  grid-column: 3;
  justify-self: end;
  position: relative;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  cursor: pointer;
}
.menu-btn::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: rgba(13, 15, 31, 0.14);
  border: 1px solid rgba(13, 15, 31, 0.25);
  transition: background 0.2s;
}
.menu-btn svg {
  position: relative;
}
.menu-btn[aria-expanded='true']::before {
  background: rgba(13, 15, 31, 0.28);
}
.menu-btn:focus-visible {
  outline-color: var(--ink);
}
@media (hover: hover) and (pointer: fine) {
  .menu-btn:hover::before {
    background: rgba(13, 15, 31, 0.24);
  }
}

/* Menu: a solid panel just below the app bar at the right; between the action bar and sheets */
.menu-scrim {
  position: fixed;
  inset: 0;
  z-index: 26;
  background: rgba(5, 6, 14, 0.5);
  animation: fade-in 0.18s ease-out;
}
.menu {
  position: fixed;
  z-index: 27;
  right: max(var(--gutter), calc(50% - var(--column) / 2 + var(--gutter)));
  width: min(260px, calc(100% - 2 * var(--gutter)));
  margin-top: 8px;
  padding: 8px;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  transform-origin: top right;
  animation: menu-in 0.18s ease-out;
}
.menu ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.menu a {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 12px;
  border-radius: 12px;
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.menu a svg {
  color: var(--muted);
}
.menu a[aria-current='page'] {
  background: var(--raised);
}
.menu a[aria-current='page'] svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .menu a:hover {
    background: var(--raised);
  }
}
@keyframes menu-in {
  from {
    opacity: 0;
    transform: scale(0.94);
  }
}
@media (prefers-reduced-motion: reduce) {
  .menu,
  .menu-scrim {
    animation: none;
  }
}

/* Screen heading: back (only where it belongs), title, an element right after it */
.top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px var(--gutter) 10px;
}
.top-title {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 4px;
  justify-items: start;
}
.top h1 {
  font-size: 22px;
  line-height: 1.15;
  /* at most two lines, then "…" */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.top-actions {
  flex: none;
  display: flex;
  gap: 8px;
}
@media (min-width: 600px) {
  .top h1 {
    font-size: 26px;
  }
}
.back {
  font-size: 26px;
  text-decoration: none;
  color: var(--text);
}

/* the light passing over the main button every 5 s */
@keyframes shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(5, 6, 14, 0.6);
  animation: fade-in 0.2s ease-out;
}
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 31;
  width: 100%;
  max-width: var(--column);
  max-height: 88dvh;
  overflow-y: auto;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #1a1e3e 0%, var(--deck) 40%);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-top: 1px solid var(--rim);
  padding: 10px var(--gutter) calc(24px + env(safe-area-inset-bottom));
  animation: sheet-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet:focus {
  outline: none;
}
.sheet-grip {
  /* a 5px bar with a 44px tall touch area around it */
  width: 88px;
  height: 25px;
  margin: -10px auto 2px;
  background: linear-gradient(var(--rim), var(--rim)) center / 44px 5px no-repeat;
  border-radius: 3px;
}
.sheet-title {
  font-size: 23px;
  margin-bottom: 12px;
}
@keyframes sheet-in {
  from {
    transform: translate(-50%, 100%);
  }
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  transform: translate(-50%, 20px);
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 600;
}
/* above the action bar, near the bottom where there is none (research R7) */
body:has(.actionbar) .toast {
  bottom: calc(100px + env(safe-area-inset-bottom));
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast i {
  flex: none;
  width: 10px;
  height: 11px;
  background: var(--orange);
}

/* Expired sign-in: above the screen, solid like every interactive surface */
.signin-banner {
  position: relative;
  z-index: 3;
  display: grid;
  gap: 10px;
  margin: 12px var(--gutter) 0;
  padding: 14px 16px;
  background: var(--deck-2);
  border: 1px solid var(--orange);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
}
.signin-banner p {
  margin: 0;
  font-size: 14px;
}


/* Tablets and laptops use more of the screen (docs/design.md §6): a wider column, cards and game
   rows in a grid; sheets and the swipe card keep a readable width. */
@media (min-width: 768px) {
  :root {
    --column: 1040px;
  }
  .cards {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .rows {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .sheet {
    max-width: 560px;
  }
  .hexboard {
    max-width: none;
  }
  .swipe-screen,
  .intro {
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .form,
  .share {
    max-width: 640px;
  }
}

/* Dragging a sheet down to close it follows the finger; it springs back if let go early */
.sheet.is-dragging {
  transition: none;
  animation: none;
}
.sheet.is-settling {
  transition: transform 0.2s ease-out;
}
.sheet-grip {
  touch-action: none;
}
/* a heading that reacts to taps (Config: five taps show the developer section): no text selection,
   no double-tap zoom swallowing taps, and the whole title width as target */
.top h1.tappable {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  justify-self: stretch;
}

/* the page keeps room at the bottom only while an action bar is shown (research R7) */
.app:not(:has(.actionbar)) {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

/* Collection heading (docs/design.md v2.0.0 "Collection screen", "Ticker"): the name runs as a
   ticker before the pencil instead of wrapping to two lines; the pencil keeps its place after it */
.top h1.ticker {
  flex: 0 1 auto;
  display: block;
  -webkit-line-clamp: unset;
  overflow-wrap: normal;
}
.edit-btn svg {
  width: 18px;
  height: 18px;
}

/* ---- src/app/theme/actionbar.css ---- */
/* Action bar and main button (docs/design.md v2.0.0 "Action bar", "Main button"); F003 tasks T016 */

/* Dock position, padding and safe area of the old tab bar (research R7) */
.actionbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  z-index: 20;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--column);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(13, 15, 31, 0.98) 70%, rgba(13, 15, 31, 0));
}
.actionbar-left,
.actionbar-right,
.actionbar-outer {
  display: contents;
}
.actionbar-left > .act {
  grid-column: 2;
  grid-row: 1;
}
.actionbar-right > .act {
  grid-column: 4;
  grid-row: 1;
}
/* F004: the fourth action at the outer right (docs/design.md "Action bar") */
.actionbar-outer > .act {
  grid-column: 5;
  grid-row: 1;
}

.act {
  display: grid;
  justify-items: center;
  gap: 3px;
  min-height: 52px;
  padding: 6px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font: 600 11px var(--font-body);
  text-decoration: none;
  cursor: pointer;
}
.act svg {
  transition:
    transform 0.25s var(--spring),
    color 0.2s;
}
.act:active svg {
  transform: scale(0.85);
}
.act.is-active svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .act:hover {
    color: var(--text);
  }
  .act:hover svg {
    color: var(--orange-2);
  }
}

.main-btn {
  position: relative;
  grid-column: 3;
  grid-row: 1;
  justify-self: center;
  width: 62px;
  height: 68px;
  margin-top: -26px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 0;
  background: var(--grad-hot);
  color: var(--ink);
  cursor: pointer;
}
.main-btn svg {
  position: relative;
  z-index: 1;
  width: 26px;
  height: 26px;
}
/* a light shimmer passes over it every 5 s */
.main-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
  transform: translateX(-130%);
  animation: main-shimmer 5s ease-in-out infinite;
}
@keyframes main-shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}
/* not available yet: raised grey, no shimmer, no hover or press */
.main-btn.hex-btn:disabled {
  background: var(--raised);
  color: var(--placeholder);
  cursor: not-allowed;
  scale: none;
  filter: none;
}
.main-btn:disabled::after {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  .main-btn::after {
    display: none;
  }
}

@media (min-width: 768px) {
  .actionbar {
    max-width: 560px;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
}

/* ---- src/app/theme/components.css ---- */
/* Feature components: docs/design.md §7 (collection card, game row, group heading, hexagon picker, forms) */

/* Mark gradients (docs/design.md §4), used by pickers, pills and group dots */
[data-mark='new'],
[data-tone='new'] {
  --tone: var(--grad-white);
  --tone-text: var(--ink);
}
[data-mark='must_have'],
[data-tone='must_have'],
[data-tone='hot'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='interested'],
[data-tone='interested'] {
  --tone: var(--grad-cool);
  --tone-text: var(--ink);
}
[data-mark='unsure'],
[data-tone='unsure'] {
  --tone: var(--grad-violet);
  --tone-text: #fff;
}
[data-mark='poop'],
[data-tone='poop'] {
  --tone: var(--grad-mud);
  --tone-text: #fff;
}
[data-mark='skip'],
[data-tone='skip'] {
  --tone: var(--grad-red);
  --tone-text: #fff;
}
[data-mark='bought'] {
  --tone: var(--grad-got);
  --tone-text: var(--ink);
}
/* hall groups (group by booth): halls in the hot gradient, "No booth yet" muted */
[data-mark='hall'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='none'] {
  --tone: linear-gradient(135deg, #6e74a0, #9aa0c8);
  --tone-text: var(--ink);
}

.section-title {
  font-size: 18px;
  margin: 20px 0 10px;
}
.section-title small {
  font: 600 13px var(--font-body);
  color: var(--muted);
  margin-left: 6px;
}
.hint {
  margin: 8px 2px 0;
  font-size: 13px;
  color: var(--muted);
}
.hint.error {
  color: #ff8a95;
}
.form {
  display: grid;
  gap: 14px;
}
.field.is-disabled {
  opacity: 0.6;
  box-shadow: none;
}
.field svg {
  flex: none;
  color: var(--muted);
}

/* Dropdown: field look with an orange hexagon as arrow */
.field.select {
  position: relative;
}
.field.select select {
  appearance: none;
  padding-right: 24px;
  cursor: pointer;
}
.field.select select option {
  background: var(--deck);
}
.field.select::after {
  content: '';
  position: absolute;
  right: 16px;
  width: 12px;
  height: 14px;
  clip-path: var(--hex);
  background: var(--grad-hot);
  pointer-events: none;
}

/* Switch ("Essen collection") */
.toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  cursor: pointer;
}
.toggle-text {
  flex: 1;
  font-weight: 600;
}
.toggle-text small {
  display: block;
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
}
.switch {
  appearance: none;
  flex: none;
  position: relative;
  width: 52px;
  height: 32px;
  margin: 6px 0;
  border-radius: var(--r-pill);
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  cursor: pointer;
  transition: background 0.2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  clip-path: var(--hex);
  background: var(--muted);
  transition: transform 0.25s var(--spring);
}
.switch:checked {
  background: var(--grad-hot);
  border-color: transparent;
}
.switch:checked::after {
  background: var(--ink);
  transform: translateX(20px);
}

/* Hexagon picker: honeycomb, every second hexagon offset down */
/* one straight, centred row of equal hexagons, whatever their labels and the phone's text scaling */
.picker {
  display: grid;
  grid-template-columns: repeat(var(--count, 4), minmax(0, 84px));
  justify-content: center;
  align-items: start;
  gap: 8px;
  margin: 12px 0 16px;
}
.picker-btn {
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 12px;
}
.picker-hex {
  display: block;
  aspect-ratio: 0.88;
  padding: 2px;
  background: var(--border-2);
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.picker-face {
  height: 100%;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 2px;
  padding: 0 4px;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  hyphens: auto;
  background: var(--raised);
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
}
.picker-emoji {
  font-style: normal;
  font-size: 22px;
}
.picker-btn[aria-pressed='true'] .picker-hex {
  background: var(--orange);
}
.picker-btn[aria-pressed='true'] .picker-face {
  background: var(--tone);
  color: var(--tone-text);
}
.picker-btn:is([data-tone='unsure'], [data-tone='poop'])[aria-pressed='true'] .picker-face {
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Collection cards with the hexagon cluster in the top-right corner */
.cards {
  display: grid;
  gap: var(--gap);
}
/* off-screen cards skip layout, paint and their cluster animation (long lists stay fast) */
.cards > .card {
  content-visibility: auto;
  contain-intrinsic-size: auto 96px;
}
.card {
  position: relative;
  display: block;
  overflow: hidden;
  color: var(--text);
  text-decoration: none;
}
.card-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  padding-right: 64px;
}
.card-name {
  min-width: 0;
  overflow-wrap: anywhere;
}
.card-sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}
/* the six counts always in one row; the text shrinks on narrow phones instead of wrapping */
.counts {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  margin: 10px 0 0;
  font: 700 clamp(12px, 3.7vw, 15px) var(--font-display);
  white-space: nowrap;
}
.cluster {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 58px;
  height: 52px;
  animation: sway 6s ease-in-out infinite;
}
.cluster i {
  position: absolute;
  width: 22px;
  height: 25px;
  background: var(--grad-dusk);
  filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
}
.cluster i:nth-child(1) {
  top: 0;
  right: 0;
}
.cluster i:nth-child(2) {
  top: 0;
  right: 24px;
  opacity: 0.7;
}
.cluster i:nth-child(3) {
  top: 20px;
  right: 12px;
  opacity: 0.85;
}
@keyframes sway {
  0%,
  100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(4deg);
  }
}
.soon-card {
  margin-bottom: 16px;
}
.soon-card .card-title {
  padding-right: 0;
}
/* F002 Share hint at the top of Config */
.hint-card .card-title {
  padding-right: 0;
}

.row-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.row-actions .btn {
  padding-inline: 10px;
}
.group {
  margin-bottom: 16px;
}
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 16px;
}
.group-title i {
  flex: none;
  width: 12px;
  height: 14px;
  background: var(--tone);
}
.group-count {
  color: var(--muted);
  font-weight: 700;
}
.fold {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  text-align: left;
}
.chev {
  margin-left: auto;
  font-size: 22px;
  transition: transform 0.2s;
}
.fold[aria-expanded='true'] .chev {
  transform: rotate(90deg);
}

.rows {
  display: grid;
  gap: var(--gap);
  margin: 0;
  padding: 0;
  list-style: none;
}
.rows[hidden] {
  display: none;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  text-align: left;
}
.row-meta {
  flex: 1;
  min-width: 0;
  display: grid;
}
.row-name {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-sub {
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* F002 "Just added": the hover highlight, kept until the user scrolls or taps (not an animation) */
.row.is-just-added {
  border-color: var(--orange);
  box-shadow: var(--lift), var(--glow);
}
.row.skip .row-name {
  text-decoration: line-through;
  color: var(--muted);
}
.row.skip .cover {
  opacity: 0.5;
}
.row .pill,
.detail-head .pill {
  flex: none;
  background: var(--tone);
  color: var(--tone-text);
}
.mark-pill {
  padding: 4px 8px;
}

/* Hexagon covers */
.cover {
  position: relative;
  flex: none;
  display: block;
}
.cover-hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--grad-dusk);
}
.cover-hex img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-initials {
  font: 700 17px var(--font-display);
  color: var(--ink);
}
.cover-got {
  position: absolute;
  right: -4px;
  bottom: -2px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--grad-got);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
}

/* Game details sheet */
.detail-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
}
.detail-sub {
  margin: 0 0 6px;
  color: var(--muted);
}
.link-out {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 700;
}
.sheet-actions {
  display: grid;
  gap: var(--gap);
  margin-top: 12px;
}

/* "Group by" under the filter in a collection */
.group-by {
  margin-top: 12px;
}

/* Config → Developer: plain links, each a full-width 44px target */
.dev-links {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.dev-links a {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 600;
}

/* Cancel and the main action side by side, the main action on the right */
.sheet-actions-row {
  grid-template-columns: 1fr 1fr;
}

/* Game info (docs/design.md §7 "Game info"): year beside the name, publisher, then three infos */
.row-year {
  font-weight: 500;
  color: var(--muted);
}
.row-info {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin-top: 2px;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  white-space: nowrap;
}
.row-info > span:first-child {
  flex: none;
}
.info-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}
.row-info .info-pills {
  flex-wrap: nowrap;
  overflow: hidden;
}
.info-pill {
  flex: none;
  padding: 1px 8px;
  border: 1px solid var(--border);
  background: var(--raised);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.info-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  margin: 0 0 12px;
}
.info-list > div {
  display: contents;
}
.info-list dt {
  color: var(--muted);
  font-size: 14px;
}
.info-list dd {
  margin: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* F003: the SPIEL preview suggestion above a BGG list link field */
.list-suggestion {
  margin-bottom: 10px;
}

/* ---- src/app/theme/fair.css ---- */
/* At the fair (US4): filter button and panel, bought line, game description, facts, price question (docs/design.md §7) */

/* Filter: one full-width button, a panel below it */
.chip {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
}
.chip[aria-pressed='true'] {
  border-color: var(--orange);
  background: var(--raised);
  box-shadow: var(--glow);
}
.seg-title {
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.seg {
  /* one column per option, all in one row */
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.seg button {
  min-height: var(--tap);
  min-width: 0;
  padding: 0 4px;
  overflow-wrap: anywhere;

  background: none;
  color: var(--muted);

}
.seg button[aria-pressed='true'] {
  background: var(--grad-hot);

}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  border-top: 1px solid var(--rim);

}
.filter-row:first-child {
  border-top: 0;
}
.filter-row input {
  flex: none;
  width: 20px;
  height: 20px;
  accent-color: var(--orange);
}
.filter-row span {
  flex: 1;
}
.filter-row small {
  font: 600 14px var(--font-display);
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .chip:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}
.chip:active,
.seg button:active {

}

/* "✅ 1 game bought, €52 spent" under the filter */
.bought-line {
  margin: 10px 2px 0;
  font-weight: 700;
  color: #7cf0c5;
}

/* Game details: description, facts, price question */
.detail-head .pill {
  margin-top: 4px;
}
.desc {
  margin: 4px 0 12px;
  font-size: 14px;
}
.muted {
  color: var(--muted);
}
.facts-box {
  margin-bottom: 8px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);

}
.facts-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0 12px;
}
.facts-by {
  font-size: 13px;
  font-weight: 700;

}
.link-btn {
  min-height: var(--tap);
  padding: 0;
  border: 0;

}
.facts-add {

}
.facts-form {

}
.price-row {

  grid-template-columns: 1fr 112px;

}
.form-actions {

  grid-template-columns: 1fr 1fr;

}
.currency {

}

/* "Groups" with Select all / Select none on the same line */
.seg-head {

  gap: 8px;
}
.seg-actions {
  display: flex;
  gap: 4px;
}
.seg-actions .link-btn {
  min-height: var(--tap);
  padding: 0 8px;
}

/* filter icon in the collection header; a dot while a filter or the hall grouping is active */
.filter-icon {
  position: relative;
}
.filter-icon.is-active::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 10px;
  height: 11px;
  clip-path: var(--hex);

}
/* what is shown while narrowed; a tap opens "Filter and group" */
.filter-summary {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: var(--tap);
  margin-top: 10px;
  padding: 6px 14px;
  border: 1px solid var(--orange);
  border-radius: var(--r-pill);

}

/* ---- src/app/theme/lists.css ---- */
/* BGG lists: list cards, list rows with +, progress, list game sheet (docs/design.md §7) */

.example {
  color: var(--text);
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* Loading progress: pages loaded so far */
.progress {
  height: 6px;
  margin-top: 10px;
  border-radius: var(--r-pill);
  background: var(--rim);
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad-hot);
}
@media (prefers-reduced-motion: no-preference) {
  .progress span {
    transition: width 0.4s ease-out;
  }
}
.list-status {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--muted);
}
.list-status p {
  margin: 0;
}
.list-status.error {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  color: #ff8a95;
}

/* List rows: the row opens the game, the hexagon + next to it does the same */
.list-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.list-item .row {
  flex: 1;
  min-width: 0;
}
.in-mark {
  font-size: 12px;
  font-weight: 700;
  color: var(--teal);
}
.add-mini {
  flex: none;
  width: 48px;
  height: 54px;
  padding: 0;
  border: 0;
  background: none;
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.add-mini .hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  background: var(--grad-hot);
  color: var(--ink);
  font: 700 26px var(--font-display);
}

/* List game sheet */
.description {
  margin: 8px 0 12px;
  color: var(--muted);
  font-size: 14px;
}

/* Multi-choice list: a hexagon tick per collection; the ticks always show the current truth */
.picks {
  display: grid;
  gap: var(--gap);
}
.pick {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  cursor: pointer;
}
.pick:has(.pick-input:focus-visible) {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}
.pick-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.tick {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 32px;
  background: var(--border-2);
}
.tick::before {
  content: '';
  width: 24px;
  height: 28px;
  clip-path: var(--hex);
  background: var(--raised);
}
.pick-input:checked + .tick {
  background: var(--orange);
}
.pick-input:checked + .tick::before {
  background: var(--grad-hot);
}
.pick-input:checked + .tick::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ink);
  font-weight: 800;
}
.pick-text {
  flex: 1;
  min-width: 0;
  display: grid;
}
.pick-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.pick-text small {
  font-size: 13px;
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .pick:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}

/* ---- src/app/theme/interaction.css ---- */
/* Interaction states: docs/design.md §8. Nothing moves on hover; press squishes; focus is orange. */
:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}

.btn,
.icon-btn,
.card,
.row,
.tile {
  transition:
    background 0.2s,
    border-color 0.2s,
    box-shadow 0.25s,
    color 0.2s,
    scale 0.25s var(--spring);
}

@media (hover: hover) and (pointer: fine) {
  .card:not([aria-disabled='true']):hover,
  .row:hover,
  .tile:hover,
  .field:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .btn:not(:disabled):not(.btn-primary):not(.btn-bought):hover,
  .icon-btn:hover {
    background: var(--grad-hot);
    border-color: transparent;
    color: var(--ink);
  }
  .btn-danger:not(:disabled):hover {
    background: var(--grad-red);
    color: #fff;
  }
  .btn-primary:not(:disabled):hover,
  .btn-bought:not(:disabled):hover {
    box-shadow: var(--lift), 0 0 22px rgba(255, 176, 32, 0.55);
  }
  .hex-btn:hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Press: a short squish that springs back (touch and pointer) */
.card:active,
.row:active,
.tile:active {
  scale: 0.98;
  transition-duration: 0.08s;
}
.btn:not(:disabled):active,
.icon-btn:active {
  scale: 0.96;
  transition-duration: 0.08s;
}
.hex-btn {
  transition:
    scale 0.25s var(--spring),
    filter 0.2s;
}
.hex-btn:active {
  scale: 0.9;
  transition-duration: 0.08s;
}

/* Tap pulse: an orange hexagon expanding from the tap point */
.tap-pulse {
  position: fixed;
  z-index: 60;
  width: 56px;
  height: 64px;
  margin: -32px 0 0 -28px;
  clip-path: var(--hex);
  background: radial-gradient(circle, rgba(255, 176, 32, 0.55), rgba(255, 122, 26, 0) 70%);
  pointer-events: none;
  animation: tap-pulse 0.5s ease-out forwards;
}
@keyframes tap-pulse {
  from {
    transform: scale(0.3);
    opacity: 1;
  }
  to {
    transform: scale(1.6);
    opacity: 0;
  }
}

/* Reduced motion (docs/design.md §9): every animation and press squish off */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  .card:active,
  .row:active,
  .tile:active,
  .btn:active,
  .icon-btn:active,
  .hex-btn:active,
  .hex-btn:hover {
    scale: none;
  }
  .tap-pulse {
    display: none;
  }
}

/* ---- src/app/theme/ticker.css ---- */
/* Ticker for headings too long for their row (docs/design.md v2.0.0 "Ticker"); F003 tasks T024 */
.ticker {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  overflow-wrap: normal;
}
.ticker > span {
  display: inline-block;
}
/* soft fades at both edges; the left padding keeps the first letter clear of the fade */
.ticker.is-long {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  padding-left: 10px;
  margin-left: -10px;
}
.ticker.is-long > span {
  animation: ticker var(--ticker-time, 8s) linear infinite;
}
@keyframes ticker {
  /* read the start */
  0%,
  18% {
    transform: translateX(0);
  }
  /* the end is visible, then start over */
  82%,
  100% {
    transform: translateX(calc(-1 * var(--ticker-shift)));
  }
}
/* reduced motion: the text stands still and ends in "…" */
@media (prefers-reduced-motion: reduce) {
  .ticker {
    text-overflow: ellipsis;
  }
  .ticker.is-long {
    -webkit-mask-image: none;
    mask-image: none;
    padding-left: 0;
    margin-left: 0;
  }
  .ticker.is-long > span {
    display: inline;
    animation: none;
  }
}

/* ---- src/app/theme/swipe.css ---- */
/* Swipe screen and list picker: docs/design.md §7 (swipe card), §9 (swipe motion) */

/* A card dragged or flung past the edge never scrolls the page sideways */
.swipe-screen {
  overflow-x: clip;
}

/* Source note: which list, whether facts are kept */
.swipe-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.swipe-note b {
  color: var(--text);
}
.swipe-note > .hex {
  flex: none;
  width: 14px;
  height: 16px;
  margin-top: 2px;
  background: var(--grad-dusk);
}

/* Card stack */
.deck {
  position: relative;
  height: min(400px, 54vh);
  min-height: 340px;
  margin: 0 0 14px;
}
.swipe-card {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  padding: 20px 18px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, #1f2350 0%, var(--deck) 70%);
  box-shadow: var(--lift);
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
}
.swipe-card > * {
  flex-shrink: 0;
}
.swipe-card.behind {
  transform: scale(0.95) translateY(14px);
  opacity: 0.6;
}
.swipe-card.top {
  touch-action: pan-y;
  cursor: grab;
  transition: transform 0.5s var(--spring);
}
.swipe-card.top.dragging {
  transition: none;
  cursor: grabbing;
}
.swipe-card.enter {
  animation: swipe-card-in 0.45s var(--spring);
}
@keyframes swipe-card-in {
  from {
    transform: scale(0.94) translateY(16px);
    opacity: 0.6;
  }
}
.swipe-card.leaving {
  pointer-events: none;
  animation: swipe-fling 0.38s cubic-bezier(0.5, 0, 0.75, 0) forwards;
}
@keyframes swipe-fling {
  from {
    transform: translateX(var(--from-x)) rotate(calc(var(--from-x) / 14px * 1deg));
  }
  to {
    transform: translate(calc(var(--dir) * 520px), -40px) rotate(calc(var(--dir) * 30deg));
    opacity: 0;
  }
}
.swipe-card .cover {
  margin-bottom: 12px;
}
.swipe-name {
  margin: 0;
  font: 700 24px/1.15 var(--font-display);
}
.swipe-year {
  margin: 2px 0 8px;
  color: var(--muted);
}
.swipe-desc {
  display: -webkit-box;
  margin: 0 0 10px;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
}
.swipe-wait {
  justify-content: center;
  gap: 12px;
  cursor: default;
}
.swipe-wait .hex {
  width: 56px;
  height: 64px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.swipe-wait p {
  margin: 0;
  color: var(--muted);
}

/* ADD / NOPE stamps grow while dragging; the leaving card shows its stamp in full */
.swipe-stamp {
  position: absolute;
  top: 20px;
  padding: 4px 10px;
  border: 2px solid;
  border-radius: 10px;
  font: 700 18px var(--font-display);
  opacity: 0;
  scale: 0.7;
}
.swipe-stamp.add {
  left: 16px;
  color: var(--teal);
  rotate: -12deg;
}
.swipe-stamp.nope {
  right: 16px;
  color: var(--danger);
  rotate: 12deg;
}
.leaving-right .swipe-stamp.add,
.leaving-left .swipe-stamp.nope {
  opacity: 1;
  scale: 1.2;
}

/* ✕ / ✓ hexagon buttons */
.swipe-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
}
.swipe-btn {
  display: grid;
  place-items: center;
  width: 72px;
  height: 80px;
  border: 0;
  clip-path: var(--hex);
  font: 700 28px var(--font-display);
  cursor: pointer;
}
.swipe-btn.no {
  background: var(--grad-red);
  color: #fff;
}
.swipe-btn.yes {
  background: var(--grad-cool);
  color: #04161a;
}
.swipe-btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.swipe-legend {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0 0;
  padding: 0 4px;
  color: var(--muted);
  font-size: 13px;
}

/* List picker */
.pick-list {
  display: grid;
  gap: var(--gap);
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
}
.pick {
  display: grid;
  gap: 4px;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck-2);
  box-shadow: var(--lift);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.pick:disabled {
  opacity: 0.45;
  cursor: default;
}
.pick-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-weight: 700;
}
.pick small {
  color: var(--muted);
  font-size: 13px;
}
@media (hover: hover) and (pointer: fine) {
  .pick:not(:disabled):hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .swipe-btn:not(:disabled):hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Reduced motion: no tilt, fling or pop-in; the card just changes */
@media (prefers-reduced-motion: reduce) {
  .swipe-card.leaving {
    display: none;
  }
}

/* "Add by list": the chosen list is clearly marked (orange edge, glow and a tick) */
.pick[aria-pressed='true'] {
  position: relative;
  border: 2px solid var(--orange);
  box-shadow: var(--lift), var(--glow);
  padding-right: 44px;
}
.pick[aria-pressed='true']::after {
  content: '✓';
  position: absolute;
  top: 50%;
  right: 12px;
  display: grid;
  place-items: center;
  width: 24px;
  height: 27px;
  transform: translateY(-50%);
  clip-path: var(--hex);
  background: var(--grad-hot);
  color: var(--ink);
  font-weight: 700;
}
.pick-list,
.pick-new,
.pick-empty {
  margin-top: 16px;
}
.pick-intro {
  margin: 0 0 14px;
}

/* All game info on the card (FR-010): compact, left-aligned; a long card scrolls up and down
   (pan-y), sideways stays the swipe */
.swipe-card.top {
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.swipe-card .info-list {
  width: 100%;
  margin: 4px 0 0;
  gap: 4px 12px;
  font-size: 14px;
  text-align: left;
}
.swipe-card .info-list dt {
  font-size: 13px;
}
.swipe-card .info-list dd {
  font-weight: 600;
}

/* ---- F005 prototype additions ---- */
[data-mark='later'], [data-tone='later'] { --tone: linear-gradient(135deg, #d946ef 0%, #f9a8d4 100%); --tone-text: var(--ink); }
.proto-later-teal [data-mark='later'], .proto-later-teal [data-tone='later'] { --tone: linear-gradient(135deg, #0ea5e9 0%, #a5f3fc 100%); }

.proto-bar { position: relative; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px; background: #05060e; border-bottom: 1px solid var(--rim); font-size: 12px; color: var(--muted); }
.proto-bar select { background: var(--deck-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; font: inherit; }

  border: 1px solid transparent; background: linear-gradient(var(--deck), var(--deck)) padding-box, var(--tone, linear-gradient(var(--border), var(--border))) border-box; }

.proto-edge .crow::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 7px; border-radius: var(--r-md) 0 0 var(--r-md); background: var(--tone); }

.ract .rhex { width: 32px; height: 36px; display: grid; place-items: center; clip-path: var(--hex); background: var(--raised); color: var(--text); transition: background 0.2s, color 0.2s, scale 0.25s var(--spring); }
.ract:active .rhex { scale: 0.85; }

/* Quick filters between the two lines */
.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.stock.no::before { background: var(--danger); }
.cond { display: inline-block; padding: 0 7px; border: 1px solid var(--violet); border-radius: var(--r-pill); color: #c4b5fd; font-weight: 700; font-size: 11px; line-height: 18px; }
.unknown-switch { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; font-size: 14px; color: var(--muted); min-height: 44px; }
.unknown-switch input { width: 20px; height: 20px; accent-color: var(--orange); }
.sources-line { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.fail-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 0; padding: 8px 12px; border: 1px solid var(--danger); border-radius: var(--r-md); font-size: 13px; }
.result-status { display: flex; align-items: center; gap: 8px; min-height: 24px; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.spin-hex { flex: none; width: 16px; height: 18px; clip-path: var(--hex); background: var(--grad-hot); animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { height: 72px; border-radius: var(--r-md); border: 1px solid var(--rim); background: linear-gradient(90deg, var(--deck) 0%, var(--deck-2) 50%, var(--deck) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel, .spin-hex { animation: none; } }
.srow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--deck); box-shadow: var(--lift); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.kind { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: var(--r-pill); border: 1px solid var(--violet); color: #c4b5fd; font-size: 11px; font-weight: 700; line-height: 18px; }
.search-hint { margin: 6px 0 12px; font-size: 13px; color: var(--muted); }
/* folded Prices section in a game's details */
.prices-sec { margin: 12px 0; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--deck); }
.prices-toggle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 14px; border: 0; background: none; color: var(--text); font: 700 16px var(--font-display); text-align: left; cursor: pointer; }
.prices-toggle small { margin-left: auto; color: var(--muted); font: 600 12px var(--font-body); }
.prices-toggle .chev { color: var(--orange); transition: transform 0.2s; }
.prices-toggle[aria-expanded='true'] .chev { transform: rotate(90deg); }
.prices-body { padding: 0 12px 12px; }
.prices-body .offer { box-shadow: none; background: var(--deck-2); }
.menu { top: 96px; } /* below the proto bar and the app bar */
</style>
</head>
<body>
<div class="proto-bar">
  <label for="start">Start</label>
  <select id="start">
    <option value="menu">Menu with Buy first</option>
    <option value="buy">Buy: search</option>
    <option value="prices">Price screen: Cascadia</option>
    <option value="loading">Price screen: loading</option>
    <option value="failed">Price screen: one source failed</option>
    <option value="none">Price screen: no offers</option>
    <option value="details">Game details: Prices folded</option>
    <option value="details-open">Game details: Prices expanded</option>
  </select>
</div>
<div id="root"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const svgI = (body, w = 2, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`
const ICON = {
  buy: svgI('<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M10 15.5c.4.6 1.1 1 2 1 1.2 0 2-.6 2-1.5 0-2-4-1-4-3 0-.9.8-1.5 2-1.5.9 0 1.6.4 2 1"/>', 2),
  collections: svgI('<path d="M12 2 20 6.5v11L12 22l-8-4.5v-11z"/><path d="M12 22V12M20 6.5 12 12 4 6.5"/>'),
  lists: svgI('<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>'),
  search: svgI('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>', 2),
  search18: svgI('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>', 2, 18),
  // the app's cog (src/app/components/icons.tsx IconConfig)
  config: svgI('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  menu: svgI('<path d="M4 7h16M4 12h16M4 17h16"/>', 2.4),
}
const $ = s => document.querySelector(s)
const root = $('#root'), layer = $('#layer')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const eur = c => '€' + (c / 100).toFixed(2).replace('.', ',')
const initials = n => n.split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase()
const cover = (name, size) => `<span class="cover" style="width:${size}px;height:${Math.round(size * 1.12)}px" aria-hidden="true"><span class="cover-hex hex"><span class="cover-initials" style="font-size:${Math.round(size / 3.2)}px">${esc(initials(name))}</span></span></span>`
function toast(t) { const el = $('#toast'); el.innerHTML = '<i class="hex"></i>' + esc(t); el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400) }

// new offers (price in cents, shipping in cents or null = unknown); lang 'en' | 'de' | 'unknown' | other (never shown)
const NEW = [
  { shop: 'Milan-Spiele', edition: 'Cascadia (Kosmos)', lang: 'de', price: 2949, ship: 590, stock: true, src: 'brettspielpreise.de' },
  { shop: 'Fantasywelt', edition: 'Cascadia (Kosmos)', lang: 'de', price: 3390, ship: 0, stock: false, src: 'brettspielpreise.de' },
  { shop: 'Amazon.de', edition: 'Cascadia (Flatout Games)', lang: 'en', price: 3499, ship: 0, stock: true, src: 'brettspielpreise.de' },
  { shop: 'Spiele-Offensive', edition: 'Cascadia – Im Herzen der Natur', lang: 'de', price: 3199, ship: 495, stock: true, src: 'brettspielpreise.de' },
  { shop: 'Philibert', edition: 'Cascadia (English edition)', lang: 'en', price: 3050, ship: 990, stock: true, src: 'brettspielpreise.de' },
  { shop: 'Thalia', edition: 'Cascadia', lang: 'de', price: 3999, ship: 0, stock: true, src: 'brettspielpreise.de' },
  { shop: 'Brettspielversand XY', edition: 'Cascadia', lang: 'unknown', price: 2799, ship: null, stock: true, src: 'brettspielpreise.de' },
  { shop: 'Philibert', edition: 'Cascadia (édition française)', lang: 'fr', price: 2890, ship: 990, stock: true, src: 'brettspielpreise.de' },
]
// used offers: price in the listing's currency, approximate euro for sorting
const USED = [
  { market: 'BGG marketplace', cond: 'Like new', lang: 'en', cur: '€', price: 2200, eur: 2200, ship: null, note: 'Played twice, cards sleeved, all tokens punched and bagged.', listed: '29 Oct 2026' },
  { market: 'BGG marketplace', cond: 'Very good', lang: 'unknown', cur: '£', price: 2500, eur: 2930, ship: null, note: 'Collection only or buyer pays shipping from Bristol.', listed: '30 Oct 2026' },
  { market: 'unknowns.de', cond: 'Very good', lang: 'de', cur: '€', price: 2000, eur: 2000, ship: 500, note: 'Cascadia DE, 1x gespielt, Versand 5 € als Paket.', listed: '2 Nov 2026' },
  { market: 'eBay.de', cond: 'Good', lang: 'de', cur: '€', price: 1850, eur: 1850, ship: 549, note: 'Cascadia Brettspiel Kosmos – vollständig, sehr guter Zustand', listed: '4 Nov 2026', extra: 'Auction · current bid · 1 day 4 h left' },
  { market: 'eBay.de', cond: 'Like new', lang: 'en', cur: '€', price: 2690, eur: 2690, ship: 0, note: 'Cascadia board game (English), unplayed, shrink removed', listed: '3 Nov 2026', extra: 'Buy it now' },
  { market: 'Kleinanzeigen', cond: 'Very good', lang: 'de', cur: '€', price: 2200, eur: 2200, ship: null, note: 'Cascadia Spiel des Jahres 2022, komplett, Nichtraucher', listed: '5 Nov 2026', extra: 'VB · pickup in Essen-Rüttenscheid' },
]
const RESULTS = [
  { name: 'Cascadia', year: 2021, exp: false },
  { name: 'Cascadia: Landmarks', year: 2023, exp: true },
  { name: 'Cascadia Junior', year: 2025, exp: false },
]

let S
const total = o => o.price + (o.ship ?? 0)
const shownNew = () => NEW.filter(o => (o.lang === 'en' || o.lang === 'de' || (o.lang === 'unknown' && S.unknown)) && (S.lang === 'both' || o.lang === S.lang || o.lang === 'unknown'))
  .sort((a, b) => (b.stock - a.stock) || total(a) - total(b))
const shownUsed = () => USED.filter(o => S.lang === 'both' || o.lang === S.lang || o.lang === 'unknown').sort((a, b) => a.eur + (a.ship ?? 0) - (b.eur + (b.ship ?? 0)))
const LANG = { en: 'EN', de: 'DE', unknown: '?' }
const LANGNAME = { en: 'English', de: 'German', unknown: 'language unknown' }

function newOffer(o) {
  const ship = o.ship == null ? 'shipping unknown' : o.ship === 0 ? 'free shipping' : `+ ${eur(o.ship)} shipping`
  return `<li><a class="offer${o.stock ? '' : ' out'}" href="#" data-act="go" data-shop="${esc(o.shop)}" aria-label="${esc(o.shop)}, ${eur(total(o))}, ${LANGNAME[o.lang]}${o.stock ? '' : ', not in stock'}">
    <span class="offer-shop">${esc(o.shop)}<span class="ext">↗</span></span>
    <span class="offer-total">${eur(total(o))}<small>${eur(o.price)} ${ship}</small></span>
    <span class="offer-meta"><span class="lang ${o.lang}">${LANG[o.lang]}</span><span>${esc(o.edition)}</span><span class="stock${o.stock ? '' : ' no'}">${o.stock ? 'in stock' : 'not in stock'}</span></span>
  </a></li>`
}
function usedOffer(o) {
  const price = o.cur === '€' ? eur(o.price) : `${o.cur}${(o.price / 100).toFixed(2).replace('.', ',')} ≈ ${eur(o.eur)}`
  const ship = o.ship == null ? 'shipping unknown' : o.ship === 0 ? 'free shipping' : `+ ${eur(o.ship)} shipping`
  return `<li><a class="offer" href="#" data-act="go" data-shop="${esc(o.market)}" aria-label="${esc(o.market)}, ${price}, ${o.lang === 'unknown' ? 'language not stated' : LANGNAME[o.lang]}, used">
    <span class="offer-shop">${esc(o.market)}<span class="ext">↗</span></span>
    <span class="offer-total">${price}<small>${ship}</small></span>
    <span class="offer-meta"><span class="cond">Used · ${o.cond}</span><span class="lang ${o.lang}">${LANG[o.lang]}</span>${o.lang === 'unknown' ? '<span>language not stated</span>' : ''}${o.extra ? `<span>${esc(o.extra)}</span>` : ''}<span>listed ${o.listed}</span></span>
    <span class="offer-note">“${esc(o.note)}”</span>
  </a></li>`
}
function offersHTML({ compact = false } = {}) {
  if (S.state === 'loading') return `<p class="result-status" role="status"><span class="spin-hex"></span>Looking for prices…</p><div class="offers">${'<div class="skel"></div>'.repeat(3)}</div>`
  if (S.state === 'none') return `<div class="empty"><div class="hex"></div><h2>No offers in English or German found</h2><p>Shops may list it under another name.</p><div class="actions"><button class="btn" data-act="go" data-shop="brettspielpreise.de">Open on brettspielpreise.de</button></div></div>`
  const n = shownNew(), u = shownUsed()
  const hiddenUnknown = NEW.filter(o => o.lang === 'unknown').length
  return `<div class="seg lang-seg" role="group" aria-label="Language">${[['both', 'Both'], ['en', 'English'], ['de', 'German']].map(([v, t]) => `<button type="button" data-act="lang" data-v="${v}" aria-pressed="${S.lang === v}">${t}</button>`).join('')}</div>
    ${S.fair ? `<p class="fair-line">At the fair: ${eur(3800)} <small>· booth 3-A101, Essen 2026</small></p>` : ''}
    <div class="offer-group"><h3><button type="button" class="group-fold" data-act="fold" data-g="new" aria-expanded="${!S.folded.has('new')}" aria-controls="offers-new">New<small>${n.length} offers · cheapest first</small><span class="chev" aria-hidden="true">›</span></button></h3></div>
    <ul class="offers" id="offers-new" aria-label="New offers" ${S.folded.has('new') ? 'hidden' : ''}>${n.map(newOffer).join('')}</ul>
    ${hiddenUnknown && !compact && !S.folded.has('new') ? `<label class="unknown-switch"><input type="checkbox" data-act="unknown" ${S.unknown ? 'checked' : ''}> Show offers with unknown language (${hiddenUnknown})</label>` : ''}
    ${S.state === 'failed' ? `<div class="fail-line"><span>idealo is not reachable right now.</span><button class="link-btn" data-act="retry">Retry</button></div>` : ''}
    <div class="offer-group"><h3><button type="button" class="group-fold" data-act="fold" data-g="used" aria-expanded="${!S.folded.has('used')}" aria-controls="offers-used">Used<small>${u.length} offers · from Europe</small><span class="chev" aria-hidden="true">›</span></button></h3></div>
    <ul class="offers" id="offers-used" aria-label="Used offers" ${S.folded.has('used') ? 'hidden' : ''}>${u.map(usedOffer).join('')}</ul>
    <p class="sources-line">New: brettspielpreise.de${S.state === 'failed' ? '' : ', idealo'}, checked 2 h ago. Used: BGG marketplace, eBay.de, Kleinanzeigen, unknowns.de.</p>`
}

const appbar = () => `<header class="appbar"><span class="appbar-name">Board-a-licious</span><button type="button" class="menu-btn" data-act="menu" aria-label="Menu" aria-expanded="${S.menu}">${ICON.menu}</button></header>`
function menuHTML() {
  if (!S.menu) return ''
  const items = [['buy', 'Buy', ICON.buy], ['collections', 'Collections', ICON.collections], ['lists', 'BGG lists', ICON.lists], ['search', 'Search', ICON.search], ['config', 'Config', ICON.config]]
  return `<div class="menu-scrim" data-act="menu"></div><nav class="menu" aria-label="Places"><ul>${items.map(([k, l, i]) => `<li><a href="#" data-act="place" data-k="${k}" ${S.screen === k || (k === 'buy' && S.screen === 'prices') ? 'aria-current="page"' : ''}>${i}<span>${l}</span></a></li>`).join('')}</ul></nav>`
}
function buyScreen() {
  const rows = S.q.trim().length >= 2 && S.searched ? RESULTS : []
  return `<div class="top"><div class="top-title"><h1>Buy</h1></div></div>
  <main class="screen">
    <label class="label" for="bq">Find a game's prices</label>
    <div class="field search">${ICON.search18}<input id="bq" type="search" placeholder="Game name, e.g. Cascadia" autocomplete="off" value="${esc(S.q)}"></div>
    <p class="search-hint">Type at least 2 letters.</p>
    <hr class="separator" />
    <p class="result-status" role="status">${rows.length ? `${rows.length} games · exact matches first` : ''}</p>
    <ul class="rows">${rows.map((r, i) => `<li><button type="button" class="srow" data-act="pick" data-i="${i}" aria-label="${esc(r.name)}, ${r.year}${r.exp ? ', expansion' : ''}">${cover(r.name, 52)}<span class="row-meta"><span class="row-name">${esc(r.name)}</span><span class="row-sub">${r.year}${r.exp ? '<span class="kind">Expansion</span>' : ''}</span></span></button></li>`).join('')}</ul>
    ${rows.length ? '' : '<p class="proto-note">Type “cascad”. Same search as the Search place; picking a game opens its prices (no + here).</p>'}
  </main>`
}
function pricesScreen() {
  return `<div class="top"><a class="icon-btn back" href="#" data-act="back" aria-label="Back">‹</a><div class="top-title"><h1>Prices</h1></div></div>
  <main class="screen">
    <div class="game-head">${cover('Cascadia', 64)}<span class="row-meta"><span class="row-name">Cascadia</span><span class="row-sub">2021 · Flatout Games</span></span></div>
    <hr class="separator" />
    <div id="offers">${offersHTML()}</div>
    <p class="proto-note">A tap on an offer opens the shop's page (here: a toast). French editions are never listed; unknown language only with the switch. BGG marketplace: European currencies only, others with ≈ €.</p>
  </main>`
}
function render() {
  const body = S.screen === 'buy' ? buyScreen() : S.screen === 'prices' ? pricesScreen() : `<div class="top"><div class="top-title"><h1>Essen 2026</h1></div></div><main class="screen"><p class="proto-note">A collection. Pick “Game details” in the Start menu, or open the menu: Buy is first.</p></main>`
  root.innerHTML = `<div class="app">${appbar()}${body}</div>${menuHTML()}`
}
function detailsBody() {
  return `<h2 class="sheet-title">Cascadia</h2>
  <div class="detail-head">${cover('Cascadia', 84)}<div><p class="detail-sub">Flatout Games · 2021</p><a class="link-out">Open on BoardGameGeek</a></div></div>
  <p class="proto-note" style="margin:6px 0">… category picker, info box (players, poll, ratings) as today …</p>
  <section class="prices-sec">
    <button type="button" class="prices-toggle" data-act="toggle-prices" aria-expanded="${S.open}" aria-controls="prices-body"><span aria-hidden="true">💶</span>Prices<small>${S.open ? '' : 'from ' + eur(2000)}</small><span class="chev" aria-hidden="true">›</span></button>
    <div class="prices-body" id="prices-body" ${S.open ? '' : 'hidden'}>${S.open ? offersHTML({ compact: true }) : ''}</div>
  </section>
  <div class="sheet-actions"><button type="button" class="btn btn-block btn-bought">✅ Bought it</button></div>
  <p class="proto-note">“from €20” appears only once prices were loaded in the last hours; folded, nothing is loaded. Expanded: the same offers as the price screen, with the fair price on top.</p>`
}
function openDetails() {
  layer.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Cascadia" tabindex="-1"><div class="sheet-grip"></div><div id="sheet-body">${detailsBody()}</div></div>`
}
const redrawOffers = () => { const o = $('#offers'); if (o) o.innerHTML = offersHTML(); const b = $('#sheet-body'); if (b) b.innerHTML = detailsBody() }
function load(after = 'ok') { S.state = 'loading'; redrawOffers(); setTimeout(() => { S.state = after; redrawOffers() }, 1100) }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return
  e.preventDefault()
  const a = t.dataset.act
  if (a === 'menu') { S.menu = !S.menu; return render() }
  if (a === 'place') { S.menu = false; S.screen = t.dataset.k === 'buy' ? 'buy' : 'other'; render(); return $('#bq')?.focus() }
  if (a === 'pick') { S.screen = 'prices'; S.fair = false; render(); return load() }
  if (a === 'back') { S.screen = 'buy'; render(); return }
  if (a === 'lang') { S.lang = t.dataset.v; return redrawOffers() }
  if (a === 'fold') { const g = t.dataset.g; S.folded.has(g) ? S.folded.delete(g) : S.folded.add(g); return redrawOffers() }
  if (a === 'unknown') { S.unknown = t.checked; return redrawOffers() }
  if (a === 'retry') return load()
  if (a === 'go') return toast(`Opens ${t.dataset.shop} in a new tab`)
  if (a === 'toggle-prices') { S.open = !S.open; S.fair = true; redrawOffers(); if (S.open) load(); return }
  if (a === 'close') { layer.innerHTML = ''; return }
})
document.addEventListener('input', e => {
  if (e.target.id !== 'bq') return
  S.q = e.target.value; S.searched = false
  clearTimeout(S.timer)
  S.timer = setTimeout(() => { S.searched = true; const pos = e.target.selectionStart; render(); const f = $('#bq'); f.focus(); f.setSelectionRange(pos, pos) }, 750)
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') { layer.innerHTML = ''; if (S.menu) { S.menu = false; render() } } })

function start() {
  const s = $('#start').value
  S = { screen: { buy: 'buy', prices: 'prices', loading: 'prices', failed: 'prices', none: 'prices' }[s] || 'other', menu: s === 'menu', q: '', searched: false, lang: 'both', unknown: false, state: { failed: 'failed', none: 'none', loading: 'loading' }[s] || 'ok', folded: new Set(), fair: false, open: s === 'details-open' }
  layer.innerHTML = ''
  render()
  if (s.startsWith('details')) { S.fair = true; openDetails() }
  if (s === 'buy') $('#bq')?.focus()
}
$('#start').onchange = start
start()
</script>
</body>
</html>
