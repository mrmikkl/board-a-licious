/* ---- src/app/theme/tokens.css ---- */
/* Design tokens: docs/design.md §3–§6, one-to-one */
:root {
  --ink: #0d0f1f;
  --deck: #151831;
  --deck-2: #1d2142;
  --rim: #2c3160;
  --border: #3a4078;
  --border-2: #4a5196;
  --raised: #232852;
  --text: #eceeff;
  --muted: #9aa0c8;
  --placeholder: #6e74a0;
  --orange: #ff7a1a;
  --orange-2: #ffb020;
  --indigo: #4c5bff;
  --teal: #14c8c8;
  --violet: #8b5cf6;
  --danger: #ff4d5e;
  --got: #0fb98f;

  --grad-hot: linear-gradient(135deg, #ff7a1a 0%, #ffb020 100%);
  --grad-cool: linear-gradient(135deg, #4c5bff 0%, #14c8c8 100%);
  --grad-violet: linear-gradient(135deg, #6d4ae0 0%, #a78bfa 100%);
  --grad-mud: linear-gradient(135deg, #7a6046 0%, #b0916e 100%);
  --grad-red: linear-gradient(135deg, #c2183a 0%, #ff4d5e 100%);
  --grad-got: linear-gradient(135deg, #0fb98f 0%, #7cf0c5 100%);
  --grad-dusk: linear-gradient(135deg, #8b5cf6 0%, #4c5bff 55%, #14c8c8 100%);
  --grad-white: linear-gradient(135deg, #ffffff 0%, #c9cdf0 100%);
  --grad-separator: linear-gradient(90deg, #ff7a1a 0%, #8b5cf6 100%);

  --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  --lift: 0 8px 22px rgba(3, 4, 12, 0.55), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --glow: 0 0 0 1px var(--orange), 0 0 18px rgba(255, 122, 26, 0.45);

  --font-display: 'Chakra Petch', 'Avenir Next Condensed', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;
  --tap: 44px;
  --gutter: 16px;
  --column: 440px;
  --gap: 8px;

  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---- src/app/theme/base.css ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  font-weight: 700;
  margin: 0;
}
a {
  color: var(--orange-2);
}
.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Layout: the phone column (docs/design.md §6) */
.app {
  position: relative;
  max-width: var(--column);
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
.screen {
  position: relative;
  z-index: 1;
  padding: 0 var(--gutter);
}
.lead {
  color: var(--muted);
  margin: 0 0 16px;
  font-size: 14px;
}
.hex {
  clip-path: var(--hex);
}
.separator {
  height: 2px;
  border: 0;
  margin: 16px 0;
  background: var(--grad-separator);
  border-radius: 2px;
}

/* Surfaces */
.card {
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--lift);
  padding: 16px;
}
.field {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  padding: 0 14px;
  min-height: 50px;
}
.field:focus-within {
  border-color: var(--orange);
}
.field input,
.field select {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 12px 0;
}
.field input::placeholder {
  color: var(--placeholder);
}
.label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin: 0 0 6px;
}

/* Buttons (docs/design.md §7): text on gradients follows the contrast rule of §3 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 10px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-2);
  background: var(--raised);
  font-weight: 700;
  box-shadow: var(--lift);
  text-decoration: none;
  color: var(--text);
}
.btn-block {
  width: 100%;
}
.btn-primary {
  background: var(--grad-hot);
  border-color: transparent;
  color: var(--ink);
}
.btn-bought {
  background: var(--grad-got);
  border-color: transparent;
  color: var(--ink);
}
.btn-danger {
  /* --danger itself reaches only 4.4:1 on the raised surface; text needs 4.5:1 (docs/design.md §3) */
  color: #ff6b78;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  font-size: 18px;
  line-height: 1;
}

/* Badges and pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
}

/* Empty state */
.empty {
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
  padding: 40px 8px;
}
.empty .hex {
  width: 72px;
  height: 82px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.empty h2 {
  font-size: 18px;
}
.empty p {
  margin: 0;
  color: var(--muted);
}
.empty .actions {
  display: grid;
  gap: var(--gap);
  width: 100%;
  margin-top: 8px;
}

/* ---- src/app/theme/shell.css ---- */
/* App shell: app bar, menu, screen heading, sheet, toast (docs/design.md §6, §7) */

/* App bar: its own sticky band on every screen; above the menu's scrim, so ☰ closes it again */
.appbar {
  position: sticky;
  top: 0;
  z-index: 28;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 2px var(--gutter);
  background: var(--grad-hot);
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(255, 122, 26, 0.25);
}
.appbar-logo {
  width: 34px;
  height: auto;
}
.appbar-name {
  grid-column: 2;
  text-align: center;
  font: 700 19px/1 var(--font-display);
  letter-spacing: 0.02em;
}
/* a 38px translucent circle inside a 44px touch area */
.menu-btn {
  grid-column: 3;
  justify-self: end;
  position: relative;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  cursor: pointer;
}
.menu-btn::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: rgba(13, 15, 31, 0.14);
  border: 1px solid rgba(13, 15, 31, 0.25);
  transition: background 0.2s;
}
.menu-btn svg {
  position: relative;
}
.menu-btn[aria-expanded='true']::before {
  background: rgba(13, 15, 31, 0.28);
}
.menu-btn:focus-visible {
  outline-color: var(--ink);
}
@media (hover: hover) and (pointer: fine) {
  .menu-btn:hover::before {
    background: rgba(13, 15, 31, 0.24);
  }
}

/* Menu: a solid panel just below the app bar at the right; between the action bar and sheets */
.menu-scrim {
  position: fixed;
  inset: 0;
  z-index: 26;
  background: rgba(5, 6, 14, 0.5);
  animation: fade-in 0.18s ease-out;
}
.menu {
  position: fixed;
  z-index: 27;
  right: max(var(--gutter), calc(50% - var(--column) / 2 + var(--gutter)));
  width: min(260px, calc(100% - 2 * var(--gutter)));
  margin-top: 8px;
  padding: 8px;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  transform-origin: top right;
  animation: menu-in 0.18s ease-out;
}
.menu ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.menu a {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 12px;
  border-radius: 12px;
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.menu a svg {
  color: var(--muted);
}
.menu a[aria-current='page'] {
  background: var(--raised);
}
.menu a[aria-current='page'] svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .menu a:hover {
    background: var(--raised);
  }
}
@keyframes menu-in {
  from {
    opacity: 0;
    transform: scale(0.94);
  }
}
@media (prefers-reduced-motion: reduce) {
  .menu,
  .menu-scrim {
    animation: none;
  }
}

/* Screen heading: back (only where it belongs), title, an element right after it */
.top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px var(--gutter) 10px;
}
.top-title {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 4px;
  justify-items: start;
}
.top h1 {
  font-size: 22px;
  line-height: 1.15;
  /* at most two lines, then "…" */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.top-actions {
  flex: none;
  display: flex;
  gap: 8px;
}
@media (min-width: 600px) {
  .top h1 {
    font-size: 26px;
  }
}
.back {
  font-size: 26px;
  text-decoration: none;
  color: var(--text);
}

/* the light passing over the main button every 5 s */
@keyframes shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(5, 6, 14, 0.6);
  animation: fade-in 0.2s ease-out;
}
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 31;
  width: 100%;
  max-width: var(--column);
  max-height: 88dvh;
  overflow-y: auto;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #1a1e3e 0%, var(--deck) 40%);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-top: 1px solid var(--rim);
  padding: 10px var(--gutter) calc(24px + env(safe-area-inset-bottom));
  animation: sheet-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet:focus {
  outline: none;
}
.sheet-grip {
  /* a 5px bar with a 44px tall touch area around it */
  width: 88px;
  height: 25px;
  margin: -10px auto 2px;
  background: linear-gradient(var(--rim), var(--rim)) center / 44px 5px no-repeat;
  border-radius: 3px;
}
.sheet-title {
  font-size: 23px;
  margin-bottom: 12px;
}
@keyframes sheet-in {
  from {
    transform: translate(-50%, 100%);
  }
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  transform: translate(-50%, 20px);
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 600;
}
/* above the action bar, near the bottom where there is none (research R7) */
body:has(.actionbar) .toast {
  bottom: calc(100px + env(safe-area-inset-bottom));
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast i {
  flex: none;
  width: 10px;
  height: 11px;
  background: var(--orange);
}

/* Expired sign-in: above the screen, solid like every interactive surface */
.signin-banner {
  position: relative;
  z-index: 3;
  display: grid;
  gap: 10px;
  margin: 12px var(--gutter) 0;
  padding: 14px 16px;
  background: var(--deck-2);
  border: 1px solid var(--orange);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
}
.signin-banner p {
  margin: 0;
  font-size: 14px;
}


/* Tablets and laptops use more of the screen (docs/design.md §6): a wider column, cards and game
   rows in a grid; sheets and the swipe card keep a readable width. */
@media (min-width: 768px) {
  :root {
    --column: 1040px;
  }
  .cards {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .rows {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .sheet {
    max-width: 560px;
  }
  .hexboard {
    max-width: none;
  }
  .swipe-screen,
  .intro {
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .form,
  .share {
    max-width: 640px;
  }
}

/* Dragging a sheet down to close it follows the finger; it springs back if let go early */
.sheet.is-dragging {
  transition: none;
  animation: none;
}
.sheet.is-settling {
  transition: transform 0.2s ease-out;
}
.sheet-grip {
  touch-action: none;
}
/* a heading that reacts to taps (Config: five taps show the developer section): no text selection,
   no double-tap zoom swallowing taps, and the whole title width as target */
.top h1.tappable {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  justify-self: stretch;
}

/* the page keeps room at the bottom only while an action bar is shown (research R7) */
.app:not(:has(.actionbar)) {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

/* Collection heading (docs/design.md v2.0.0 "Collection screen", "Ticker"): the name runs as a
   ticker before the pencil instead of wrapping to two lines; the pencil keeps its place after it */
.top h1.ticker {
  flex: 0 1 auto;
  display: block;
  -webkit-line-clamp: unset;
  overflow-wrap: normal;
}
.edit-btn svg {
  width: 18px;
  height: 18px;
}

/* ---- src/app/theme/actionbar.css ---- */
/* Action bar and main button (docs/design.md v2.0.0 "Action bar", "Main button"); F003 tasks T016 */

/* Dock position, padding and safe area of the old tab bar (research R7) */
.actionbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  z-index: 20;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--column);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(13, 15, 31, 0.98) 70%, rgba(13, 15, 31, 0));
}
.actionbar-left,
.actionbar-right,
.actionbar-outer {
  display: contents;
}
.actionbar-left > .act {
  grid-column: 2;
  grid-row: 1;
}
.actionbar-right > .act {
  grid-column: 4;
  grid-row: 1;
}
/* F004: the fourth action at the outer right (docs/design.md "Action bar") */
.actionbar-outer > .act {
  grid-column: 5;
  grid-row: 1;
}

.act {
  display: grid;
  justify-items: center;
  gap: 3px;
  min-height: 52px;
  padding: 6px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font: 600 11px var(--font-body);
  text-decoration: none;
  cursor: pointer;
}
.act svg {
  transition:
    transform 0.25s var(--spring),
    color 0.2s;
}
.act:active svg {
  transform: scale(0.85);
}
.act.is-active svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .act:hover {
    color: var(--text);
  }
  .act:hover svg {
    color: var(--orange-2);
  }
}

.main-btn {
  position: relative;
  grid-column: 3;
  grid-row: 1;
  justify-self: center;
  width: 62px;
  height: 68px;
  margin-top: -26px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 0;
  background: var(--grad-hot);
  color: var(--ink);
  cursor: pointer;
}
.main-btn svg {
  position: relative;
  z-index: 1;
  width: 26px;
  height: 26px;
}
/* a light shimmer passes over it every 5 s */
.main-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
  transform: translateX(-130%);
  animation: main-shimmer 5s ease-in-out infinite;
}
@keyframes main-shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}
/* not available yet: raised grey, no shimmer, no hover or press */
.main-btn.hex-btn:disabled {
  background: var(--raised);
  color: var(--placeholder);
  cursor: not-allowed;
  scale: none;
  filter: none;
}
.main-btn:disabled::after {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  .main-btn::after {
    display: none;
  }
}

@media (min-width: 768px) {
  .actionbar {
    max-width: 560px;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
}

/* ---- src/app/theme/components.css ---- */
/* Feature components: docs/design.md §7 (collection card, game row, group heading, hexagon picker, forms) */

/* Mark gradients (docs/design.md §4), used by pickers, pills and group dots */
[data-mark='new'],
[data-tone='new'] {
  --tone: var(--grad-white);
  --tone-text: var(--ink);
}
[data-mark='must_have'],
[data-tone='must_have'],
[data-tone='hot'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='interested'],
[data-tone='interested'] {
  --tone: var(--grad-cool);
  --tone-text: var(--ink);
}
[data-mark='unsure'],
[data-tone='unsure'] {
  --tone: var(--grad-violet);
  --tone-text: #fff;
}
[data-mark='poop'],
[data-tone='poop'] {
  --tone: var(--grad-mud);
  --tone-text: #fff;
}
[data-mark='skip'],
[data-tone='skip'] {
  --tone: var(--grad-red);
  --tone-text: #fff;
}
[data-mark='bought'] {
  --tone: var(--grad-got);
  --tone-text: var(--ink);
}
/* hall groups (group by booth): halls in the hot gradient, "No booth yet" muted */
[data-mark='hall'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='none'] {
  --tone: linear-gradient(135deg, #6e74a0, #9aa0c8);
  --tone-text: var(--ink);
}

.section-title {
  font-size: 18px;
  margin: 20px 0 10px;
}
.section-title small {
  font: 600 13px var(--font-body);
  color: var(--muted);
  margin-left: 6px;
}
.hint {
  margin: 8px 2px 0;
  font-size: 13px;
  color: var(--muted);
}
.hint.error {
  color: #ff8a95;
}
.form {
  display: grid;
  gap: 14px;
}
.field.is-disabled {
  opacity: 0.6;
  box-shadow: none;
}
.field svg {
  flex: none;
  color: var(--muted);
}

/* Dropdown: field look with an orange hexagon as arrow */
.field.select {
  position: relative;
}
.field.select select {
  appearance: none;
  padding-right: 24px;
  cursor: pointer;
}
.field.select select option {
  background: var(--deck);
}
.field.select::after {
  content: '';
  position: absolute;
  right: 16px;
  width: 12px;
  height: 14px;
  clip-path: var(--hex);
  background: var(--grad-hot);
  pointer-events: none;
}

/* Switch ("Essen collection") */
.toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  cursor: pointer;
}
.toggle-text {
  flex: 1;
  font-weight: 600;
}
.toggle-text small {
  display: block;
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
}
.switch {
  appearance: none;
  flex: none;
  position: relative;
  width: 52px;
  height: 32px;
  margin: 6px 0;
  border-radius: var(--r-pill);
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  cursor: pointer;
  transition: background 0.2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  clip-path: var(--hex);
  background: var(--muted);
  transition: transform 0.25s var(--spring);
}
.switch:checked {
  background: var(--grad-hot);
  border-color: transparent;
}
.switch:checked::after {
  background: var(--ink);
  transform: translateX(20px);
}

/* Hexagon picker: honeycomb, every second hexagon offset down */
/* one straight, centred row of equal hexagons, whatever their labels and the phone's text scaling */
.picker {
  display: grid;
  grid-template-columns: repeat(var(--count, 4), minmax(0, 84px));
  justify-content: center;
  align-items: start;
  gap: 8px;
  margin: 12px 0 16px;
}
.picker-btn {
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 12px;
}
.picker-hex {
  display: block;
  aspect-ratio: 0.88;
  padding: 2px;
  background: var(--border-2);
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.picker-face {
  height: 100%;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 2px;
  padding: 0 4px;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  hyphens: auto;
  background: var(--raised);
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
}
.picker-emoji {
  font-style: normal;
  font-size: 22px;
}
.picker-btn[aria-pressed='true'] .picker-hex {
  background: var(--orange);
}
.picker-btn[aria-pressed='true'] .picker-face {
  background: var(--tone);
  color: var(--tone-text);
}
.picker-btn:is([data-tone='unsure'], [data-tone='poop'])[aria-pressed='true'] .picker-face {
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Collection cards with the hexagon cluster in the top-right corner */
.cards {
  display: grid;
  gap: var(--gap);
}
/* off-screen cards skip layout, paint and their cluster animation (long lists stay fast) */
.cards > .card {
  content-visibility: auto;
  contain-intrinsic-size: auto 96px;
}
.card {
  position: relative;
  display: block;
  overflow: hidden;
  color: var(--text);
  text-decoration: none;
}
.card-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  padding-right: 64px;
}
.card-name {
  min-width: 0;
  overflow-wrap: anywhere;
}
.card-sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}
/* the six counts always in one row; the text shrinks on narrow phones instead of wrapping */
.counts {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  margin: 10px 0 0;
  font: 700 clamp(12px, 3.7vw, 15px) var(--font-display);
  white-space: nowrap;
}
.cluster {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 58px;
  height: 52px;
  animation: sway 6s ease-in-out infinite;
}
.cluster i {
  position: absolute;
  width: 22px;
  height: 25px;
  background: var(--grad-dusk);
  filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
}
.cluster i:nth-child(1) {
  top: 0;
  right: 0;
}
.cluster i:nth-child(2) {
  top: 0;
  right: 24px;
  opacity: 0.7;
}
.cluster i:nth-child(3) {
  top: 20px;
  right: 12px;
  opacity: 0.85;
}
@keyframes sway {
  0%,
  100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(4deg);
  }
}
.soon-card {
  margin-bottom: 16px;
}
.soon-card .card-title {
  padding-right: 0;
}
/* F002 Share hint at the top of Config */
.hint-card .card-title {
  padding-right: 0;
}

.row-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.row-actions .btn {
  padding-inline: 10px;
}
.group {
  margin-bottom: 16px;
}
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 16px;
}
.group-title i {
  flex: none;
  width: 12px;
  height: 14px;
  background: var(--tone);
}
.group-count {
  color: var(--muted);
  font-weight: 700;
}
.fold {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  text-align: left;
}
.chev {
  margin-left: auto;
  font-size: 22px;
  transition: transform 0.2s;
}
.fold[aria-expanded='true'] .chev {
  transform: rotate(90deg);
}

.rows {
  display: grid;
  gap: var(--gap);
  margin: 0;
  padding: 0;
  list-style: none;
}
.rows[hidden] {
  display: none;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  text-align: left;
}
.row-meta {
  flex: 1;
  min-width: 0;
  display: grid;
}
.row-name {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-sub {
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* F002 "Just added": the hover highlight, kept until the user scrolls or taps (not an animation) */
.row.is-just-added {
  border-color: var(--orange);
  box-shadow: var(--lift), var(--glow);
}
.row.skip .row-name {
  text-decoration: line-through;
  color: var(--muted);
}
.row.skip .cover {
  opacity: 0.5;
}
.row .pill,
.detail-head .pill {
  flex: none;
  background: var(--tone);
  color: var(--tone-text);
}
.mark-pill {
  padding: 4px 8px;
}

/* Hexagon covers */
.cover {
  position: relative;
  flex: none;
  display: block;
}
.cover-hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--grad-dusk);
}
.cover-hex img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-initials {
  font: 700 17px var(--font-display);
  color: var(--ink);
}
.cover-got {
  position: absolute;
  right: -4px;
  bottom: -2px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--grad-got);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
}

/* Game details sheet */
.detail-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
}
.detail-sub {
  margin: 0 0 6px;
  color: var(--muted);
}
.link-out {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 700;
}
.sheet-actions {
  display: grid;
  gap: var(--gap);
  margin-top: 12px;
}

/* "Group by" under the filter in a collection */
.group-by {
  margin-top: 12px;
}

/* Config → Developer: plain links, each a full-width 44px target */
.dev-links {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.dev-links a {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 600;
}

/* Cancel and the main action side by side, the main action on the right */
.sheet-actions-row {
  grid-template-columns: 1fr 1fr;
}

/* Game info (docs/design.md §7 "Game info"): year beside the name, publisher, then three infos */
.row-year {
  font-weight: 500;
  color: var(--muted);
}
.row-info {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin-top: 2px;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  white-space: nowrap;
}
.row-info > span:first-child {
  flex: none;
}
.info-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}
.row-info .info-pills {
  flex-wrap: nowrap;
  overflow: hidden;
}
.info-pill {
  flex: none;
  padding: 1px 8px;
  border: 1px solid var(--border);
  background: var(--raised);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.info-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  margin: 0 0 12px;
}
.info-list > div {
  display: contents;
}
.info-list dt {
  color: var(--muted);
  font-size: 14px;
}
.info-list dd {
  margin: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* F003: the SPIEL preview suggestion above a BGG list link field */
.list-suggestion {
  margin-bottom: 10px;
}

/* ---- src/app/theme/fair.css ---- */
/* At the fair (US4): filter button and panel, bought line, game description, facts, price question (docs/design.md §7) */

/* Filter: one full-width button, a panel below it */
.chip {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
}
.chip[aria-pressed='true'] {
  border-color: var(--orange);
  background: var(--raised);
  box-shadow: var(--glow);
}
.seg-title {
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.seg {
  /* one column per option, all in one row */
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.seg button {
  min-height: var(--tap);
  min-width: 0;
  padding: 0 4px;
  overflow-wrap: anywhere;

  background: none;
  color: var(--muted);

}
.seg button[aria-pressed='true'] {
  background: var(--grad-hot);

}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  border-top: 1px solid var(--rim);
  cursor: pointer;
}
.filter-row:first-child {
  border-top: 0;
}
.filter-row input {
  flex: none;
  width: 20px;
  height: 20px;
  accent-color: var(--orange);
}
.filter-row span {
  flex: 1;
}
.filter-row small {
  font: 600 14px var(--font-display);
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .chip:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}
.chip:active,
.seg button:active {
  scale: 0.96;
}

/* "✅ 1 game bought, €52 spent" under the filter */
.bought-line {
  margin: 10px 2px 0;
  font-weight: 700;
  color: #7cf0c5;
}

/* Game details: description, facts, price question */
.detail-head .pill {
  margin-top: 4px;
}
.desc {
  margin: 4px 0 12px;
  font-size: 14px;
}
.muted {
  color: var(--muted);
}
.facts-box {
  margin-bottom: 8px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.facts-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0 12px;
}
.facts-by {
  font-size: 13px;
  font-weight: 700;
  color: var(--orange-2);
}
.link-btn {
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;

}
.facts-add {
  margin-bottom: 8px;
}
.facts-form {
  margin-bottom: 12px;
}
.price-row {
  display: grid;
  grid-template-columns: 1fr 112px;
  gap: var(--gap);
}
.form-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.currency {
  font-weight: 700;

}

/* "Groups" with Select all / Select none on the same line */
.seg-head {
  display: flex;

  justify-content: space-between;
  gap: 8px;
}
.seg-actions {
  display: flex;
  gap: 4px;
}
.seg-actions .link-btn {
  min-height: var(--tap);
  padding: 0 8px;
}

/* filter icon in the collection header; a dot while a filter or the hall grouping is active */
.filter-icon {
  position: relative;
}
.filter-icon.is-active::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 10px;
  height: 11px;
  clip-path: var(--hex);

}
/* what is shown while narrowed; a tap opens "Filter and group" */
.filter-summary {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: var(--tap);
  margin-top: 10px;
  padding: 6px 14px;
  border: 1px solid var(--orange);
  border-radius: var(--r-pill);

  color: var(--text);
  font-weight: 600;

  text-align: left;
}

/* ---- src/app/theme/lists.css ---- */
/* BGG lists: list cards, list rows with +, progress, list game sheet (docs/design.md §7) */

.example {
  color: var(--text);
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* Loading progress: pages loaded so far */
.progress {
  height: 6px;
  margin-top: 10px;
  border-radius: var(--r-pill);
  background: var(--rim);
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad-hot);
}
@media (prefers-reduced-motion: no-preference) {
  .progress span {
    transition: width 0.4s ease-out;
  }
}
.list-status {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--muted);
}
.list-status p {
  margin: 0;
}
.list-status.error {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  color: #ff8a95;
}

/* List rows: the row opens the game, the hexagon + next to it does the same */
.list-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.list-item .row {
  flex: 1;
  min-width: 0;
}
.in-mark {
  font-size: 12px;
  font-weight: 700;
  color: var(--teal);
}
.add-mini {
  flex: none;
  width: 48px;
  height: 54px;
  padding: 0;
  border: 0;
  background: none;
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.add-mini .hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  background: var(--grad-hot);
  color: var(--ink);
  font: 700 26px var(--font-display);
}

/* List game sheet */
.description {
  margin: 8px 0 12px;
  color: var(--muted);
  font-size: 14px;
}

/* Multi-choice list: a hexagon tick per collection; the ticks always show the current truth */
.picks {
  display: grid;
  gap: var(--gap);
}
.pick {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  cursor: pointer;
}
.pick:has(.pick-input:focus-visible) {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}
.pick-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.tick {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 32px;
  background: var(--border-2);
}
.tick::before {
  content: '';
  width: 24px;
  height: 28px;
  clip-path: var(--hex);
  background: var(--raised);
}
.pick-input:checked + .tick {
  background: var(--orange);
}
.pick-input:checked + .tick::before {
  background: var(--grad-hot);
}
.pick-input:checked + .tick::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ink);
  font-weight: 800;
}
.pick-text {
  flex: 1;
  min-width: 0;
  display: grid;
}
.pick-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.pick-text small {
  font-size: 13px;
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .pick:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}

/* ---- src/app/theme/interaction.css ---- */
/* Interaction states: docs/design.md §8. Nothing moves on hover; press squishes; focus is orange. */
:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}

.btn,
.icon-btn,
.card,
.row,
.tile {
  transition:
    background 0.2s,
    border-color 0.2s,
    box-shadow 0.25s,
    color 0.2s,
    scale 0.25s var(--spring);
}

@media (hover: hover) and (pointer: fine) {
  .card:not([aria-disabled='true']):hover,
  .row:hover,
  .tile:hover,
  .field:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .btn:not(:disabled):not(.btn-primary):not(.btn-bought):hover,
  .icon-btn:hover {
    background: var(--grad-hot);
    border-color: transparent;
    color: var(--ink);
  }
  .btn-danger:not(:disabled):hover {
    background: var(--grad-red);
    color: #fff;
  }
  .btn-primary:not(:disabled):hover,
  .btn-bought:not(:disabled):hover {
    box-shadow: var(--lift), 0 0 22px rgba(255, 176, 32, 0.55);
  }
  .hex-btn:hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Press: a short squish that springs back (touch and pointer) */
.card:active,
.row:active,
.tile:active {
  scale: 0.98;
  transition-duration: 0.08s;
}
.btn:not(:disabled):active,
.icon-btn:active {
  scale: 0.96;
  transition-duration: 0.08s;
}
.hex-btn {
  transition:
    scale 0.25s var(--spring),
    filter 0.2s;
}
.hex-btn:active {
  scale: 0.9;
  transition-duration: 0.08s;
}

/* Tap pulse: an orange hexagon expanding from the tap point */
.tap-pulse {
  position: fixed;
  z-index: 60;
  width: 56px;
  height: 64px;
  margin: -32px 0 0 -28px;
  clip-path: var(--hex);
  background: radial-gradient(circle, rgba(255, 176, 32, 0.55), rgba(255, 122, 26, 0) 70%);
  pointer-events: none;
  animation: tap-pulse 0.5s ease-out forwards;
}
@keyframes tap-pulse {
  from {
    transform: scale(0.3);
    opacity: 1;
  }
  to {
    transform: scale(1.6);
    opacity: 0;
  }
}

/* Reduced motion (docs/design.md §9): every animation and press squish off */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  .card:active,
  .row:active,
  .tile:active,
  .btn:active,
  .icon-btn:active,
  .hex-btn:active,
  .hex-btn:hover {
    scale: none;
  }
  .tap-pulse {
    display: none;
  }
}

/* ---- src/app/theme/ticker.css ---- */
/* Ticker for headings too long for their row (docs/design.md v2.0.0 "Ticker"); F003 tasks T024 */
.ticker {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  overflow-wrap: normal;
}
.ticker > span {
  display: inline-block;
}
/* soft fades at both edges; the left padding keeps the first letter clear of the fade */
.ticker.is-long {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  padding-left: 10px;
  margin-left: -10px;
}
.ticker.is-long > span {
  animation: ticker var(--ticker-time, 8s) linear infinite;
}
@keyframes ticker {
  /* read the start */
  0%,
  18% {
    transform: translateX(0);
  }

/* ---- F005 prototype additions ---- */
[data-mark='later'], [data-tone='later'] { --tone: linear-gradient(135deg, #d946ef 0%, #f9a8d4 100%); --tone-text: var(--ink); }

.proto-bar { position: relative; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px; background: #05060e; border-bottom: 1px solid var(--rim); font-size: 12px; color: var(--muted); }
.proto-bar select { background: var(--deck-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; font: inherit; }

/* Game row: category as the border colour, actions on the right */
.crow { position: relative; display: flex; align-items: stretch; min-height: 68px; border-radius: var(--r-md); box-shadow: var(--lift);
  border: 1px solid transparent; background: linear-gradient(var(--deck), var(--deck)) padding-box, var(--tone, linear-gradient(var(--border), var(--border))) border-box; }
.crow[data-mark='new'] { --tone: linear-gradient(var(--border), var(--border)); }
.crow[data-mark='skip'] { opacity: 0.75; }
.crow[data-mark='skip'] .row-name { text-decoration: line-through; color: var(--muted); }
.crow[data-mark='skip'] .cover { opacity: 0.5; }
/* B: a coloured edge at the left instead of the whole border */
.proto-edge .crow { border: 1px solid var(--border); background: var(--deck); padding-left: 6px; }
.proto-edge .crow::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 7px; border-radius: var(--r-md) 0 0 var(--r-md); background: var(--tone); }
.proto-edge .crow[data-mark='new']::before { background: var(--border); }
.crow-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: var(--r-md) 0 0 var(--r-md); }
.crow-acts { flex: none; display: flex; align-items: center; gap: 2px; padding-right: 6px; }
.ract { width: 46px; min-height: 52px; display: grid; justify-items: center; align-content: center; gap: 2px; padding: 0; border: 0; border-radius: 12px; background: none; color: var(--muted); font: 600 10px var(--font-body); cursor: pointer; }
.ract .rhex { width: 32px; height: 36px; display: grid; place-items: center; clip-path: var(--hex); background: var(--raised); color: var(--text); transition: background 0.2s, color 0.2s, scale 0.25s var(--spring); }
.ract:active .rhex { scale: 0.85; }
.ract.buy[aria-pressed='true'] { color: #7cf0c5; }
.ract.buy[aria-pressed='true'] .rhex { background: var(--grad-got); color: var(--ink); }
.ract.cat .rhex { background: var(--raised); }
.proto-catemoji .ract.cat .rhex { background: var(--tone); color: var(--tone-text); font-size: 16px; }
@media (hover: hover) and (pointer: fine) { .ract:hover .rhex { background: var(--grad-hot); color: var(--ink); } }
.row-price { color: #7cf0c5; font-weight: 700; }

/* Quick filters between the two lines */
.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qtoggle { display: inline-grid; grid-auto-flow: column; padding: 3px; min-height: var(--tap); border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--deck); cursor: pointer; font: 700 14px var(--font-body); }
.qtoggle span { display: grid; place-items: center; padding: 0 14px; border-radius: var(--r-pill); color: var(--muted); transition: background 0.2s, color 0.2s; }
.qtoggle span.on { background: var(--grad-hot); color: var(--ink); }

.search { margin-bottom: 14px; }

.no-match { text-align: center; color: var(--muted); padding: 24px 0; }

/* filter action highlighted while not default: orange icon and label, hexagon dot */
.act.is-active { color: var(--text); }

.act.is-active::after { content: ''; position: absolute; top: 4px; left: calc(50% + 8px); width: 10px; height: 11px; clip-path: var(--hex); background: var(--grad-hot); }

.cat-list { display: grid; gap: 8px; margin: 0 0 8px; padding: 0; list-style: none; }

.zz { position: relative; margin: 6px auto 4px; }

/* booths: "7-C111 / 3" → [{hall:'7', booth:'7-C111'}, {hall:'3', hallOnly:true}] */
function boothsOf(text) {
  const out = []
  for (const raw of (text || '').split(/[/,;]/).map(s => s.trim().toUpperCase()).filter(Boolean)) {
    let m
    if ((m = raw.match(/^([^-\s]+)-\S+/))) out.push({ hall: m[1], booth: raw })

  return out

    for (const b of bs) {

      if (!list.some(x => x.g === g)) list.push({ g, b })
      halls.set(b.hall, list)

  const out = [...halls.keys()].sort((a, b) => a - b).map(h => ({

  }))
  if (none.length) out.push({ key: 'none', tone: 'none', label: 'No booth yet', games: none.sort(byName) })
  return out
}

function row(g) {
  const info = S.groupBy === 'booth'
    ? (g._b?.hallOnly ? `<span class="hall-only">Hall ${g._b.hall}, booth unknown</span>` : esc(g._b?.booth || 'No booth yet'))
    : esc([g.booth && 'Booth ' + g.booth, euro(g.price)].filter(Boolean).join(' · '))
  return `<li><div class="crow" data-mark="${g.cat}">
    <button type="button" class="crow-open" data-act="open" data-id="${g.id}">${cover(g, 52)}<span class="row-meta"><span class="row-name">${esc(g.name)}</span><span class="row-sub">${esc(g.publisher)}</span><span class="row-info"><span>${info}</span></span><span class="visually-hidden">, ${CAT[g.cat].l}${g.bought ? ', bought' : ''}</span></span></button>
    <div class="crow-acts">
      <button type="button" class="ract buy" data-act="buy" data-id="${g.id}" aria-pressed="${g.bought}" aria-label="${g.bought ? 'Not bought' : 'Buy'} ${esc(g.name)}"><span class="rhex">${g.bought ? ICON.bagOk : ICON.bag}</span>${g.bought ? (g.paid != null ? euro(g.paid) : 'Bought') : 'Buy'}</button>
      <button type="button" class="ract cat" data-act="cat" data-id="${g.id}" aria-label="Category of ${esc(g.name)}"><span class="rhex">${false ? CAT[g.cat].e : ICON.cat}</span>Category</button>
    </div></div></li>`
}

function gamesHTML() {
  const games = shownGames()
  if (!games.length) return S.query ? `<p class="no-match">No game called “${esc(S.query)}” here.<br><button type="button" class="link-btn" data-act="clear-search">Clear the search</button></p>`
    : `<div class="empty"><div class="hex"></div><h2>No game matches the filter</h2><div class="actions"><button type="button" class="btn btn-primary" data-act="clear">Clear filters</button></div></div>`
  let lined = false
  return groups(games).map(gr => {
    const line = gr.rest && !lined && S.groupBy === 'cat' ? (lined = true, '<hr class="separator" />') : ''
    return `${line}<section class="group"><h2 class="group-title" data-mark="${gr.tone}"><i class="hex"></i><span>${S.groupBy === 'cat' ? CAT[gr.key].e + ' ' : ''}${gr.label}</span><b class="group-count">${gr.games.length}</b></h2><ul class="rows">${gr.games.map(row).join('')}</ul></section>`
  }).join('')
}

function collection() {
  const bought = GAMES.filter(g => g.bought), spent = bought.reduce((s, g) => s + (g.paid || 0), 0)
  return `<div class="top"><div class="top-title"><h1>Essen 2026</h1></div><div class="top-actions"><button class="icon-btn" aria-label="Edit Essen 2026">${ICON.pencil}</button></div></div>
  <main class="screen">
    <p class="bought-line">✅ ${bought.length} games bought, ${euro(spent)} spent</p>
    <hr class="separator" />
    <div class="quick" role="group" aria-label="Quick filters">
      <button type="button" class="qtoggle" data-act="toggle-group" id="qtoggle" aria-label="Group by booths or categories"></button>
      <button type="button" class="chip" data-act="buy-filter" id="qbuy">🛒 Buy</button>
      <span class="quick-count" id="qcount"></span>
    </div>
    <hr class="separator" />
    <label class="visually-hidden" for="q">Search Essen 2026</label>
    <div class="field search">${ICON.search}<input id="q" type="search" placeholder="Search this collection" autocomplete="off" value="${esc(S.query)}"></div>
    <div id="games"></div>
  </main>
  <nav class="actionbar" aria-label="Actions">
    <div class="actionbar-left"><button type="button" class="act">${ICON.plus}<span>Add game</span></button></div>
    <button type="button" class="main-btn hex hex-btn" aria-label="BG-Tinder">${ICON.heart}</button>
    <div class="actionbar-right"><button type="button" class="act" id="filter-act" data-act="filter">${ICON.filter}<span>Filter</span></button></div>
    <div class="actionbar-outer"><button type="button" class="act">${ICON.honey}<span>Show-off</span></button></div>
  </nav>`
}
// only the games, the toggles and the filter action change: no redraw of the search field
function refresh() {
  if (S.screen !== 'collection') return
  $('#games').innerHTML = gamesHTML()
  $('#qtoggle').innerHTML = `<span class="${S.groupBy === 'cat' ? 'on' : ''}">Cat</span><span class="${S.groupBy === 'booth' ? 'on' : ''}">Booth</span>`
  $('#qtoggle').setAttribute('aria-label', `Grouped by ${S.groupBy === 'cat' ? 'categories' : 'booths'}; tap to group by ${S.groupBy === 'cat' ? 'booths' : 'categories'}`)
  $('#qbuy').setAttribute('aria-pressed', S.buy)
  const n = shownGames().length
  $('#qcount').textContent = `${n} ${n === 1 ? 'game' : 'games'}`
  const act = $('#filter-act')
  act.classList.toggle('is-active', !isDefault())
  act.setAttribute('aria-label', isDefault() ? 'Filter' : 'Filter (active)')
}

/* ---------- sheets ---------- */
function openSheet(name, html, label) {
  S.sheet = name
  layer.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1"><div class="sheet-grip"></div><div id="sheet-body">${html}</div></div>`
  layer.querySelector('.sheet').focus()
}
const setSheet = html => { const b = $('#sheet-body'); if (b) b.innerHTML = html }
function closeSheet() { S.sheet = null; layer.innerHTML = '' }

function zigzag(selected, act, id) {
  const pointy = true
  const avail = Math.min(440, window.innerWidth) - 32
  const gap = 4
  let w, h, pos
  if (pointy) {
    w = Math.min(88, Math.floor((avail - 2 * gap) / 3)); h = Math.round(w * 1.14)
    pos = i => (i % 2 === 0 ? [(i / 2) * (w + gap), 0] : [(w + gap) / 2 + ((i - 1) / 2) * (w + gap), h * 0.75 + gap])
  } else {
    w = Math.min(84, Math.floor((avail - 4 * gap) / 4)); h = Math.round(w * 0.88)
    pos = i => [i * (w * 0.75 + gap), i % 2 ? h / 2 + gap / 2 : 0]
  }
  const W = pointy ? 3 * w + 2 * gap : w + 4 * (w * 0.75 + gap), H = pointy ? h * 1.75 + gap : h * 1.5 + gap / 2
  return `<div class="zz ${pointy ? 'pointy' : 'flat'}" role="group" aria-label="Category" style="width:${W}px;height:${H}px">${PICK.map((c, i) => {
    const [x, y] = pos(i)
    return `<button type="button" class="picker-btn" data-tone="${c.k}" data-act="${act}" data-id="${id}" data-cat="${c.k}" aria-pressed="${selected === c.k}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><span class="picker-hex hex"><span class="picker-face hex"><b>${c.e}</b><span>${c.l}</span></span></span></button>`
  }).join('')}</div>`
}

function gameBody(g) {
  const rate = (v, cls) => (v == null ? null : `<span class="rating"><i class="${cls}">${v.toFixed(1)}</i></span>`)
  const infos = [['Price', euro(g.price)], ['Players', g.players], ['Rating', rate(g.rating, '')], ['Geek rating', rate(g.geek, 'geek')], ['Booth', g.booth ? 'Booth ' + esc(g.booth) : null], ['Publisher', esc(g.publisher)]].filter(([, v]) => v)
  return `<h2 class="sheet-title">${esc(g.name)}</h2>
  <div class="detail-head">${cover(g, 84)}<div><p class="detail-sub">${esc(g.publisher)} · 2025</p>${g.bought ? `<span class="pill" data-mark="bought">✅ ${g.paid != null ? 'Bought for ' + euro(g.paid) : 'Bought'}</span>` : ''}<br><a class="link-out">Open on BoardGameGeek</a></div></div>
  ${zigzag(g.cat, 'pick', g.id)}
  <div class="not-int">${g.cat === 'skip' ? `<button type="button" class="link-btn" data-act="pick" data-id="${g.id}" data-cat="new">↩ Interested again (No category yet)</button>` : `<button type="button" class="link-btn" data-act="pick" data-id="${g.id}" data-cat="skip">🛑 Not interested</button>`}</div>
  <div class="facts-box"><dl class="info-list">${infos.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
  <div class="facts-foot"><span class="facts-by">${g.source === 'manual' ? 'Typed in by you' : 'From SPIEL Essen 2026 Preview'}</span><button type="button" class="link-btn">Edit</button></div></div>
  <p class="desc muted">A short description from BoardGameGeek… (rest of the details unchanged)</p>
  <div class="sheet-actions">${g.bought ? `<button type="button" class="btn btn-block" data-act="unbuy" data-id="${g.id}">Not bought after all</button>` : `<button type="button" class="btn btn-block btn-bought" data-act="buy" data-id="${g.id}">✅ Bought it</button>`}<button type="button" class="btn btn-block btn-danger">Remove from Essen 2026</button></div>`
}

function buyBody(g) {
  return `<h2 class="sheet-title">Bought ${esc(g.name)}?</h2>
  <p class="lead">What did you pay? Leave it empty to just tick it off.</p>
  <form class="form" data-id="${g.id}" id="buy-form">
    <div class="price-row"><div class="field"><input id="paid" inputmode="decimal" placeholder="${(g.price / 100).toString()}" aria-label="Price paid"></div><div class="field select"><select aria-label="Currency"><option>EUR</option><option>USD</option><option>GBP</option></select></div></div>
    <div class="form-actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn btn-bought">Got it</button></div>
  </form>`
}

function catBody(g) {
  if (false) {
    return `<h2 class="sheet-title">Category of ${esc(g.name)}</h2>${zigzag(g.cat, 'set-cat', g.id)}
    <div class="row-actions" style="margin-top:8px"><button type="button" class="btn" data-act="set-cat" data-id="${g.id}" data-cat="new" aria-pressed="${g.cat === 'new'}">⬡ No category</button><button type="button" class="btn" data-act="set-cat" data-id="${g.id}" data-cat="skip" aria-pressed="${g.cat === 'skip'}">🛑 Not interested</button></div>`
  }
  const item = c => `<li><button type="button" data-act="set-cat" data-id="${g.id}" data-cat="${c.k}" data-mark="${c.k}" aria-pressed="${g.cat === c.k}"><span class="chex"></span>${c.e} ${c.l}</button></li>`
  return `<h2 class="sheet-title">Category of ${esc(g.name)}</h2><ul class="cat-list">${PICK.map(item).join('')}<li class="sep" role="presentation"></li>${CATS.slice(5).map(item).join('')}</ul>`
}

function filterBody() {
  const f = S.filter
  const seg = (label, key, opts) => `<p class="seg-title">${label}</p><div class="seg" role="group" aria-label="${label}">${opts.map(([v, t]) => `<button type="button" data-act="seg" data-key="${key}" data-v="${v}" aria-pressed="${(key === 'groupBy' ? S.groupBy : f[key]) === v}">${t}</button>`).join('')}</div>`
  const counts = Object.fromEntries(ALL.map(k => [k, GAMES.filter(g => g.cat === k).length]))
  return `<h2 class="sheet-title">Filter and group</h2>
  ${seg('Bought', 'bought', [['all', 'All'], ['no', 'Not bought'], ['yes', 'Bought']])}
  ${seg('Price', 'price', [['all', 'All'], ['cheap', '≤ €30'], ['mid', '€30–60'], ['expensive', '> €60']])}
  <div class="seg-head"><p class="seg-title">Categories</p><div class="seg-actions"><button type="button" class="link-btn" data-act="cats-all">Select all</button><button type="button" class="link-btn" data-act="cats-none">Select none</button></div></div>
  <div role="group" aria-label="Categories">${CATS.map(c => `<label class="filter-row"><input type="checkbox" data-act="cat-check" data-cat="${c.k}" ${f.cats.has(c.k) ? 'checked' : ''}><span>${c.e} ${c.l}</span><small>${counts[c.k]}</small></label>`).join('')}</div>
  ${seg('Group by', 'groupBy', [['cat', 'Categories'], ['booth', 'Booths']])}
  <div class="sheet-actions sheet-actions-row"><button type="button" class="btn" data-act="clear" ${isDefault() ? 'disabled' : ''}>Clear filters</button><button type="button" class="btn btn-primary" data-act="close">Done</button></div>`
}

/* ---------- BGG list with resync ---------- */
const LIST = [['Sky Team', 'in Essen 2026'], ['Kalypso', 'in Essen 2026'], ['Faraway', 'in Essen 2026'], ['Harmonies', 'in Essen 2026'], ['Bamboo', 'in Essen 2026'], ['Ostia', ''], ['Woodcraft', ''], ['Seti: Aliens', '']]
function listScreen() {
  const icon = true
  return `<div class="top"><a class="icon-btn back" data-act="to-collection" aria-label="Back">‹</a><div class="top-title"><h1>SPIEL Essen 2026 Preview</h1></div>${icon ? `<div class="top-actions"><button type="button" class="icon-btn resync-btn" data-act="resync" aria-label="Resync with BGG">${ICON.resync}</button></div>` : ''}</div>
  <main class="screen">
    <div class="list-status"><p id="lstatus">1,204 games, all loaded · synced yesterday 18:02</p><div class="progress"><span id="lbar" style="width:100%"></span></div></div>
    ${icon ? '' : `<button type="button" class="btn btn-block resync-btn" data-act="resync" style="margin-bottom:12px">${ICON.resync}<span>Resync with BGG</span></button>`}
    <div class="field">${ICON.search}<input type="search" placeholder="Filter by name" aria-label="Filter this list"></div>
    <hr class="separator" />
    <ul class="rows">${LIST.map(([n, inC], i) => { const g = GAMES.find(x => x.name === n) || { id: 20 + i, name: n }; return `<li class="lrow">${cover({ ...g, bought: false }, 44)}<span class="row-meta"><span class="row-name">${esc(n)}</span><span class="row-sub">${g.booth ? 'Booth ' + esc(g.booth) : ''}</span></span><span class="in">${inC}</span></li>` }).join('')}</ul>
    <p class="proto-note">Resync reads the list again. Sky Team, Kalypso and Faraway have values you typed in; BGG now says something else.</p>
  </main>`
}

const CONFLICTS = () => [
  { id: 1, field: 'booth', label: 'Booth', own: GAMES[1].booth, bgg: '3-A100' },
  { id: 2, field: 'price', label: 'Price', own: GAMES[2].price, bgg: 3500 },
  { id: 5, field: 'booth', label: 'Booth', own: GAMES[5].booth, bgg: '2-C210' },
].filter(c => GAMES[c.id][c.field] !== c.bgg)
const show = (c, v) => (c.field === 'price' ? euro(v) : v)
function conflictsBody() {
  const cs = S.conflicts
  return `<div class="sheet-lead-row"><h2 class="sheet-title">${cs.length} ${cs.length === 1 ? 'conflict' : 'conflicts'}</h2></div>
  <p class="lead">You typed these in yourself, and BGG now says something else. Choose what to keep.</p>
  <div class="all-row"><button type="button" class="btn" data-act="all" data-v="bgg">Use BGG for all</button><button type="button" class="btn" data-act="all" data-v="own">Use own for all</button></div>
  ${cs.map((c, i) => `<div class="conflict"><h3>${esc(GAMES[c.id].name)}</h3><p>${c.label} · in Essen 2026</p><div class="choice" role="group" aria-label="${c.label} of ${esc(GAMES[c.id].name)}">
    <button type="button" data-act="choose" data-i="${i}" data-v="own" aria-pressed="${c.pick === 'own'}"><small>Own</small>${esc(show(c, c.own))}</button>
    <button type="button" data-act="choose" data-i="${i}" data-v="bgg" aria-pressed="${c.pick === 'bgg'}"><small>BGG</small>${esc(show(c, c.bgg))}</button></div></div>`).join('')}
  <div class="sheet-actions sheet-actions-row"><button type="button" class="btn" data-act="close">Later</button><button type="button" class="btn btn-primary" data-act="apply">Apply</button></div>`
}
function applyConflicts(all) {
  let n = 0
  for (const c of S.conflicts) { const pick = all || c.pick; if (pick === 'bgg') { GAMES[c.id][c.field] = c.bgg; GAMES[c.id].source = 'list'; n++ } }
  closeSheet()
  toast(n ? `${n} ${n === 1 ? 'value' : 'values'} taken from BGG` : 'Your own values kept')
}
function resync() {
  const btn = root.querySelector('.resync-btn'); if (!btn || btn.disabled) return
  btn.disabled = true; btn.classList.add('spin')
  const bar = $('#lbar'), st = $('#lstatus'); let p = 0
  const tick = setInterval(() => {
    p = Math.min(1204, p + 160); bar.style.width = (p / 1204) * 100 + '%'; st.textContent = `Resyncing with BGG… ${p.toLocaleString('en')} / 1,204`
    if (p >= 1204) {
      clearInterval(tick); btn.disabled = false; btn.classList.remove('spin'); st.textContent = '1,204 games, all loaded · synced just now'
      S.conflicts = CONFLICTS().map(c => ({ ...c, pick: 'own' }))
      toast(`Resync done: 4 games updated${S.conflicts.length ? `, ${S.conflicts.length} conflicts` : ''}`)
      if (S.conflicts.length) openSheet('conflicts', conflictsBody(), 'Conflicts')
    }
  }, 220)
  bar.style.width = '0%'
}

/* ---------- render and events ---------- */
function render() {
  root.innerHTML = `<div class="app">${appbar()}${S.screen === 'list' ? listScreen() : collection()}</div>`
  refresh()
}
const game = el => GAMES[+el.dataset.id]

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return
  const a = t.dataset.act
  if (a === 'close') return closeSheet()
  if (a === 'open') return openSheet('game', gameBody(game(t)), game(t).name)
  if (a === 'buy') {
    const g = game(t)
    if (g.bought && S.sheet !== 'game') { g.bought = false; g.paid = null; refresh(); return toast(`${g.name}: not bought any more`) }
    return openSheet('buy', buyBody(g), 'Bought ' + g.name)
  }
  if (a === 'unbuy') { const g = game(t); g.bought = false; g.paid = null; setSheet(gameBody(g)); refresh(); return toast(`${g.name}: not bought any more`) }
  if (a === 'cat') return openSheet('cat', catBody(game(t)), 'Category of ' + game(t).name)
  if (a === 'set-cat') { const g = game(t); g.cat = t.dataset.cat; closeSheet(); refresh(); return toast(`${g.name} → ${CAT[g.cat].e} ${CAT[g.cat].l}`) }
  // in the details the picker changes in place; the sheet stays open
  if (a === 'pick') { const g = game(t); g.cat = t.dataset.cat; setSheet(gameBody(g)); refresh(); return }
  if (a === 'toggle-group') { S.groupBy = S.groupBy === 'cat' ? 'booth' : 'cat'; return refresh() }
  if (a === 'buy-filter') {
    if (S.buy) { S.filter = S.saved; S.buy = false } else { S.saved = S.filter; S.filter = { cats: new Set(BUY), bought: 'no', price: 'all' }; S.buy = true }
    return refresh()
  }
  if (a === 'filter') return openSheet('filter', filterBody(), 'Filter and group')
  if (a === 'seg') { if (t.dataset.key === 'groupBy') S.groupBy = t.dataset.v; else { S.filter = { ...S.filter, [t.dataset.key]: t.dataset.v }; S.buy = false } setSheet(filterBody()); return refresh() }
  if (a === 'cats-all' || a === 'cats-none') { S.filter = { ...S.filter, cats: new Set(a === 'cats-all' ? ALL : []) }; S.buy = false; setSheet(filterBody()); return refresh() }
  if (a === 'cat-check') { const cats = new Set(S.filter.cats); cats.has(t.dataset.cat) ? cats.delete(t.dataset.cat) : cats.add(t.dataset.cat); S.filter = { ...S.filter, cats }; S.buy = false; setSheet(filterBody()); return refresh() }
  if (a === 'clear') { S.filter = DEFAULT(); S.groupBy = 'cat'; S.buy = false; if (S.sheet === 'filter') setSheet(filterBody()); refresh(); return toast('Filters cleared') }
  if (a === 'clear-search') { S.query = ''; $('#q').value = ''; return refresh() }
  if (a === 'resync') return resync()
  if (a === 'choose') { S.conflicts[+t.dataset.i].pick = t.dataset.v; t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t)); return }
  if (a === 'all') return applyConflicts(t.dataset.v)
  if (a === 'apply') return applyConflicts(null)
  if (a === 'to-collection') { S.screen = 'collection'; return render() }
})
document.addEventListener('submit', e => {
  if (e.target.id !== 'buy-form') return
  e.preventDefault()
  const g = GAMES[+e.target.dataset.id], v = $('#paid').value.replace(',', '.').trim()
  g.bought = true; g.paid = v && !isNaN(+v) ? Math.round(+v * 100) : null
  closeSheet(); refresh()
  toast(g.paid != null ? `${g.name}: got it for ${euro(g.paid)}!` : `${g.name}: got it!`)
})
document.addEventListener('input', e => { if (e.target.id === 'q') { S.query = e.target.value; $('#games').innerHTML = gamesHTML(); const n = shownGames().length; $('#qcount').textContent = `${n} ${n === 1 ? 'game' : 'games'}` } })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet() })

function start() {
  const s = $('#start').value
  S = { screen: s === 'list' ? 'list' : 'collection', sheet: null, filter: DEFAULT(), groupBy: s === 'booth' ? 'booth' : 'cat', buy: false, saved: null, query: '', conflicts: [] }
  closeSheet(); render()
  if (s === 'game') openSheet('game', gameBody(GAMES[0]), GAMES[0].name)
}
$('#start').onchange = start
start()
</script>

</body>
</html>
