/* ---- src/app/theme/tokens.css ---- */
/* Design tokens: docs/design.md §3–§6, one-to-one */
:root {
  --ink: #0d0f1f;
  --deck: #151831;
  --deck-2: #1d2142;
  --rim: #2c3160;
  --border: #3a4078;
  --border-2: #4a5196;
  --raised: #232852;
  --text: #eceeff;
  --muted: #9aa0c8;
  --placeholder: #6e74a0;
  --orange: #ff7a1a;
  --orange-2: #ffb020;
  --indigo: #4c5bff;
  --teal: #14c8c8;
  --violet: #8b5cf6;
  --danger: #ff4d5e;
  --got: #0fb98f;

  --grad-hot: linear-gradient(135deg, #ff7a1a 0%, #ffb020 100%);
  --grad-cool: linear-gradient(135deg, #4c5bff 0%, #14c8c8 100%);
  --grad-violet: linear-gradient(135deg, #6d4ae0 0%, #a78bfa 100%);
  --grad-mud: linear-gradient(135deg, #7a6046 0%, #b0916e 100%);
  --grad-red: linear-gradient(135deg, #c2183a 0%, #ff4d5e 100%);
  --grad-got: linear-gradient(135deg, #0fb98f 0%, #7cf0c5 100%);
  --grad-dusk: linear-gradient(135deg, #8b5cf6 0%, #4c5bff 55%, #14c8c8 100%);
  --grad-white: linear-gradient(135deg, #ffffff 0%, #c9cdf0 100%);
  --grad-separator: linear-gradient(90deg, #ff7a1a 0%, #8b5cf6 100%);

  --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  --lift: 0 8px 22px rgba(3, 4, 12, 0.55), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --glow: 0 0 0 1px var(--orange), 0 0 18px rgba(255, 122, 26, 0.45);

  --font-display: 'Chakra Petch', 'Avenir Next Condensed', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;
  --tap: 44px;
  --gutter: 16px;
  --column: 440px;
  --gap: 8px;

  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---- src/app/theme/base.css ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  font-weight: 700;
  margin: 0;
}
a {
  color: var(--orange-2);
}
.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Layout: the phone column (docs/design.md §6) */
.app {
  position: relative;
  max-width: var(--column);
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
.screen {
  position: relative;
  z-index: 1;
  padding: 0 var(--gutter);
}
.lead {
  color: var(--muted);
  margin: 0 0 16px;
  font-size: 14px;
}
.hex {
  clip-path: var(--hex);
}
.separator {
  height: 2px;
  border: 0;
  margin: 16px 0;
  background: var(--grad-separator);
  border-radius: 2px;
}

/* Surfaces */
.card {
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--lift);
  padding: 16px;
}
.field {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  padding: 0 14px;
  min-height: 50px;
}
.field:focus-within {
  border-color: var(--orange);
}
.field input,
.field select {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 12px 0;
}
.field input::placeholder {
  color: var(--placeholder);
}
.label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin: 0 0 6px;
}

/* Buttons (docs/design.md §7): text on gradients follows the contrast rule of §3 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 10px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-2);
  background: var(--raised);
  font-weight: 700;
  box-shadow: var(--lift);
  text-decoration: none;
  color: var(--text);
}
.btn-block {
  width: 100%;
}
.btn-primary {
  background: var(--grad-hot);
  border-color: transparent;
  color: var(--ink);
}
.btn-bought {
  background: var(--grad-got);
  border-color: transparent;
  color: var(--ink);
}
.btn-danger {
  /* --danger itself reaches only 4.4:1 on the raised surface; text needs 4.5:1 (docs/design.md §3) */
  color: #ff6b78;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  font-size: 18px;
  line-height: 1;
}

/* Badges and pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
}

/* Empty state */
.empty {
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
  padding: 40px 8px;
}
.empty .hex {
  width: 72px;
  height: 82px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.empty h2 {
  font-size: 18px;
}
.empty p {
  margin: 0;
  color: var(--muted);
}
.empty .actions {
  display: grid;
  gap: var(--gap);
  width: 100%;
  margin-top: 8px;
}

/* ---- src/app/theme/shell.css ---- */
/* App shell: app bar, menu, screen heading, sheet, toast (docs/design.md §6, §7) */

/* App bar: its own sticky band on every screen; above the menu's scrim, so ☰ closes it again */
.appbar {
  position: sticky;
  top: 0;
  z-index: 28;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 2px var(--gutter);
  background: var(--grad-hot);
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(255, 122, 26, 0.25);
}
.appbar-logo {
  width: 34px;
  height: auto;
}
.appbar-name {
  grid-column: 2;
  text-align: center;
  font: 700 19px/1 var(--font-display);
  letter-spacing: 0.02em;
}
/* a 38px translucent circle inside a 44px touch area */
.menu-btn {
  grid-column: 3;
  justify-self: end;
  position: relative;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  cursor: pointer;
}
.menu-btn::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: rgba(13, 15, 31, 0.14);
  border: 1px solid rgba(13, 15, 31, 0.25);
  transition: background 0.2s;
}
.menu-btn svg {
  position: relative;
}
.menu-btn[aria-expanded='true']::before {
  background: rgba(13, 15, 31, 0.28);
}
.menu-btn:focus-visible {
  outline-color: var(--ink);
}
@media (hover: hover) and (pointer: fine) {
  .menu-btn:hover::before {
    background: rgba(13, 15, 31, 0.24);
  }
}

/* Menu: a solid panel just below the app bar at the right; between the action bar and sheets */
.menu-scrim {
  position: fixed;
  inset: 0;
  z-index: 26;
  background: rgba(5, 6, 14, 0.5);
  animation: fade-in 0.18s ease-out;
}
.menu {
  position: fixed;
  z-index: 27;
  right: max(var(--gutter), calc(50% - var(--column) / 2 + var(--gutter)));
  width: min(260px, calc(100% - 2 * var(--gutter)));
  margin-top: 8px;
  padding: 8px;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  transform-origin: top right;
  animation: menu-in 0.18s ease-out;
}
.menu ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.menu a {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 12px;
  border-radius: 12px;
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.menu a svg {
  color: var(--muted);
}
.menu a[aria-current='page'] {
  background: var(--raised);
}
.menu a[aria-current='page'] svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .menu a:hover {
    background: var(--raised);
  }
}
@keyframes menu-in {
  from {
    opacity: 0;
    transform: scale(0.94);
  }
}
@media (prefers-reduced-motion: reduce) {
  .menu,
  .menu-scrim {
    animation: none;
  }
}

/* Screen heading: back (only where it belongs), title, an element right after it */
.top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px var(--gutter) 10px;
}
.top-title {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 4px;
  justify-items: start;
}
.top h1 {
  font-size: 22px;
  line-height: 1.15;
  /* at most two lines, then "…" */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.top-actions {
  flex: none;
  display: flex;
  gap: 8px;
}
@media (min-width: 600px) {
  .top h1 {
    font-size: 26px;
  }
}
.back {
  font-size: 26px;
  text-decoration: none;
  color: var(--text);
}

/* the light passing over the main button every 5 s */
@keyframes shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(5, 6, 14, 0.6);
  animation: fade-in 0.2s ease-out;
}
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 31;
  width: 100%;
  max-width: var(--column);
  max-height: 88dvh;
  overflow-y: auto;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #1a1e3e 0%, var(--deck) 40%);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-top: 1px solid var(--rim);
  padding: 10px var(--gutter) calc(24px + env(safe-area-inset-bottom));
  animation: sheet-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet:focus {
  outline: none;
}
.sheet-grip {
  /* a 5px bar with a 44px tall touch area around it */
  width: 88px;
  height: 25px;
  margin: -10px auto 2px;
  background: linear-gradient(var(--rim), var(--rim)) center / 44px 5px no-repeat;
  border-radius: 3px;
}
.sheet-title {
  font-size: 23px;
  margin-bottom: 12px;
}
@keyframes sheet-in {
  from {
    transform: translate(-50%, 100%);
  }
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  transform: translate(-50%, 20px);
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 600;
}
/* above the action bar, near the bottom where there is none (research R7) */
body:has(.actionbar) .toast {
  bottom: calc(100px + env(safe-area-inset-bottom));
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast i {
  flex: none;
  width: 10px;
  height: 11px;
  background: var(--orange);
}

/* Expired sign-in: above the screen, solid like every interactive surface */
.signin-banner {
  position: relative;
  z-index: 3;
  display: grid;
  gap: 10px;
  margin: 12px var(--gutter) 0;
  padding: 14px 16px;
  background: var(--deck-2);
  border: 1px solid var(--orange);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
}
.signin-banner p {
  margin: 0;
  font-size: 14px;
}


/* Tablets and laptops use more of the screen (docs/design.md §6): a wider column, cards and game
   rows in a grid; sheets and the swipe card keep a readable width. */
@media (min-width: 768px) {
  :root {
    --column: 1040px;
  }
  .cards {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .rows {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .sheet {
    max-width: 560px;
  }
  .hexboard {
    max-width: none;
  }
  .swipe-screen,
  .intro {
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .form,
  .share {
    max-width: 640px;
  }
}

/* Dragging a sheet down to close it follows the finger; it springs back if let go early */
.sheet.is-dragging {
  transition: none;
  animation: none;
}
.sheet.is-settling {
  transition: transform 0.2s ease-out;
}
.sheet-grip {
  touch-action: none;
}
/* a heading that reacts to taps (Config: five taps show the developer section): no text selection,
   no double-tap zoom swallowing taps, and the whole title width as target */
.top h1.tappable {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  justify-self: stretch;
}

/* the page keeps room at the bottom only while an action bar is shown (research R7) */
.app:not(:has(.actionbar)) {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

/* Collection heading (docs/design.md v2.0.0 "Collection screen", "Ticker"): the name runs as a
   ticker before the pencil instead of wrapping to two lines; the pencil keeps its place after it */
.top h1.ticker {
  flex: 0 1 auto;
  display: block;
  -webkit-line-clamp: unset;
  overflow-wrap: normal;
}
.edit-btn svg {
  width: 18px;
  height: 18px;
}

/* ---- src/app/theme/actionbar.css ---- */
/* Action bar and main button (docs/design.md v2.0.0 "Action bar", "Main button"); F003 tasks T016 */

/* Dock position, padding and safe area of the old tab bar (research R7) */
.actionbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  z-index: 20;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--column);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(13, 15, 31, 0.98) 70%, rgba(13, 15, 31, 0));
}
.actionbar-left,
.actionbar-right,
.actionbar-outer {
  display: contents;
}
.actionbar-left > .act {
  grid-column: 2;
  grid-row: 1;
}
.actionbar-right > .act {
  grid-column: 4;
  grid-row: 1;
}
/* F004: the fourth action at the outer right (docs/design.md "Action bar") */
.actionbar-outer > .act {
  grid-column: 5;
  grid-row: 1;
}

.act {
  display: grid;
  justify-items: center;
  gap: 3px;
  min-height: 52px;
  padding: 6px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font: 600 11px var(--font-body);
  text-decoration: none;
  cursor: pointer;
}
.act svg {
  transition:
    transform 0.25s var(--spring),
    color 0.2s;
}
.act:active svg {
  transform: scale(0.85);
}
.act.is-active svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .act:hover {
    color: var(--text);
  }
  .act:hover svg {
    color: var(--orange-2);
  }
}

.main-btn {
  position: relative;
  grid-column: 3;
  grid-row: 1;
  justify-self: center;
  width: 62px;
  height: 68px;
  margin-top: -26px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 0;
  background: var(--grad-hot);
  color: var(--ink);
  cursor: pointer;
}
.main-btn svg {
  position: relative;
  z-index: 1;
  width: 26px;
  height: 26px;
}
/* a light shimmer passes over it every 5 s */
.main-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
  transform: translateX(-130%);
  animation: main-shimmer 5s ease-in-out infinite;
}
@keyframes main-shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}
/* not available yet: raised grey, no shimmer, no hover or press */
.main-btn.hex-btn:disabled {
  background: var(--raised);
  color: var(--placeholder);
  cursor: not-allowed;
  scale: none;
  filter: none;
}
.main-btn:disabled::after {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  .main-btn::after {
    display: none;
  }
}

@media (min-width: 768px) {
  .actionbar {
    max-width: 560px;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
}

/* ---- src/app/theme/components.css ---- */
/* Feature components: docs/design.md §7 (collection card, game row, group heading, hexagon picker, forms) */

/* Mark gradients (docs/design.md §4), used by pickers, pills and group dots */
[data-mark='new'],
[data-tone='new'] {
  --tone: var(--grad-white);
  --tone-text: var(--ink);
}
[data-mark='must_have'],
[data-tone='must_have'],
[data-tone='hot'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='interested'],
[data-tone='interested'] {
  --tone: var(--grad-cool);
  --tone-text: var(--ink);
}
[data-mark='unsure'],
[data-tone='unsure'] {
  --tone: var(--grad-violet);
  --tone-text: #fff;
}
[data-mark='poop'],
[data-tone='poop'] {
  --tone: var(--grad-mud);
  --tone-text: #fff;
}
[data-mark='skip'],
[data-tone='skip'] {
  --tone: var(--grad-red);
  --tone-text: #fff;
}
[data-mark='bought'] {
  --tone: var(--grad-got);
  --tone-text: var(--ink);
}
/* hall groups (group by booth): halls in the hot gradient, "No booth yet" muted */
[data-mark='hall'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='none'] {
  --tone: linear-gradient(135deg, #6e74a0, #9aa0c8);
  --tone-text: var(--ink);
}

.section-title {
  font-size: 18px;
  margin: 20px 0 10px;
}
.section-title small {
  font: 600 13px var(--font-body);
  color: var(--muted);
  margin-left: 6px;
}
.hint {
  margin: 8px 2px 0;
  font-size: 13px;
  color: var(--muted);
}
.hint.error {
  color: #ff8a95;
}
.form {
  display: grid;
  gap: 14px;
}
.field.is-disabled {
  opacity: 0.6;
  box-shadow: none;
}
.field svg {
  flex: none;
  color: var(--muted);
}

/* Dropdown: field look with an orange hexagon as arrow */
.field.select {
  position: relative;
}
.field.select select {
  appearance: none;
  padding-right: 24px;
  cursor: pointer;
}
.field.select select option {
  background: var(--deck);
}
.field.select::after {
  content: '';
  position: absolute;
  right: 16px;
  width: 12px;
  height: 14px;
  clip-path: var(--hex);
  background: var(--grad-hot);
  pointer-events: none;
}

/* Switch ("Essen collection") */
.toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  cursor: pointer;
}
.toggle-text {
  flex: 1;
  font-weight: 600;
}
.toggle-text small {
  display: block;
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
}
.switch {
  appearance: none;
  flex: none;
  position: relative;
  width: 52px;
  height: 32px;
  margin: 6px 0;
  border-radius: var(--r-pill);
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  cursor: pointer;
  transition: background 0.2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  clip-path: var(--hex);
  background: var(--muted);
  transition: transform 0.25s var(--spring);
}
.switch:checked {
  background: var(--grad-hot);
  border-color: transparent;
}
.switch:checked::after {
  background: var(--ink);
  transform: translateX(20px);
}

/* Hexagon picker: honeycomb, every second hexagon offset down */
/* one straight, centred row of equal hexagons, whatever their labels and the phone's text scaling */
.picker {
  display: grid;
  grid-template-columns: repeat(var(--count, 4), minmax(0, 84px));
  justify-content: center;
  align-items: start;
  gap: 8px;
  margin: 12px 0 16px;
}
.picker-btn {
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 12px;
}
.picker-hex {
  display: block;
  aspect-ratio: 0.88;
  padding: 2px;
  background: var(--border-2);
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.picker-face {
  height: 100%;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 2px;
  padding: 0 4px;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  hyphens: auto;
  background: var(--raised);
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
}
.picker-emoji {
  font-style: normal;
  font-size: 22px;
}
.picker-btn[aria-pressed='true'] .picker-hex {
  background: var(--orange);
}
.picker-btn[aria-pressed='true'] .picker-face {
  background: var(--tone);
  color: var(--tone-text);
}
.picker-btn:is([data-tone='unsure'], [data-tone='poop'])[aria-pressed='true'] .picker-face {
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Collection cards with the hexagon cluster in the top-right corner */
.cards {
  display: grid;
  gap: var(--gap);
}
/* off-screen cards skip layout, paint and their cluster animation (long lists stay fast) */
.cards > .card {
  content-visibility: auto;
  contain-intrinsic-size: auto 96px;
}
.card {
  position: relative;
  display: block;
  overflow: hidden;
  color: var(--text);
  text-decoration: none;
}
.card-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  padding-right: 64px;
}
.card-name {
  min-width: 0;
  overflow-wrap: anywhere;
}
.card-sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}
/* the six counts always in one row; the text shrinks on narrow phones instead of wrapping */
.counts {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  margin: 10px 0 0;
  font: 700 clamp(12px, 3.7vw, 15px) var(--font-display);
  white-space: nowrap;
}
.cluster {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 58px;
  height: 52px;
  animation: sway 6s ease-in-out infinite;
}
.cluster i {
  position: absolute;
  width: 22px;
  height: 25px;
  background: var(--grad-dusk);
  filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
}
.cluster i:nth-child(1) {
  top: 0;
  right: 0;
}
.cluster i:nth-child(2) {
  top: 0;
  right: 24px;
  opacity: 0.7;
}
.cluster i:nth-child(3) {
  top: 20px;
  right: 12px;
  opacity: 0.85;
}
@keyframes sway {
  0%,
  100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(4deg);
  }
}
.soon-card {
  margin-bottom: 16px;
}
.soon-card .card-title {
  padding-right: 0;
}
/* F002 Share hint at the top of Config */
.hint-card .card-title {
  padding-right: 0;
}

.row-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.row-actions .btn {
  padding-inline: 10px;
}
.group {
  margin-bottom: 16px;
}
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 16px;
}
.group-title i {
  flex: none;
  width: 12px;
  height: 14px;
  background: var(--tone);
}
.group-count {
  color: var(--muted);
  font-weight: 700;
}
.fold {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  text-align: left;
}
.chev {
  margin-left: auto;
  font-size: 22px;
  transition: transform 0.2s;
}
.fold[aria-expanded='true'] .chev {
  transform: rotate(90deg);
}

.rows {
  display: grid;
  gap: var(--gap);
  margin: 0;
  padding: 0;
  list-style: none;
}
.rows[hidden] {
  display: none;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  text-align: left;
}
.row-meta {
  flex: 1;
  min-width: 0;
  display: grid;
}
.row-name {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-sub {
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* F002 "Just added": the hover highlight, kept until the user scrolls or taps (not an animation) */
.row.is-just-added {
  border-color: var(--orange);
  box-shadow: var(--lift), var(--glow);
}
.row.skip .row-name {
  text-decoration: line-through;
  color: var(--muted);
}
.row.skip .cover {
  opacity: 0.5;
}
.row .pill,
.detail-head .pill {
  flex: none;
  background: var(--tone);
  color: var(--tone-text);
}
.mark-pill {
  padding: 4px 8px;
}

/* Hexagon covers */
.cover {
  position: relative;
  flex: none;
  display: block;
}
.cover-hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--grad-dusk);
}
.cover-hex img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-initials {
  font: 700 17px var(--font-display);
  color: var(--ink);
}
.cover-got {
  position: absolute;
  right: -4px;
  bottom: -2px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--grad-got);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
}

/* Game details sheet */
.detail-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
}
.detail-sub {
  margin: 0 0 6px;
  color: var(--muted);
}
.link-out {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 700;
}
.sheet-actions {
  display: grid;
  gap: var(--gap);
  margin-top: 12px;
}

/* "Group by" under the filter in a collection */
.group-by {
  margin-top: 12px;
}

/* Config → Developer: plain links, each a full-width 44px target */
.dev-links {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.dev-links a {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 600;
}

/* Cancel and the main action side by side, the main action on the right */
.sheet-actions-row {
  grid-template-columns: 1fr 1fr;
}

/* Game info (docs/design.md §7 "Game info"): year beside the name, publisher, then three infos */
.row-year {
  font-weight: 500;
  color: var(--muted);
}
.row-info {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin-top: 2px;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  white-space: nowrap;
}
.row-info > span:first-child {
  flex: none;
}
.info-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}
.row-info .info-pills {
  flex-wrap: nowrap;
  overflow: hidden;
}
.info-pill {
  flex: none;
  padding: 1px 8px;
  border: 1px solid var(--border);
  background: var(--raised);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.info-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  margin: 0 0 12px;
}
.info-list > div {
  display: contents;
}
.info-list dt {
  color: var(--muted);
  font-size: 14px;
}
.info-list dd {
  margin: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* F003: the SPIEL preview suggestion above a BGG list link field */
.list-suggestion {
  margin-bottom: 10px;
}

/* ---- src/app/theme/fair.css ---- */
/* At the fair (US4): filter button and panel, bought line, game description, facts, price question (docs/design.md §7) */

/* Filter: one full-width button, a panel below it */
.chip {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
}
.chip[aria-pressed='true'] {
  border-color: var(--orange);
  background: var(--raised);
  box-shadow: var(--glow);
}
.seg-title {
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.seg {
  /* one column per option, all in one row */
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.seg button {
  min-height: var(--tap);
  min-width: 0;
  padding: 0 4px;
  overflow-wrap: anywhere;
  border: 0;
  border-radius: 13px;
  background: none;
  color: var(--muted);
  font-weight: 700;
  font-size: 14px;
}
.seg button[aria-pressed='true'] {
  background: var(--grad-hot);
  color: var(--ink);
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  border-top: 1px solid var(--rim);
  cursor: pointer;
}
.filter-row:first-child {
  border-top: 0;
}
.filter-row input {
  flex: none;
  width: 20px;
  height: 20px;
  accent-color: var(--orange);
}
.filter-row span {
  flex: 1;
}
.filter-row small {
  font: 600 14px var(--font-display);
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .chip:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}
.chip:active,
.seg button:active {
  scale: 0.96;
}

/* "✅ 1 game bought, €52 spent" under the filter */
.bought-line {
  margin: 10px 2px 0;
  font-weight: 700;
  color: #7cf0c5;
}

/* Game details: description, facts, price question */
.detail-head .pill {
  margin-top: 4px;
}
.desc {
  margin: 4px 0 12px;
  font-size: 14px;
}
.muted {
  color: var(--muted);
}
.facts-box {
  margin-bottom: 8px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.facts-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0 12px;
}
.facts-by {
  font-size: 13px;
  font-weight: 700;
  color: var(--orange-2);
}
.link-btn {
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--orange-2);
  font-weight: 700;
  text-align: left;
}
.facts-add {
  margin-bottom: 8px;
}
.facts-form {
  margin-bottom: 12px;
}
.price-row {
  display: grid;
  grid-template-columns: 1fr 112px;
  gap: var(--gap);
}
.form-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.currency {
  font-weight: 700;
  color: var(--muted);
}

/* "Groups" with Select all / Select none on the same line */
.seg-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.seg-actions {
  display: flex;
  gap: 4px;
}
.seg-actions .link-btn {
  min-height: var(--tap);
  padding: 0 8px;
}

/* filter icon in the collection header; a dot while a filter or the hall grouping is active */
.filter-icon {
  position: relative;
}
.filter-icon.is-active::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 10px;
  height: 11px;
  clip-path: var(--hex);
  background: var(--grad-hot);
}
/* what is shown while narrowed; a tap opens "Filter and group" */
.filter-summary {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: var(--tap);
  margin-top: 10px;
  padding: 6px 14px;
  border: 1px solid var(--orange);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  text-align: left;
}

/* ---- src/app/theme/lists.css ---- */
/* BGG lists: list cards, list rows with +, progress, list game sheet (docs/design.md §7) */

.example {
  color: var(--text);
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* Loading progress: pages loaded so far */
.progress {
  height: 6px;
  margin-top: 10px;
  border-radius: var(--r-pill);
  background: var(--rim);
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad-hot);
}
@media (prefers-reduced-motion: no-preference) {
  .progress span {
    transition: width 0.4s ease-out;
  }
}
.list-status {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--muted);
}
.list-status p {
  margin: 0;
}
.list-status.error {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  color: #ff8a95;
}

/* List rows: the row opens the game, the hexagon + next to it does the same */
.list-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.list-item .row {
  flex: 1;
  min-width: 0;
}
.in-mark {
  font-size: 12px;
  font-weight: 700;
  color: var(--teal);
}
.add-mini {
  flex: none;
  width: 48px;
  height: 54px;
  padding: 0;
  border: 0;
  background: none;
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.add-mini .hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  background: var(--grad-hot);
  color: var(--ink);
  font: 700 26px var(--font-display);
}

/* List game sheet */
.description {
  margin: 8px 0 12px;
  color: var(--muted);
  font-size: 14px;
}

/* Multi-choice list: a hexagon tick per collection; the ticks always show the current truth */
.picks {
  display: grid;
  gap: var(--gap);
}
.pick {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  cursor: pointer;
}
.pick:has(.pick-input:focus-visible) {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}
.pick-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.tick {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 32px;
  background: var(--border-2);
}
.tick::before {
  content: '';
  width: 24px;
  height: 28px;
  clip-path: var(--hex);
  background: var(--raised);
}
.pick-input:checked + .tick {
  background: var(--orange);
}
.pick-input:checked + .tick::before {
  background: var(--grad-hot);
}
.pick-input:checked + .tick::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ink);
  font-weight: 800;
}
.pick-text {
  flex: 1;
  min-width: 0;
  display: grid;
}
.pick-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.pick-text small {
  font-size: 13px;
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .pick:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}

/* ---- src/app/theme/interaction.css ---- */
/* Interaction states: docs/design.md §8. Nothing moves on hover; press squishes; focus is orange. */
:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}

.btn,
.icon-btn,
.card,
.row,
.tile {
  transition:
    background 0.2s,
    border-color 0.2s,
    box-shadow 0.25s,
    color 0.2s,
    scale 0.25s var(--spring);
}

@media (hover: hover) and (pointer: fine) {
  .card:not([aria-disabled='true']):hover,
  .row:hover,
  .tile:hover,
  .field:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .btn:not(:disabled):not(.btn-primary):not(.btn-bought):hover,
  .icon-btn:hover {
    background: var(--grad-hot);
    border-color: transparent;
    color: var(--ink);
  }
  .btn-danger:not(:disabled):hover {
    background: var(--grad-red);
    color: #fff;
  }
  .btn-primary:not(:disabled):hover,
  .btn-bought:not(:disabled):hover {
    box-shadow: var(--lift), 0 0 22px rgba(255, 176, 32, 0.55);
  }
  .hex-btn:hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Press: a short squish that springs back (touch and pointer) */
.card:active,
.row:active,
.tile:active {
  scale: 0.98;
  transition-duration: 0.08s;
}
.btn:not(:disabled):active,
.icon-btn:active {
  scale: 0.96;
  transition-duration: 0.08s;
}
.hex-btn {
  transition:
    scale 0.25s var(--spring),
    filter 0.2s;
}
.hex-btn:active {
  scale: 0.9;
  transition-duration: 0.08s;
}

/* Tap pulse: an orange hexagon expanding from the tap point */
.tap-pulse {
  position: fixed;
  z-index: 60;
  width: 56px;
  height: 64px;
  margin: -32px 0 0 -28px;
  clip-path: var(--hex);
  background: radial-gradient(circle, rgba(255, 176, 32, 0.55), rgba(255, 122, 26, 0) 70%);
  pointer-events: none;
  animation: tap-pulse 0.5s ease-out forwards;
}
@keyframes tap-pulse {
  from {
    transform: scale(0.3);
    opacity: 1;
  }
  to {
    transform: scale(1.6);
    opacity: 0;
  }
}

/* Reduced motion (docs/design.md §9): every animation and press squish off */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  .card:active,
  .row:active,
  .tile:active,
  .btn:active,
  .icon-btn:active,
  .hex-btn:active,
  .hex-btn:hover {
    scale: none;
  }
  .tap-pulse {
    display: none;
  }
}

/* ---- src/app/theme/ticker.css ---- */
/* Ticker for headings too long for their row (docs/design.md v2.0.0 "Ticker"); F003 tasks T024 */
.ticker {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  overflow-wrap: normal;
}
.ticker > span {
  display: inline-block;
}
/* soft fades at both edges; the left padding keeps the first letter clear of the fade */
.ticker.is-long {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  padding-left: 10px;
  margin-left: -10px;
}
.ticker.is-long > span {
  animation: ticker var(--ticker-time, 8s) linear infinite;
}
@keyframes ticker {
  /* read the start */
  0%,
  18% {
    transform: translateX(0);
  }
  /* the end is visible, then start over */
  82%,
  100% {
    transform: translateX(calc(-1 * var(--ticker-shift)));
  }
}
/* reduced motion: the text stands still and ends in "…" */
@media (prefers-reduced-motion: reduce) {

    text-overflow: ellipsis;
  }

    padding-left: 0;
    margin-left: 0;
  }
  .ticker.is-long > span {
    display: inline;
    animation: none;
  }
}

/* ---- src/app/theme/swipe.css ---- */
/* Swipe screen and list picker: docs/design.md §7 (swipe card), §9 (swipe motion) */

/* A card dragged or flung past the edge never scrolls the page sideways */
.swipe-screen {
  overflow-x: clip;
}

/* Source note: which list, whether facts are kept */
.swipe-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.swipe-note b {
  color: var(--text);
}
.swipe-note > .hex {
  flex: none;
  width: 14px;
  height: 16px;
  margin-top: 2px;
  background: var(--grad-dusk);
}

/* Card stack */
.deck {
  position: relative;
  height: min(400px, 54vh);
  min-height: 340px;
  margin: 0 0 14px;
}
.swipe-card {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  padding: 20px 18px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, #1f2350 0%, var(--deck) 70%);
  box-shadow: var(--lift);
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
}
.swipe-card > * {
  flex-shrink: 0;
}
.swipe-card.behind {
  transform: scale(0.95) translateY(14px);
  opacity: 0.6;
}
.swipe-card.top {
  touch-action: pan-y;
  cursor: grab;
  transition: transform 0.5s var(--spring);
}
.swipe-card.top.dragging {
  transition: none;
  cursor: grabbing;
}
.swipe-card.enter {
  animation: swipe-card-in 0.45s var(--spring);
}
@keyframes swipe-card-in {
  from {
    transform: scale(0.94) translateY(16px);
    opacity: 0.6;
  }
}
.swipe-card.leaving {
  pointer-events: none;
  animation: swipe-fling 0.38s cubic-bezier(0.5, 0, 0.75, 0) forwards;
}
@keyframes swipe-fling {
  from {
    transform: translateX(var(--from-x)) rotate(calc(var(--from-x) / 14px * 1deg));
  }
  to {
    transform: translate(calc(var(--dir) * 520px), -40px) rotate(calc(var(--dir) * 30deg));
    opacity: 0;
  }
}
.swipe-card .cover {
  margin-bottom: 12px;
}
.swipe-name {
  margin: 0;
  font: 700 24px/1.15 var(--font-display);
}
.swipe-year {
  margin: 2px 0 8px;
  color: var(--muted);
}
.swipe-desc {
  display: -webkit-box;
  margin: 0 0 10px;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
}
.swipe-wait {
  justify-content: center;
  gap: 12px;
  cursor: default;
}
.swipe-wait .hex {
  width: 56px;
  height: 64px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.swipe-wait p {
  margin: 0;
  color: var(--muted);
}

/* ADD / NOPE stamps grow while dragging; the leaving card shows its stamp in full */
.swipe-stamp {
  position: absolute;
  top: 20px;
  padding: 4px 10px;
  border: 2px solid;
  border-radius: 10px;
  font: 700 18px var(--font-display);

}
.swipe-stamp.add {
  left: 16px;

  right: 16px;
  color: var(--danger);
  rotate: 12deg;
}
.leaving-right .swipe-stamp.add,
.leaving-left .swipe-stamp.nope {
  opacity: 1;
  scale: 1.2;

/* ✕ / ✓ hexagon buttons */
.swipe-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
}
.swipe-btn {

const initials = n => n.split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase()
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()

function art(g) {

/* ---------- the stand-in search: exact matches first, then names starting with it, then the rest; within each, the better-known games (geek rating) first ---------- */
function find(q, max) {
  const f = fold(q.trim())
  const rank = g => (fold(g.name) === f ? 0 : fold(g.name).startsWith(f) ? 1 : 2)
  return ALLBGG.filter(g => fold(g.name).includes(f)).sort((a, b) => rank(a) - rank(b) || (b.geek ?? 0) - (a.geek ?? 0) || a.name.localeCompare(b.name)).slice(0, max)
}
const valid = q => q.trim().length >= 2 && q.trim().length <= 100

/* ---------- state ---------- */
let S
const net = () => S.net // 'ok' | 'offline' | 'down' | 'busy'

function runSearch(q, { now = false, max = 50, into = 'search' } = {}) {
  clearTimeout(S.debounce)
  const seq = ++S.seq
  const go = () => {
    if (!valid(q)) { S[into] = { q, state: q.trim() ? 'short' : 'idle' }; return draw(into) }
    if (net() === 'offline') { S[into] = { q, state: 'offline' }; return draw(into) }
    const prev = S[into]
    S[into] = { q, state: 'loading', results: prev?.results, waiting: false }
    draw(into)
    const cached = S.cache.get(q.trim().toLowerCase() + '|' + max)
    const wait = cached ? 120 : net() === 'busy' ? 3200 : 650
    if (net() === 'busy' && !cached) setTimeout(() => { if (seq === S.seq && S[into].state === 'loading') { S[into].waiting = true; draw(into) } }, 900)
    setTimeout(() => {
      if (seq !== S.seq) return // an older search answered after a newer one: ignored
      if (net() === 'down') { S[into] = { q, state: 'down' }; return draw(into) }
      const results = cached || find(q, max)
      S.cache.set(q.trim().toLowerCase() + '|' + max, results)
      S[into] = { q, state: 'done', results }
      draw(into)
      setTimeout(() => { results.forEach(g => covered.add(g.id)); if (seq === S.seq) draw(into) }, cached ? 0 : 700)
    }, wait)
  }
  if (now) go(); else S.debounce = setTimeout(go, 500)
}
const draw = into => (into === 'search' ? drawResults() : drawMatches())

const resultRow = (g, compact) => `<li><button type="button" class="srow${compact ? ' compact' : ''}" data-act="${compact ? 'pick-match' : 'open-result'}" data-id="${g.id}" aria-label="${esc(g.name)}, ${yearText(g)}${g.exp ? ', expansion' : ''}"${inText(g) ? ` aria-describedby="in-${g.id}"` : ''}>${cover(g, compact ? 40 : 48)}<span class="row-meta"><span class="row-name">${esc(g.name)}</span><span class="row-sub">${yearText(g)}${g.exp ? '<span class="kind">Expansion</span>' : ''}</span></span>${inText(g) ? `<span class="in-mark" id="in-${g.id}">${esc(inText(g))}</span>` : ''}</button></li>`

function drawResults() {
  const box = $('#results'); if (!box) return
  const r = S.search || { state: 'idle' }
  const status = html => `<p class="result-status" role="status">${html}</p>`
  if (r.state === 'idle') return (box.innerHTML = status('') + `<p class="proto-note">Try “cascad”, “tokaido” (finds Tôkaidô), “harmon”, “the” (50 results) or “zzz” (no match). The proto bar switches network states.</p>`)
  if (r.state === 'short') return (box.innerHTML = status(r.q.trim().length > 100 ? 'At most 100 letters.' : 'Type at least 2 letters.'))
  if (r.state === 'offline') return (box.innerHTML = status('') + `<div class="notice warn"><p><b>You're offline.</b> Searching needs a connection.</p><button type="button" class="btn" data-act="retry">Try again</button></div>`)

  if (r.state === 'loading') {

function zigzag(selected, act) {
  const avail = Math.min(440, window.innerWidth) - 32, gap = 4

  const pos = i => (i % 2 === 0 ? [(i / 2) * (w + gap), 0] : [(w + gap) / 2 + ((i - 1) / 2) * (w + gap), h * 0.75 + gap])
  return `<div class="zz pointy" role="group" aria-label="Category" style="width:${3 * w + 2 * gap}px;height:${h * 1.75 + gap}px">${PICK.map((c, i) => {
    const [x, y] = pos(i)
    return `<button type="button" class="picker-btn" data-tone="${c.k}" data-act="${act}" data-cat="${c.k}" aria-pressed="${selected === c.k}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><span class="picker-hex hex"><span class="picker-face hex"><b>${c.e}</b><span>${c.l}</span></span></span></button>`
  }).join('')}</div>`
}

function done() {
  const { g, ticked, mark } = S.detail
  let added = 0, removed = 0
  for (const c of COLLS) {
    if (ticked.has(c.id) && !c.has[g.id]) { c.has[g.id] = mark; added++ }
    if (!ticked.has(c.id) && c.has[g.id]) { delete c.has[g.id]; removed++ }
  }
  closeSheet(); drawResults()
  if (added || removed) toast([added && `Added ${g.name} to ${plural(added, 'collection')}`, removed && `Removed it from ${plural(removed, 'collection')}`].filter(Boolean).join('. '))
}

function drawMatches() {
  const box = $('#matches'); if (!box) return
  const a = S.add, r = S.addSearch
  if (a.linkError) return (box.innerHTML = `<p class="hint error">${a.linkError}</p>`)
  if (!r || r.state === 'idle') return (box.innerHTML = '')
  if (r.state === 'short') return (box.innerHTML = '<p class="hint">Type at least 2 letters.</p>')
  if (r.state === 'offline') return (box.innerHTML = `<p class="hint error">You're offline. Paste a link instead, or <button type="button" class="link-btn" data-act="add-retry">try again</button>.</p>`)
  if (r.state === 'down') return (box.innerHTML = `<p class="hint error">BoardGameGeek is not reachable. <button type="button" class="link-btn" data-act="add-retry">Try again</button></p>`)
  if (r.state === 'loading') return (box.innerHTML = `<p class="result-status" role="status"><span class="spin-hex"></span>${r.waiting ? 'BoardGameGeek asks us to wait…' : 'Searching BoardGameGeek…'}</p>`)
  if (!r.results.length) return (box.innerHTML = `<p class="hint" role="status">No game called “${esc(r.q.trim())}” on BoardGameGeek.</p>`)
  box.innerHTML = `<p class="visually-hidden" role="status">${plural(r.results.length, 'match')}</p><ul class="matches" aria-label="Matching games">${r.results.map(g => resultRow(g, true)).join('')}</ul>`
}
function addInput(text) {
  const a = S.add
  a.text = text; a.linkError = null
  const linkMode = S.addSeg ? a.mode === 'link' : looksLikeLink(text)
  if (linkMode) {
    clearTimeout(S.debounce); S.seq++; S.addSearch = null
    const m = text.match(LINK)
    if (!text.trim()) return drawMatches()
    if (!m) { a.linkError = 'That is not a BoardGameGeek game link.'; return drawMatches() }
    const id = +m[2]
    const known = ALLBGG.find(g => g.id === id)
    const name = known?.name ?? (m[3] || 'Game ' + id).replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
    a.picked = known ?? { id, i: 99, name, year: null, exp: m[1] === 'boardgameexpansion' }
    a.name = name
    return setSheet(addBody())
  }
  runSearch(text, { max: 8, into: 'addSearch' })
}

/* ---------- render and events ---------- */
function render() {
  root.innerHTML = `<div class="app">${appbar()}${S.screen === 'collection' ? collectionStub() : searchScreen()}</div>`
  drawResults()
}
function collectionStub() {
  return `<div class="top"><div class="top-title"><h1>Essen 2026</h1></div></div>
  <main class="screen"><p class="bought-line">✅ 2 games bought, €93 spent</p><hr class="separator" /><p class="proto-note">The collection as today (F005). Add game opens the sheet with search by name.</p></main>
  <nav class="actionbar" aria-label="Actions"><div class="actionbar-left"><button type="button" class="act" data-act="open-add">${ICON.plus}<span>Add game</span></button></div><button type="button" class="main-btn hex hex-btn" aria-label="BG-Tinder">${ICON.heart}</button><div class="actionbar-right"><button type="button" class="act">${ICON.filter}<span>Filter</span></button></div><div class="actionbar-outer"><button type="button" class="act">${ICON.honey}<span>Show-off</span></button></div></nav>`
}
function openAdd() {
  S.add = { text: '', mode: 'name', picked: null, name: '', mark: 'new', linkError: null }
  S.addSearch = null
  openSheet('add', addBody(), 'Add game')
  setTimeout(() => $('#aq')?.focus(), 50)
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return
  const a = t.dataset.act
  if (a === 'close') return closeSheet()
  if (a === 'viewer') return viewer(+t.dataset.id)
  if (a === 'viewer-close') { viewerLayer.innerHTML = ''; return }
  if (a === 'search-now') { const q = $('#sq'); q.focus(); return runSearch(q.value, { now: true }) }
  if (a === 'retry') return runSearch(S.search.q, { now: true })
  if (a === 'open-result') return openDetails(+t.dataset.id)
  if (a === 'tick') { const c = t.dataset.c; t.checked ? S.detail.ticked.add(c) : S.detail.ticked.delete(c); return setSheet(detailsBody(S.detail.g)) }
  if (a === 'detail-mark') { S.detail.mark = S.detail.mark === t.dataset.cat ? 'new' : t.dataset.cat; return setSheet(detailsBody(S.detail.g)) }
  if (a === 'done') return done()
  if (a === 'open-add') return openAdd()
  if (a === 'add-mode') { S.add = { ...S.add, mode: t.dataset.v, text: '', linkError: null }; S.addSearch = null; setSheet(addBody()); return $('#aq')?.focus() }
  if (a === 'add-retry') return runSearch(S.add.text, { now: true, max: 8, into: 'addSearch' })
  if (a === 'pick-match') { const g = ALLBGG.find(x => x.id === +t.dataset.id); S.add.picked = g; S.add.name = g.name; return setSheet(addBody()) }
  if (a === 'unpick') { S.add.picked = null; setSheet(addBody()); drawMatches(); return $('#aq')?.focus() }
  if (a === 'add-mark') { S.add.mark = S.add.mark === t.dataset.cat ? 'new' : t.dataset.cat; setSheet(addBody()); return drawMatches() }
})
document.addEventListener('submit', e => {
  if (e.target.id !== 'add-form') return
  e.preventDefault()
  const { picked, name, mark } = S.add
  essen().has[picked.id] = mark
  closeSheet()
  toast(`Added ${name.trim()} to ${essen().name}`)
})
document.addEventListener('input', e => {
  if (e.target.id === 'sq') return runSearch(e.target.value)
  if (e.target.id === 'aq') return addInput(e.target.value)
  if (e.target.id === 'aname') { S.add.name = e.target.value; const b = layer.querySelector('[type=submit]'); b.disabled = !e.target.value.trim() || !!essen().has[S.add.picked.id] }
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (viewerLayer.innerHTML) viewerLayer.innerHTML = ''; else if (S.sheet) closeSheet() }
  if (e.key === 'Enter' && e.target.id === 'sq') { e.preventDefault(); runSearch(e.target.value, { now: true }) }
})

function start() {
  const s = $('#start').value
  clearTimeout(S?.debounce)
  S = { token: s !== 'notoken', net: { offline: 'offline', down: 'down', busy: 'busy' }[s] || 'ok', screen: s.startsWith('add') ? 'collection' : 'search', addSeg: s === 'add-seg', sheet: null, search: null, seq: 0, cache: new Map(), debounce: 0 }
  closeSheet(); viewerLayer.innerHTML = ''
  render()
  const q = { results: 'cascad', nomatch: 'zzz', many: 'the', busy: 'cascad', offline: 'cascad', down: 'cascad', details: 'cascad' }[s]
  if (q) { $('#sq').value = q; runSearch(q, { now: true }) }
  if (s === 'details') setTimeout(() => openDetails(295947), 900)
  if (s.startsWith('add')) openAdd()
  if (s === 'search') $('#sq')?.focus()
}
$('#start').onchange = start
start()
</script>

</body>
</html>
