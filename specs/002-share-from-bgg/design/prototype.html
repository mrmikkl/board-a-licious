/* ---- src/app/theme/tokens.css ---- */
/* Design tokens: docs/design.md §3–§6, one-to-one */
:root {
  --ink: #0d0f1f;
  --deck: #151831;
  --deck-2: #1d2142;
  --rim: #2c3160;
  --border: #3a4078;
  --border-2: #4a5196;
  --raised: #232852;
  --text: #eceeff;
  --muted: #9aa0c8;
  --placeholder: #6e74a0;
  --orange: #ff7a1a;
  --orange-2: #ffb020;
  --indigo: #4c5bff;
  --teal: #14c8c8;
  --violet: #8b5cf6;
  --danger: #ff4d5e;
  --got: #0fb98f;

  --grad-hot: linear-gradient(135deg, #ff7a1a 0%, #ffb020 100%);
  --grad-cool: linear-gradient(135deg, #4c5bff 0%, #14c8c8 100%);
  --grad-violet: linear-gradient(135deg, #6d4ae0 0%, #a78bfa 100%);
  --grad-mud: linear-gradient(135deg, #7a6046 0%, #b0916e 100%);
  --grad-red: linear-gradient(135deg, #c2183a 0%, #ff4d5e 100%);
  --grad-got: linear-gradient(135deg, #0fb98f 0%, #7cf0c5 100%);
  --grad-dusk: linear-gradient(135deg, #8b5cf6 0%, #4c5bff 55%, #14c8c8 100%);
  --grad-white: linear-gradient(135deg, #ffffff 0%, #c9cdf0 100%);
  --grad-separator: linear-gradient(90deg, #ff7a1a 0%, #8b5cf6 100%);

  --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  --lift: 0 8px 22px rgba(3, 4, 12, 0.55), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --glow: 0 0 0 1px var(--orange), 0 0 18px rgba(255, 122, 26, 0.45);

  --font-display: 'Chakra Petch', 'Avenir Next Condensed', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;
  --tap: 44px;
  --gutter: 16px;
  --column: 440px;
  --gap: 8px;

  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---- src/app/theme/base.css ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  font-weight: 700;
  margin: 0;
}
a {
  color: var(--orange-2);
}
.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Layout: the phone column (docs/design.md §6) */
.app {
  position: relative;
  max-width: var(--column);
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
.screen {
  position: relative;
  z-index: 1;
  padding: 0 var(--gutter);
}
.lead {
  color: var(--muted);
  margin: 0 0 16px;
  font-size: 14px;
}
.hex {
  clip-path: var(--hex);
}
.separator {
  height: 2px;
  border: 0;
  margin: 16px 0;
  background: var(--grad-separator);
  border-radius: 2px;
}

/* Surfaces */
.card {
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--lift);
  padding: 16px;
}
.field {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  padding: 0 14px;
  min-height: 50px;
}
.field:focus-within {
  border-color: var(--orange);
}
.field input,
.field select {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 12px 0;
}
.field input::placeholder {
  color: var(--placeholder);
}
.label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin: 0 0 6px;
}

/* Buttons (docs/design.md §7): text on gradients follows the contrast rule of §3 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 10px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-2);
  background: var(--raised);
  font-weight: 700;
  box-shadow: var(--lift);
  text-decoration: none;
  color: var(--text);
}
.btn-block {
  width: 100%;
}
.btn-primary {
  background: var(--grad-hot);
  border-color: transparent;
  color: var(--ink);
}
.btn-bought {
  background: var(--grad-got);
  border-color: transparent;
  color: var(--ink);
}
.btn-danger {
  /* --danger itself reaches only 4.4:1 on the raised surface; text needs 4.5:1 (docs/design.md §3) */
  color: #ff6b78;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  font-size: 18px;
  line-height: 1;
}

/* Badges and pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
}

/* Empty state */
.empty {
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
  padding: 40px 8px;
}
.empty .hex {
  width: 72px;
  height: 82px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.empty h2 {
  font-size: 18px;
}
.empty p {
  margin: 0;
  color: var(--muted);
}
.empty .actions {
  display: grid;
  gap: var(--gap);
  width: 100%;
  margin-top: 8px;
}

/* ---- src/app/theme/hexboard.css ---- */
/* Background: the living hexagon board behind the phone column (docs/design.md §2, §9).
   Below every other layer and never in the way of a tap. */
.hexboard {
  position: fixed;
  top: 0;
  left: 50%;
  z-index: -1;
  width: 100%;
  max-width: var(--column);
  height: 100%;
  height: 100lvh;
  transform: translateX(-50%);
  pointer-events: none;
}

/* ---- src/app/theme/shell.css ---- */
/* App shell: header, tab bar, sheet, toast (docs/design.md §7) */
.top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px var(--gutter) 10px;
}
.top-title {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 4px;
  justify-items: start;
}
.top h1 {
  font-size: 22px;
  line-height: 1.15;
  /* at most two lines, then "…" */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.top-actions {
  flex: none;
  display: flex;
  gap: 8px;
}
@media (min-width: 600px) {
  .top h1 {
    font-size: 26px;
  }
}
.logo {
  flex: none;
  width: 34px;
  height: 38px;
  display: grid;
  place-items: center;
  background: var(--grad-hot);
  color: var(--ink);
  font: 700 15px var(--font-display);
}
.back {
  font-size: 26px;
  text-decoration: none;
  color: var(--text);
}

.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  z-index: 20;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--column);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(13, 15, 31, 0.98) 70%, rgba(13, 15, 31, 0));
}
.tab {
  display: grid;
  justify-items: center;
  gap: 3px;
  min-height: 52px;
  padding: 6px 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  text-decoration: none;
}
.tab[aria-current='page'] {
  color: var(--text);
}
.tab[aria-current='page'] svg {
  color: var(--orange);
}
.tab svg {
  transition:
    transform 0.25s var(--spring),
    color 0.2s;
}
.tab:active svg {
  transform: scale(0.85);
}
@media (hover: hover) and (pointer: fine) {
  .tab:hover {
    color: var(--text);
  }
  .tab:hover svg {
    color: var(--orange-2);
  }
}
.tab-add {
  position: relative;
  justify-self: center;
  width: 62px;
  height: 68px;
  margin-top: -26px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--grad-hot);
  color: var(--ink);
}
.tab-add svg {
  position: relative;
  z-index: 1;
  width: 26px;
  height: 26px;
}
.tab-add::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
  transform: translateX(-130%);
  animation: shimmer 5s ease-in-out infinite;
}
@keyframes shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(5, 6, 14, 0.6);
  animation: fade-in 0.2s ease-out;
}
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 31;
  width: 100%;
  max-width: var(--column);
  max-height: 88dvh;
  overflow-y: auto;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #1a1e3e 0%, var(--deck) 40%);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-top: 1px solid var(--rim);
  padding: 10px var(--gutter) calc(24px + env(safe-area-inset-bottom));
  animation: sheet-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet:focus {
  outline: none;
}
.sheet-grip {
  /* a 5px bar with a 44px tall touch area around it */
  width: 88px;
  height: 25px;
  margin: -10px auto 2px;
  background: linear-gradient(var(--rim), var(--rim)) center / 44px 5px no-repeat;
  border-radius: 3px;
}
.sheet-title {
  font-size: 23px;
  margin-bottom: 12px;
}
@keyframes sheet-in {
  from {
    transform: translate(-50%, 100%);
  }
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  transform: translate(-50%, 20px);
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 600;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast i {
  flex: none;
  width: 10px;
  height: 11px;
  background: var(--orange);
}

/* Expired sign-in: above the screen, solid like every interactive surface */
.signin-banner {
  position: relative;
  z-index: 3;
  display: grid;
  gap: 10px;
  margin: 12px var(--gutter) 0;
  padding: 14px 16px;
  background: var(--deck-2);
  border: 1px solid var(--orange);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
}
.signin-banner p {
  margin: 0;
  font-size: 14px;
}


/* Tablets and laptops use more of the screen (docs/design.md §6): a wider column, cards and game
   rows in a grid; sheets and the swipe card keep a readable width. */
@media (min-width: 768px) {
  :root {
    --column: 1040px;
  }
  .cards {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .rows {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .sheet {
    max-width: 560px;
  }
  .hexboard {
    max-width: none;
  }
  .tabbar {
    max-width: 560px;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
  .swipe-screen,
  .intro {
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .form,
  .share {
    max-width: 640px;
  }
}

/* Dragging a sheet down to close it follows the finger; it springs back if let go early */
.sheet.is-dragging {
  transition: none;
  animation: none;
}
.sheet.is-settling {
  transition: transform 0.2s ease-out;
}
.sheet-grip {
  touch-action: none;
}
/* a heading that reacts to taps (Config: five taps show the developer section): no text selection,
   no double-tap zoom swallowing taps, and the whole title width as target */
.top h1.tappable {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  justify-self: stretch;
}

/* ---- src/app/theme/components.css ---- */
/* Feature components: docs/design.md §7 (collection card, game row, group heading, hexagon picker, forms) */

/* Mark gradients (docs/design.md §4), used by pickers, pills and group dots */
[data-mark='new'],
[data-tone='new'] {
  --tone: var(--grad-white);
  --tone-text: var(--ink);
}
[data-mark='must_have'],
[data-tone='must_have'],
[data-tone='hot'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='interested'],
[data-tone='interested'] {
  --tone: var(--grad-cool);
  --tone-text: var(--ink);
}
[data-mark='unsure'],
[data-tone='unsure'] {
  --tone: var(--grad-violet);
  --tone-text: #fff;
}
[data-mark='poop'],
[data-tone='poop'] {
  --tone: var(--grad-mud);
  --tone-text: #fff;
}
[data-mark='skip'],
[data-tone='skip'] {
  --tone: var(--grad-red);
  --tone-text: #fff;
}
[data-mark='bought'] {
  --tone: var(--grad-got);
  --tone-text: var(--ink);
}
/* hall groups (group by booth): halls in the hot gradient, "No booth yet" muted */
[data-mark='hall'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='none'] {
  --tone: linear-gradient(135deg, #6e74a0, #9aa0c8);
  --tone-text: var(--ink);
}

.section-title {
  font-size: 18px;
  margin: 20px 0 10px;
}
.section-title small {
  font: 600 13px var(--font-body);
  color: var(--muted);
  margin-left: 6px;
}
.hint {
  margin: 8px 2px 0;
  font-size: 13px;
  color: var(--muted);
}
.hint.error {
  color: #ff8a95;
}
.form {
  display: grid;
  gap: 14px;
}
.field.is-disabled {
  opacity: 0.6;
  box-shadow: none;
}
.field svg {
  flex: none;
  color: var(--muted);
}

/* Dropdown: field look with an orange hexagon as arrow */
.field.select {
  position: relative;
}
.field.select select {
  appearance: none;
  padding-right: 24px;
  cursor: pointer;
}
.field.select select option {
  background: var(--deck);
}
.field.select::after {
  content: '';
  position: absolute;
  right: 16px;
  width: 12px;
  height: 14px;
  clip-path: var(--hex);
  background: var(--grad-hot);
  pointer-events: none;
}

/* Switch ("Essen collection") */
.toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  cursor: pointer;
}
.toggle-text {
  flex: 1;
  font-weight: 600;
}
.toggle-text small {
  display: block;
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
}
.switch {
  appearance: none;
  flex: none;
  position: relative;
  width: 52px;
  height: 32px;
  margin: 6px 0;
  border-radius: var(--r-pill);
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  cursor: pointer;
  transition: background 0.2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  clip-path: var(--hex);
  background: var(--muted);
  transition: transform 0.25s var(--spring);
}
.switch:checked {
  background: var(--grad-hot);
  border-color: transparent;
}
.switch:checked::after {
  background: var(--ink);
  transform: translateX(20px);
}

/* Hexagon picker: honeycomb, every second hexagon offset down */
/* one straight, centred row of equal hexagons, whatever their labels and the phone's text scaling */
.picker {
  display: grid;
  grid-template-columns: repeat(var(--count, 4), minmax(0, 84px));
  justify-content: center;
  align-items: start;
  gap: 8px;
  margin: 12px 0 16px;
}
.picker-btn {
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 12px;
}
.picker-hex {
  display: block;
  aspect-ratio: 0.88;
  padding: 2px;
  background: var(--border-2);
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.picker-face {
  height: 100%;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 2px;
  padding: 0 4px;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  hyphens: auto;
  background: var(--raised);
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
}
.picker-emoji {
  font-style: normal;
  font-size: 22px;
}
.picker-btn[aria-pressed='true'] .picker-hex {
  background: var(--orange);
}
.picker-btn[aria-pressed='true'] .picker-face {
  background: var(--tone);
  color: var(--tone-text);
}
.picker-btn:is([data-tone='unsure'], [data-tone='poop'])[aria-pressed='true'] .picker-face {
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Collection cards with the hexagon cluster in the top-right corner */
.cards {
  display: grid;
  gap: var(--gap);
}
.card {
  position: relative;
  display: block;
  overflow: hidden;
  color: var(--text);
  text-decoration: none;
}
.card-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  padding-right: 64px;
}
.card-name {
  min-width: 0;
  overflow-wrap: anywhere;
}
.card-sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}
/* the six counts always in one row; the text shrinks on narrow phones instead of wrapping */
.counts {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  margin: 10px 0 0;
  font: 700 clamp(12px, 3.7vw, 15px) var(--font-display);
  white-space: nowrap;
}
.cluster {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 58px;
  height: 52px;
  animation: sway 6s ease-in-out infinite;
}
.cluster i {
  position: absolute;
  width: 22px;
  height: 25px;
  background: var(--grad-dusk);
  filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
}
.cluster i:nth-child(1) {
  top: 0;
  right: 0;
}
.cluster i:nth-child(2) {
  top: 0;
  right: 24px;
  opacity: 0.7;
}
.cluster i:nth-child(3) {
  top: 20px;
  right: 12px;
  opacity: 0.85;
}
@keyframes sway {
  0%,
  100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(4deg);
  }
}
.new-card {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  border: 1px dashed var(--orange);
  font-weight: 700;
  color: var(--orange-2);
}
.new-card .hex {
  width: 22px;
  height: 25px;
  background: var(--grad-hot);
}
@media (hover: hover) and (pointer: fine) {
  .new-card:hover {
    background: var(--grad-hot);
    color: var(--ink);
  }
}
.soon-card {
  margin-bottom: 16px;
}
.soon-card .card-title {
  padding-right: 0;
}

/* Collection screen: long names wrap to two lines instead of being cut after a few letters */
.top h1 {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  white-space: normal;
  overflow-wrap: anywhere;
}
.row-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.row-actions .btn {
  padding-inline: 10px;
}
.group {
  margin-bottom: 16px;
}
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 16px;
}
.group-title i {
  flex: none;
  width: 12px;
  height: 14px;
  background: var(--tone);
}
.group-count {
  color: var(--muted);
  font-weight: 700;
}
.fold {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  text-align: left;
}
.chev {
  margin-left: auto;
  font-size: 22px;
  transition: transform 0.2s;
}
.fold[aria-expanded='true'] .chev {
  transform: rotate(90deg);
}

.rows {
  display: grid;
  gap: var(--gap);
  margin: 0;
  padding: 0;
  list-style: none;
}
.rows[hidden] {
  display: none;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  text-align: left;
}
.row-meta {
  flex: 1;
  min-width: 0;
  display: grid;
}
.row-name {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-sub {
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row.skip .row-name {
  text-decoration: line-through;
  color: var(--muted);
}
.row.skip .cover {
  opacity: 0.5;
}
.row .pill,
.detail-head .pill {
  flex: none;
  background: var(--tone);
  color: var(--tone-text);
}
.mark-pill {
  padding: 4px 8px;
}

/* Hexagon covers */
.cover {
  position: relative;
  flex: none;
  display: block;
}
.cover-hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--grad-dusk);
}
.cover-hex img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-initials {
  font: 700 17px var(--font-display);
  color: var(--ink);
}
.cover-got {
  position: absolute;
  right: -4px;
  bottom: -2px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--grad-got);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
}

/* Game details sheet */
.detail-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
}
.detail-sub {
  margin: 0 0 6px;
  color: var(--muted);
}
.link-out {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 700;
}
.sheet-actions {
  display: grid;
  gap: var(--gap);
  margin-top: 12px;
}

/* "Group by" under the filter in a collection */
.group-by {
  margin-top: 12px;
}

/* Config → Developer: plain links, each a full-width 44px target */
.dev-links {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.dev-links a {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 600;
}

/* Collection tools (docs/design.md §6): on phones four equal icon buttons in one row
   (Add by list, Add by link, Filter, ⋯); from 600px the two text buttons, filter and ⋯ in the header */
.collection-tools {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
}
.collection-tools .tool {
  padding-inline: 6px;
}
.collection-tools .icon-btn {
  width: 100%;
  border-radius: var(--r-md);
}
.collection-tools .tool-text {
  /* only the icon on phones; the link keeps its name for screen readers */
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.phone-only {
  display: contents;
}
.wide-only {
  display: none;
}
@media (min-width: 600px) {
  .collection-tools {
    grid-template-columns: 1fr 1fr;
  }
  .collection-tools .tool svg {
    display: none;
  }
  .collection-tools .tool-text {
    position: static;
    width: auto;
    height: auto;
    overflow: visible;
    clip: auto;
  }
  .phone-only {
    display: none;
  }
  .wide-only {
    display: contents;
  }
}
/* Cancel and the main action side by side, the main action on the right */
.sheet-actions-row {
  grid-template-columns: 1fr 1fr;
}

/* Game info (docs/design.md §7 "Game info"): year beside the name, publisher, then three infos */
.row-year {
  font-weight: 500;
  color: var(--muted);
}
.row-info {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin-top: 2px;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  white-space: nowrap;
}
.row-info > span:first-child {
  flex: none;
}
.info-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}
.row-info .info-pills {
  flex-wrap: nowrap;
  overflow: hidden;
}
.info-pill {
  flex: none;
  padding: 1px 8px;
  border: 1px solid var(--border);
  background: var(--raised);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.info-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  margin: 0 0 12px;
}
.info-list > div {
  display: contents;
}
.info-list dt {
  color: var(--muted);
  font-size: 14px;
}
.info-list dd {
  margin: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* ---- src/app/theme/fair.css ---- */
/* At the fair (US4): filter button and panel, bought line, game description, facts, price question (docs/design.md §7) */

/* Filter: one full-width button, a panel below it */
.chip {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
}
.chip[aria-pressed='true'] {
  border-color: var(--orange);
  background: var(--raised);
  box-shadow: var(--glow);
}
.seg-title {
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.seg {
  /* one column per option, all in one row */
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.seg button {
  min-height: var(--tap);
  min-width: 0;
  padding: 0 4px;
  overflow-wrap: anywhere;
  border: 0;
  border-radius: 13px;
  background: none;
  color: var(--muted);
  font-weight: 700;
  font-size: 14px;
}
.seg button[aria-pressed='true'] {
  background: var(--grad-hot);
  color: var(--ink);
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  border-top: 1px solid var(--rim);
  cursor: pointer;
}
.filter-row:first-child {
  border-top: 0;
}
.filter-row input {
  flex: none;
  width: 20px;
  height: 20px;
  accent-color: var(--orange);
}
.filter-row span {
  flex: 1;
}
.filter-row small {
  font: 600 14px var(--font-display);
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .chip:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}
.chip:active,
.seg button:active {
  scale: 0.96;
}

/* "✅ 1 game bought, €52 spent" under the filter */
.bought-line {
  margin: 10px 2px 0;
  font-weight: 700;
  color: #7cf0c5;
}

/* Game details: description, facts, price question */
.detail-head .pill {
  margin-top: 4px;
}
.desc {
  margin: 4px 0 12px;
  font-size: 14px;
}
.muted {
  color: var(--muted);
}
.facts-box {
  margin-bottom: 8px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.facts-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0 12px;
}
.facts-by {
  font-size: 13px;
  font-weight: 700;
  color: var(--orange-2);
}
.link-btn {
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--orange-2);
  font-weight: 700;
  text-align: left;
}
.facts-add {
  margin-bottom: 8px;
}
.facts-form {
  margin-bottom: 12px;
}
.price-row {
  display: grid;
  grid-template-columns: 1fr 112px;
  gap: var(--gap);
}
.form-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.currency {
  font-weight: 700;
  color: var(--muted);
}

/* "Groups" with Select all / Select none on the same line */
.seg-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.seg-actions {
  display: flex;
  gap: 4px;
}
.seg-actions .link-btn {
  min-height: var(--tap);
  padding: 0 8px;
}

/* filter icon in the collection header; a dot while a filter or the hall grouping is active */
.filter-icon {
  position: relative;
}
.filter-icon.is-active::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 10px;
  height: 11px;
  clip-path: var(--hex);
  background: var(--grad-hot);
}
/* what is shown while narrowed; a tap opens "Filter and group" */
.filter-summary {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: var(--tap);
  margin-top: 10px;
  padding: 6px 14px;
  border: 1px solid var(--orange);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  text-align: left;
}

/* ---- src/app/theme/swipe.css ---- */
/* Swipe screen and list picker: docs/design.md §7 (swipe card), §9 (swipe motion) */

/* A card dragged or flung past the edge never scrolls the page sideways */
.swipe-screen {
  overflow-x: clip;
}

/* Source note: which list, whether facts are kept */
.swipe-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.swipe-note b {
  color: var(--text);
}
.swipe-note > .hex {
  flex: none;
  width: 14px;
  height: 16px;
  margin-top: 2px;
  background: var(--grad-dusk);
}

/* Card stack */
.deck {
  position: relative;
  height: min(400px, 54vh);
  min-height: 340px;
  margin: 0 0 14px;
}
.swipe-card {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  padding: 20px 18px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, #1f2350 0%, var(--deck) 70%);
  box-shadow: var(--lift);
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
}
.swipe-card > * {
  flex-shrink: 0;
}
.swipe-card.behind {
  transform: scale(0.95) translateY(14px);
  opacity: 0.6;
}
.swipe-card.top {
  touch-action: pan-y;
  cursor: grab;
  transition: transform 0.5s var(--spring);
}
.swipe-card.top.dragging {
  transition: none;
  cursor: grabbing;
}
.swipe-card.enter {
  animation: swipe-card-in 0.45s var(--spring);
}
@keyframes swipe-card-in {
  from {
    transform: scale(0.94) translateY(16px);
    opacity: 0.6;
  }
}
.swipe-card.leaving {
  pointer-events: none;
  animation: swipe-fling 0.38s cubic-bezier(0.5, 0, 0.75, 0) forwards;
}
@keyframes swipe-fling {
  from {
    transform: translateX(var(--from-x)) rotate(calc(var(--from-x) / 14px * 1deg));
  }
  to {
    transform: translate(calc(var(--dir) * 520px), -40px) rotate(calc(var(--dir) * 30deg));
    opacity: 0;
  }
}
.swipe-card .cover {
  margin-bottom: 12px;
}
.swipe-name {
  margin: 0;
  font: 700 24px/1.15 var(--font-display);
}
.swipe-year {
  margin: 2px 0 8px;
  color: var(--muted);
}
.swipe-desc {
  display: -webkit-box;
  margin: 0 0 10px;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
}
.swipe-wait {
  justify-content: center;
  gap: 12px;
  cursor: default;
}
.swipe-wait .hex {
  width: 56px;
  height: 64px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.swipe-wait p {
  margin: 0;
  color: var(--muted);
}

/* ADD / NOPE stamps grow while dragging; the leaving card shows its stamp in full */
.swipe-stamp {
  position: absolute;
  top: 20px;
  padding: 4px 10px;
  border: 2px solid;
  border-radius: 10px;
  font: 700 18px var(--font-display);
  opacity: 0;
  scale: 0.7;
}
.swipe-stamp.add {
  left: 16px;
  color: var(--teal);
  rotate: -12deg;
}
.swipe-stamp.nope {
  right: 16px;
  color: var(--danger);
  rotate: 12deg;
}
.leaving-right .swipe-stamp.add,
.leaving-left .swipe-stamp.nope {
  opacity: 1;
  scale: 1.2;
}

/* ✕ / ✓ hexagon buttons */
.swipe-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
}
.swipe-btn {
  display: grid;
  place-items: center;
  width: 72px;
  height: 80px;
  border: 0;
  clip-path: var(--hex);
  font: 700 28px var(--font-display);
  cursor: pointer;
}
.swipe-btn.no {
  background: var(--grad-red);
  color: #fff;
}
.swipe-btn.yes {
  background: var(--grad-cool);
  color: #04161a;
}
.swipe-btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.swipe-legend {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0 0;
  padding: 0 4px;
  color: var(--muted);
  font-size: 13px;
}

/* List picker */
.pick-list {
  display: grid;
  gap: var(--gap);
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
}
.pick {
  display: grid;
  gap: 4px;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck-2);
  box-shadow: var(--lift);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.pick:disabled {
  opacity: 0.45;
  cursor: default;
}
.pick-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-weight: 700;
}
.pick small {
  color: var(--muted);
  font-size: 13px;
}
@media (hover: hover) and (pointer: fine) {
  .pick:not(:disabled):hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .swipe-btn:not(:disabled):hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Reduced motion: no tilt, fling or pop-in; the card just changes */
@media (prefers-reduced-motion: reduce) {
  .swipe-card.leaving {
    display: none;
  }
}

/* "Add by list": the chosen list is clearly marked (orange edge, glow and a tick) */
.pick[aria-pressed='true'] {
  position: relative;
  border: 2px solid var(--orange);
  box-shadow: var(--lift), var(--glow);
  padding-right: 44px;
}
.pick[aria-pressed='true']::after {
  content: '✓';
  position: absolute;
  top: 50%;
  right: 12px;
  display: grid;
  place-items: center;
  width: 24px;
  height: 27px;
  transform: translateY(-50%);
  clip-path: var(--hex);
  background: var(--grad-hot);
  color: var(--ink);
  font-weight: 700;
}
.pick-list,
.pick-new,
.pick-empty {
  margin-top: 16px;
}
.pick-intro {
  margin: 0 0 14px;
}

/* All game info on the card (FR-010): compact, left-aligned; a long card scrolls up and down
   (pan-y), sideways stays the swipe */
.swipe-card.top {
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.swipe-card .info-list {
  width: 100%;
  margin: 4px 0 0;
  gap: 4px 12px;
  font-size: 14px;
  text-align: left;
}
.swipe-card .info-list dt {
  font-size: 13px;
}
.swipe-card .info-list dd {
  font-weight: 600;
}

/* ---- src/app/theme/lists.css ---- */
/* BGG lists: list cards, list rows with +, progress, list game sheet (docs/design.md §7) */

.example {
  color: var(--text);
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* Loading progress: pages loaded so far */
.progress {
  height: 6px;
  margin-top: 10px;
  border-radius: var(--r-pill);
  background: var(--rim);
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad-hot);
}
@media (prefers-reduced-motion: no-preference) {
  .progress span {
    transition: width 0.4s ease-out;
  }
}
.list-status {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--muted);
}
.list-status p {
  margin: 0;
}
.list-status.error {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  color: #ff8a95;
}

/* List rows: the row opens the game, the hexagon + next to it does the same */
.list-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.list-item .row {
  flex: 1;
  min-width: 0;
}
.in-mark {
  font-size: 12px;
  font-weight: 700;
  color: var(--teal);
}
.add-mini {
  flex: none;
  width: 48px;
  height: 54px;
  padding: 0;
  border: 0;
  background: none;
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.add-mini .hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  background: var(--grad-hot);
  color: var(--ink);
  font: 700 26px var(--font-display);
}

/* List game sheet */
.description {
  margin: 8px 0 12px;
  color: var(--muted);
  font-size: 14px;
}

/* Multi-choice list: a hexagon tick per collection; the ticks always show the current truth */
.picks {
  display: grid;
  gap: var(--gap);
}
.pick {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  cursor: pointer;
}
.pick:has(.pick-input:focus-visible) {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}
.pick-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.tick {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 32px;
  background: var(--border-2);
}
.tick::before {
  content: '';
  width: 24px;
  height: 28px;
  clip-path: var(--hex);
  background: var(--raised);
}
.pick-input:checked + .tick {
  background: var(--orange);
}
.pick-input:checked + .tick::before {
  background: var(--grad-hot);
}
.pick-input:checked + .tick::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ink);
  font-weight: 800;
}
.pick-text {
  flex: 1;
  min-width: 0;
  display: grid;
}
.pick-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.pick-text small {
  font-size: 13px;
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .pick:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}

/* ---- src/app/theme/interaction.css ---- */
/* Interaction states: docs/design.md §8. Nothing moves on hover; press squishes; focus is orange. */
:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}

.btn,
.icon-btn,
.card,
.row,
.tile {
  transition:
    background 0.2s,
    border-color 0.2s,
    box-shadow 0.25s,
    color 0.2s,
    scale 0.25s var(--spring);
}

@media (hover: hover) and (pointer: fine) {
  .card:not([aria-disabled='true']):hover,
  .row:hover,
  .tile:hover,
  .field:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .btn:not(:disabled):not(.btn-primary):not(.btn-bought):hover,
  .icon-btn:hover {
    background: var(--grad-hot);
    border-color: transparent;
    color: var(--ink);
  }
  .btn-danger:not(:disabled):hover {
    background: var(--grad-red);
    color: #fff;
  }
  .btn-primary:not(:disabled):hover,
  .btn-bought:not(:disabled):hover {
    box-shadow: var(--lift), 0 0 22px rgba(255, 176, 32, 0.55);
  }
  .hex-btn:hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Press: a short squish that springs back (touch and pointer) */
.card:active,
.row:active,
.tile:active {
  scale: 0.98;
  transition-duration: 0.08s;
}
.btn:not(:disabled):active,
.icon-btn:active {
  scale: 0.96;
  transition-duration: 0.08s;
}
.hex-btn {
  transition:
    scale 0.25s var(--spring),
    filter 0.2s;
}
.hex-btn:active {
  scale: 0.9;
  transition-duration: 0.08s;
}

/* Tap pulse: an orange hexagon expanding from the tap point */
.tap-pulse {
  position: fixed;
  z-index: 60;
  width: 56px;
  height: 64px;
  margin: -32px 0 0 -28px;
  clip-path: var(--hex);
  background: radial-gradient(circle, rgba(255, 176, 32, 0.55), rgba(255, 122, 26, 0) 70%);
  pointer-events: none;
  animation: tap-pulse 0.5s ease-out forwards;
}
@keyframes tap-pulse {
  from {
    transform: scale(0.3);
    opacity: 1;
  }
  to {
    transform: scale(1.6);
    opacity: 0;
  }
}

/* Reduced motion (docs/design.md §9): every animation and press squish off */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  .card:active,
  .row:active,
  .tile:active,
  .btn:active,
  .icon-btn:active,
  .hex-btn:active,
  .hex-btn:hover {
    scale: none;
  }
  .tap-pulse {
    display: none;
  }
}

/* ---- src/app/theme/share.css ---- */
/* Share & backup screen (specs/001-bgg-game-collection/design.md): group checkboxes, message preview */
.share-groups {

.check {

/* ---- src/app/theme/intro.css ---- */
/* Intro on first start (docs/design.md §12): three cards with floating hexagons, Skip and Next */
.intro {
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: var(--column);
  min-height: 100dvh;
  margin: 0 auto;
  padding: 24px 0 calc(24px + env(safe-area-inset-bottom));

.intro-track {

  user-select: none;
}
.intro-card {

}
.intro-card.from-next {

@keyframes intro-in {

/* decoration, not controls: no border, no lift (docs/design.md §2) */

/* ---- src/app/theme/celebrate.css ---- */
/* Celebrations and rolling counters: docs/design.md §9. Never in the way: no pointer events, short. */
.celebrate {
  position: fixed;
  inset: 0;
  z-index: 70;
  overflow: hidden;
  pointer-events: none;
}

/* Must Have and Bought: ~20 small hexagons flying out of the tapped button */
.burst {
  position: absolute;
  width: 0;
  height: 0;
}
.burst-hex {
  position: absolute;
  width: var(--size);
  height: calc(var(--size) * 1.15);
  margin: calc(var(--size) * -0.575) 0 0 calc(var(--size) * -0.5);
  clip-path: var(--hex);
  animation: burst 0.8s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
@keyframes burst {
  from {
    transform: translate(0, 0) scale(0.4) rotate(0deg);
    opacity: 1;
  }
  70% {
    opacity: 1;
  }
  to {
    transform: translate(var(--dx), var(--dy)) scale(1) rotate(120deg);
    opacity: 0;
  }
}

/* Bought: "GOT IT!" stamped into the centre of the screen */
.got-stamp {
  position: absolute;
  top: 50%;
  left: 50%;
  padding: 10px 22px;
  border: 3px solid var(--ink);
  border-radius: var(--r-md);
  background: var(--grad-got);
  box-shadow: var(--lift), 0 0 32px rgba(15, 185, 143, 0.55);
  color: var(--ink);
  font: 700 40px/1 var(--font-display);
  letter-spacing: 0.04em;
  white-space: nowrap;
  translate: -50% -50%;
  animation: got-stamp 1.05s var(--spring) forwards;
}
@keyframes got-stamp {
  from {
    transform: scale(2.2) rotate(-14deg);
    opacity: 0;
  }
  30% {
    transform: scale(1) rotate(-8deg);
    opacity: 1;
  }
  75% {
    transform: scale(1) rotate(-8deg);
    opacity: 1;
  }
  to {
    transform: scale(1.05) rotate(-8deg);
    opacity: 0;
  }
}

/* Counters: rolling digits drawn over the final value, then an amber flash */
.counter {
  position: relative;
  display: inline-block;
  border-radius: 6px;
}
.counter.flash {
  animation: counter-flash 0.65s ease-out;
}
.counter-final {
  color: transparent;
}
.counter-roll {
  position: absolute;
  inset: 0;
  text-align: center;
}
@keyframes counter-flash {
  from {
    color: var(--orange-2);
    text-shadow: 0 0 10px rgba(255, 176, 32, 0.7);
  }
  to {
    color: inherit;
    text-shadow: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .celebrate {
    display: none;
  }
}

<script>
const ICON = {
  collections: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 20 6.5v11L12 22l-8-4.5v-11z"/><path d="M12 22V12M20 6.5 12 12 4 6.5"/></svg>',
  lists: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  config: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  addList: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M18 14v6M15 17h6"/></svg>',
  link: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  filter: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>',
  share: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
}

const GAMES = {
  cascadia: { name: 'Cascadia', year: 2021, publisher: 'Flatout Games', info: '1–4 players · Randy Flynn', link: 'boardgamegeek.com/boardgame/295947/cascadia' },
}
const START = () => ({
  collections: [
    { id: 'essen', name: 'Essen 2026', games: [
      { name: 'Kalypso', year: 2026, publisher: 'Inside Up Games', info: '€60 · 1–4 players · Booth 3-R400', mark: 'new' },
      { name: 'Harmonies', year: 2024, publisher: 'Libellud', info: '€32 · 1–4 players · Booth 2-A101', mark: 'must_have' },
    ] },
    { id: 'home', name: 'Wishlist', games: [] },
    { id: 'family', name: 'Family evenings', games: [] },
  ],
  lastShare: 'essen',
})

let state, scenario
const $ = s => document.querySelector(s)
const root = $('#root')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

function toast(text) {
  const t = $('#toast')
  t.innerHTML = '<i class="hex" aria-hidden="true"></i>' + esc(text)
  t.classList.add('show')
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => t.classList.remove('show'), 2600)
}

const tabbar = active => `
  <nav class="tabbar" aria-label="Main">
    <a class="tab" ${active === 'collections' ? 'aria-current="page"' : ''}>${ICON.collections}<span>Collections</span></a>
    <a class="tab" ${active === 'lists' ? 'aria-current="page"' : ''}>${ICON.lists}<span>Lists</span></a>
    <a class="tab-add hex hex-btn" aria-label="Add">${ICON.plus}</a>
    <a class="tab">${ICON.search}<span>Search</span></a>
    <a class="tab" ${active === 'config' ? 'aria-current="page"' : ''}>${ICON.config}<span>Config</span></a>
  </nav>`

const initials = n => n.split(/\s+/).slice(0, 2).map(w => w[0]).join('')
const cover = (name, size = 56) =>
  `<span class="cover" style="width:${size}px;height:${Math.round(size * 1.12)}px" aria-hidden="true"><span class="cover-hex hex"><span class="cover-initials">${esc(initials(name))}</span></span></span>`

const row = g => `
  <button type="button" class="row${g.fresh ? ' proto-fresh' : ''}">

function collectionScreen(id) {
  const c = state.collections.find(x => x.id === id)
  const groups = [['new', 'Not yet marked'], ['must_have', 'Must Have']]
    .map(([key, label]) => [key, label, c.games.filter(g => g.mark === key)])
    .filter(([, , games]) => games.length > 0)
  return `
    <div class="app">
      <header class="top"><div class="top-title"><h1>${esc(c.name)}</h1></div></header>
      <main class="screen">

        </div>
        <hr class="separator" />
        ${groups.length === 0 ? `<div class="empty"><div class="hex"></div><h2>No games in ${esc(c.name)} yet</h2></div>` : ''}
        ${groups.map(([key, label, games]) => `
          <section class="group">
            <h2 class="group-title" data-mark="${key}"><i class="hex" aria-hidden="true"></i><span>${label}</span><b class="group-count">${games.length}</b></h2>
            <ul class="rows">${games.map(g => `<li>${row(g)}</li>`).join('')}</ul>
          </section>`).join('')}
      </main>
      ${tabbar('collections')}
    </div>`
}

function emptyAppScreen() {
  return `
    <div class="app">
      <header class="top"><span class="logo hex" aria-hidden="true">B</span><div class="top-title"><h1>Collections</h1></div></header>
      <main class="screen"><div class="empty"><div class="hex"></div><h2>No collections yet</h2><p>Create one to keep games for the fair.</p></div></main>
      ${tabbar('collections')}
    </div>`
}

/* ---------- outside the app: the BGG page and the phone's share menu ---------- */
function bggPage(kind) {
  const page = {
    game: { url: GAMES.cascadia.link, title: 'Cascadia', sub: 'Board game · 2021 · 1–4 players', body: 'Create the most harmonious ecosystem as you puzzle together habitats and wildlife.' },
    notgame: { url: 'boardgamegeek.com/blog/1/blogpost/171234/spiel-2026-news', title: 'SPIEL 2026: what to expect', sub: 'Blog post', body: 'A look at the halls, the dates and the first announcements…' },
    list: { url: 'boardgamegeek.com/geekpreview/93/spiel-essen-2026', title: 'SPIEL Essen 2026 Preview', sub: 'Preview · 1,370 items', body: 'All games announced for SPIEL Essen 2026, with booth and price.' },
  }[kind]
  root.innerHTML = `
    <div class="proto-browser">
      <div class="proto-urlbar"><span class="proto-lock">🔒</span><span class="proto-url">${esc(page.url)}</span><button type="button" class="proto-share" id="share" aria-label="Share">${ICON.share}</button></div>
      <div class="proto-page">
        <p class="proto-note">BoardGameGeek page in the browser (or the BGG app) — not part of board-a-licious</p>
        <div class="proto-img"></div>
        <h1>${esc(page.title)}</h1>
        <p class="proto-sub">${esc(page.sub)}</p>
        <p>${esc(page.body)}</p>
        <p class="proto-hint">Tap <b>Share</b> (top right) to send this page to an app.</p>
      </div>
    </div>`
  $('#share').onclick = () => shareMenu(kind, page)
}

function shareMenu(kind, page) {
  const apps = [['💬', 'Messages'], ['✉️', 'Gmail'], ['🟢', 'WhatsApp'], ['B', 'board-a-licious', true], ['📋', 'Copy']]
  const menu = document.createElement('div')
  menu.innerHTML = `
    <div class="proto-sharescrim"></div>
    <div class="proto-sharemenu" role="dialog" aria-label="Share">
      <div class="proto-sharehead"><b>${esc(page.title)}</b><span>${esc(page.url)}</span></div>
      <div class="proto-shareapps">
        ${apps.map(([icon, name, ours]) => `<button type="button" class="proto-app${ours ? ' ours' : ''}" ${ours ? 'id="ours"' : 'disabled'}><span class="proto-appicon${ours ? ' hex' : ''}">${icon}</span><span>${name}</span></button>`).join('')}
      </div>
      <p class="proto-note">Android share menu — board-a-licious appears here once it is on the home screen</p>
    </div>`
  root.appendChild(menu)
  menu.querySelector('.proto-sharescrim').onclick = () => menu.remove()
  $('#ours').onclick = () => {
    if (kind === 'list') return openList()
    if (kind === 'notgame') return openNotGame(page.url)
    openAddSheet()
  }
}

/* ---------- inside the app ---------- */
function sheet(title, inner) {
  return `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="sheet-title" class="sheet-title">${esc(title)}</h2>${inner}</div>`
}

function openAddSheet() {
  const g = GAMES.cascadia
  const offline = scenario === 'offline'
  if (state.collections.length === 0) return openCreateFirst()
  let chosen = state.lastShare
  const render = () => {
    const target = state.collections.find(c => c.id === chosen)
    const already = target.games.some(x => x.name === g.name)
    root.innerHTML = collectionScreen(state.lastShare) + sheet('Add game', `
      <form class="form" id="addform">
        <div class="proto-shared">
          ${cover(g.name, 64)}
          <div>
            <label class="label" for="name">Name</label>
            <div class="field"><input id="name" value="${esc(g.name)}" autocomplete="off" /></div>
            <small class="muted">Shared from BoardGameGeek</small>
          </div>
        </div>
        ${offline ? '<p class="hint proto-offline">You are offline: the game is added on this phone now; its cover and details follow once you are back online.</p>' : ''}
        <div>
          <label class="label" for="collection">Collection</label>
          <div class="field select">
            <select id="collection">
              ${state.collections.map(c => `<option value="${c.id}" ${c.id === chosen ? 'selected' : ''}>${esc(c.name)}${c.games.some(x => x.name === g.name) ? ' (already in it)' : c.id === state.lastShare ? ' (last used)' : ''}</option>`).join('')}
            </select>
          </div>
          <p class="hint" id="collection-hint"></p>
        </div>
        <div class="sheet-actions sheet-actions-row">
          <button type="button" class="btn" id="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="add">Add to collection</button>
        </div>
      </form>`)
    // only the hint and the button follow the choice; the sheet itself stays put
    const update = () => {
      const t = state.collections.find(c => c.id === chosen)
      const isIn = t.games.some(x => x.name === g.name)
      const hint = $('#collection-hint')
      hint.className = isIn ? 'hint error' : 'hint'
      hint.textContent = isIn ? `${g.name} is already in ${t.name}. Pick another collection.` : chosen === state.lastShare ? 'Preselected: the collection you last shared into.' : ''
      $('#add').disabled = isIn
    }
    $('#collection').onchange = e => { chosen = e.target.value; update() }
    update()
    $('#cancel').onclick = $('#scrim').onclick = () => { root.innerHTML = collectionScreen(state.lastShare) }
    $('#addform').onsubmit = e => {
      e.preventDefault()
      const target = state.collections.find(c => c.id === chosen)
      if (target.games.some(x => x.name === g.name)) return
      const name = $('#name').value.trim() || g.name
      target.games.forEach(x => (x.fresh = false))
      target.games.unshift({ ...g, name, mark: 'new', fresh: true, pending: offline })
      state.lastShare = chosen
      root.innerHTML = collectionScreen(chosen)
      toast(`Added ${name} to ${target.name}`)
    }
  }
  render()
}

function openCreateFirst() {
  const g = GAMES.cascadia
  root.innerHTML = emptyAppScreen() + sheet('Add game', `
    <form class="form" id="createform">
      <div class="proto-shared">${cover(g.name, 64)}<div><b>${esc(g.name)}</b><br /><small class="muted">Shared from BoardGameGeek</small></div></div>
      <p class="lead">A game goes into a collection, and you have none yet. Create one, and ${esc(g.name)} goes straight into it.</p>
      <div><label class="label" for="cname">Collection name</label><div class="field"><input id="cname" value="SPIEL 2026" autocomplete="off" /></div></div>
      <div class="sheet-actions sheet-actions-row">
        <button type="button" class="btn" id="cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Create and add</button>
      </div>
    </form>`)
  $('#cancel').onclick = $('#scrim').onclick = () => { root.innerHTML = emptyAppScreen() }
  $('#createform').onsubmit = e => {
    e.preventDefault()
    const name = $('#cname').value.trim() || 'SPIEL 2026'
    state.collections = [{ id: 'new', name, games: [{ ...g, mark: 'new', fresh: true }] }]
    state.lastShare = 'new'
    root.innerHTML = collectionScreen('new')
    toast(`Created ${name} and added ${g.name}`)
  }
}

function openNotGame(url) {
  root.innerHTML = collectionScreen(state.lastShare) + sheet('Not a BoardGameGeek game', `
    <p class="lead">The shared page is not a game on boardgamegeek.com, so there is nothing to add.</p>
    <p class="hint proto-url-hint">${esc(url)}</p>
    <div class="sheet-actions sheet-actions-row">
      <button type="button" class="btn" id="close">Close</button>
      <button type="button" class="btn btn-primary" id="bylink">Add game by link</button>
    </div>`)
  $('#close').onclick = $('#scrim').onclick = () => { root.innerHTML = collectionScreen(state.lastShare) }
  $('#bylink').onclick = () => { root.innerHTML = collectionScreen(state.lastShare); toast('Opens “Add game” with an empty link field') }
}

function openList() {
  const games = [['Kalypso', 'Inside Up Games', '€60 · 1–4 players · Booth 3-R400'], ['Cascadia', 'Kosmos', '€35 · 1–4 players · Booth 1-C110'], ['Harmonies', 'Libellud', '€32 · 1–4 players · Booth 2-A101']]
  root.innerHTML = `
    <div class="app">
      <header class="top"><a class="icon-btn back" aria-label="Back">‹</a><div class="top-title"><h1>SPIEL Essen 2026 Preview</h1></div></header>
      <main class="screen">
        <p class="lead">Loading 1 of 138 pages</p>
        <div class="progress" aria-hidden="true"><span style="width:4%"></span></div>
        <hr class="separator" />
        <ul class="rows">${games.map(([name, publisher, info]) => `<li class="list-item">${row({ name, publisher, info })}<button type="button" class="add-mini hex-btn" aria-label="Add ${name}"><span class="hex">+</span></button></li>`).join('')}</ul>
      </main>
      ${tabbar('lists')}
    </div>`
  toast('Loading SPIEL Essen 2026 Preview')
}

function hintScreen() {
  root.innerHTML = `
    <div class="app">
      <header class="top"><span class="logo hex" aria-hidden="true">B</span><div class="top-title"><h1>Config</h1></div></header>
      <main class="screen config">
        <section class="card proto-hintcard">
          <h2 class="card-title">📲 Share from BoardGameGeek</h2>
          <p>Add board-a-licious to your home screen, then share any game from the BGG app or website straight into a collection.</p>
          <p class="muted">In Chrome: menu ⋮ → <b>Add to Home screen</b>. Afterwards, open board-a-licious from its icon.</p>
        </section>
        <hr class="separator" />
        <h2 class="section-title">Sound</h2>
        <p class="muted">… (the rest of Config, unchanged)</p>
      </main>
      ${tabbar('config')}
    </div>`
}

function start() {
  clearTimeout(toast.timer)
  $('#toast').classList.remove('show')
  scenario = $('#scenario').value
  state = START()
  if (scenario === 'already') state.collections[0].games.unshift({ ...GAMES.cascadia, mark: 'new' })
  if (scenario === 'none') state.collections = []
  if (scenario === 'hint') return hintScreen()
  bggPage(scenario === 'notgame' ? 'notgame' : scenario === 'list' ? 'list' : 'game')
}
$('#scenario').onchange = start
$('#restart').onclick = start
start()
</script>

</body>
</html>
