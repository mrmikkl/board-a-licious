/* ---- src/app/theme/tokens.css ---- */
/* Design tokens: docs/design.md §3–§6, one-to-one */
:root {
  --ink: #0d0f1f;
  --deck: #151831;
  --deck-2: #1d2142;
  --rim: #2c3160;
  --border: #3a4078;
  --border-2: #4a5196;
  --raised: #232852;
  --text: #eceeff;
  --muted: #9aa0c8;
  --placeholder: #6e74a0;
  --orange: #ff7a1a;
  --orange-2: #ffb020;
  --indigo: #4c5bff;
  --teal: #14c8c8;
  --violet: #8b5cf6;
  --danger: #ff4d5e;
  --got: #0fb98f;

  --grad-hot: linear-gradient(135deg, #ff7a1a 0%, #ffb020 100%);
  --grad-cool: linear-gradient(135deg, #4c5bff 0%, #14c8c8 100%);
  --grad-violet: linear-gradient(135deg, #6d4ae0 0%, #a78bfa 100%);
  --grad-mud: linear-gradient(135deg, #7a6046 0%, #b0916e 100%);
  --grad-red: linear-gradient(135deg, #c2183a 0%, #ff4d5e 100%);
  --grad-got: linear-gradient(135deg, #0fb98f 0%, #7cf0c5 100%);
  --grad-dusk: linear-gradient(135deg, #8b5cf6 0%, #4c5bff 55%, #14c8c8 100%);
  --grad-white: linear-gradient(135deg, #ffffff 0%, #c9cdf0 100%);
  --grad-separator: linear-gradient(90deg, #ff7a1a 0%, #8b5cf6 100%);

  --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  --lift: 0 8px 22px rgba(3, 4, 12, 0.55), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  --glow: 0 0 0 1px var(--orange), 0 0 18px rgba(255, 122, 26, 0.45);

  --font-display: 'Chakra Petch', 'Avenir Next Condensed', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;
  --tap: 44px;
  --gutter: 16px;
  --column: 440px;
  --gap: 8px;

  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---- src/app/theme/base.css ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  font-weight: 700;
  margin: 0;
}
a {
  color: var(--orange-2);
}
.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Layout: the phone column (docs/design.md §6) */
.app {
  position: relative;
  max-width: var(--column);
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
.screen {
  position: relative;
  z-index: 1;
  padding: 0 var(--gutter);
}
.lead {
  color: var(--muted);
  margin: 0 0 16px;
  font-size: 14px;
}
.hex {
  clip-path: var(--hex);
}
.separator {
  height: 2px;
  border: 0;
  margin: 16px 0;
  background: var(--grad-separator);
  border-radius: 2px;
}

/* Surfaces */
.card {
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--lift);
  padding: 16px;
}
.field {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--deck);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  padding: 0 14px;
  min-height: 50px;
}
.field:focus-within {
  border-color: var(--orange);
}
.field input,
.field select {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 12px 0;
}
.field input::placeholder {
  color: var(--placeholder);
}
.label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  margin: 0 0 6px;
}

/* Buttons (docs/design.md §7): text on gradients follows the contrast rule of §3 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 10px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-2);
  background: var(--raised);
  font-weight: 700;
  box-shadow: var(--lift);
  text-decoration: none;
  color: var(--text);
}
.btn-block {
  width: 100%;
}
.btn-primary {
  background: var(--grad-hot);
  border-color: transparent;
  color: var(--ink);
}
.btn-bought {
  background: var(--grad-got);
  border-color: transparent;
  color: var(--ink);
}
.btn-danger {
  /* --danger itself reaches only 4.4:1 on the raised surface; text needs 4.5:1 (docs/design.md §3) */
  color: #ff6b78;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  font-size: 18px;
  line-height: 1;
}

/* Badges and pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
}

/* Empty state */
.empty {
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
  padding: 40px 8px;
}
.empty .hex {
  width: 72px;
  height: 82px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.empty h2 {
  font-size: 18px;
}
.empty p {
  margin: 0;
  color: var(--muted);
}
.empty .actions {
  display: grid;
  gap: var(--gap);
  width: 100%;
  margin-top: 8px;
}

/* ---- src/app/theme/shell.css ---- */
/* App shell: app bar, menu, screen heading, sheet, toast (docs/design.md §6, §7) */

/* App bar: its own sticky band on every screen; above the menu's scrim, so ☰ closes it again */
.appbar {
  position: sticky;
  top: 0;
  z-index: 28;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 2px var(--gutter);
  background: var(--grad-hot);
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(255, 122, 26, 0.25);
}
.appbar-logo {
  width: 34px;
  height: auto;
}
.appbar-name {
  grid-column: 2;
  text-align: center;
  font: 700 19px/1 var(--font-display);
  letter-spacing: 0.02em;
}
/* a 38px translucent circle inside a 44px touch area */
.menu-btn {
  grid-column: 3;
  justify-self: end;
  position: relative;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  cursor: pointer;
}
.menu-btn::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: rgba(13, 15, 31, 0.14);
  border: 1px solid rgba(13, 15, 31, 0.25);
  transition: background 0.2s;
}
.menu-btn svg {
  position: relative;
}
.menu-btn[aria-expanded='true']::before {
  background: rgba(13, 15, 31, 0.28);
}
.menu-btn:focus-visible {
  outline-color: var(--ink);
}
@media (hover: hover) and (pointer: fine) {
  .menu-btn:hover::before {
    background: rgba(13, 15, 31, 0.24);
  }
}

/* Menu: a solid panel just below the app bar at the right; between the action bar and sheets */
.menu-scrim {
  position: fixed;
  inset: 0;
  z-index: 26;
  background: rgba(5, 6, 14, 0.5);
  animation: fade-in 0.18s ease-out;
}
.menu {
  position: fixed;
  z-index: 27;
  right: max(var(--gutter), calc(50% - var(--column) / 2 + var(--gutter)));
  width: min(260px, calc(100% - 2 * var(--gutter)));
  margin-top: 8px;
  padding: 8px;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
  transform-origin: top right;
  animation: menu-in 0.18s ease-out;
}
.menu ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.menu a {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 12px;
  border-radius: 12px;
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.menu a svg {
  color: var(--muted);
}
.menu a[aria-current='page'] {
  background: var(--raised);
}
.menu a[aria-current='page'] svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .menu a:hover {
    background: var(--raised);
  }
}
@keyframes menu-in {
  from {
    opacity: 0;
    transform: scale(0.94);
  }
}
@media (prefers-reduced-motion: reduce) {
  .menu,
  .menu-scrim {
    animation: none;
  }
}

/* Screen heading: back (only where it belongs), title, an element right after it */
.top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px var(--gutter) 10px;
}
.top-title {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 4px;
  justify-items: start;
}
.top h1 {
  font-size: 22px;
  line-height: 1.15;
  /* at most two lines, then "…" */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.top-actions {
  flex: none;
  display: flex;
  gap: 8px;
}
@media (min-width: 600px) {
  .top h1 {
    font-size: 26px;
  }
}
.back {
  font-size: 26px;
  text-decoration: none;
  color: var(--text);
}

/* the light passing over the main button every 5 s */
@keyframes shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(5, 6, 14, 0.6);
  animation: fade-in 0.2s ease-out;
}
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 31;
  width: 100%;
  max-width: var(--column);
  max-height: 88dvh;
  overflow-y: auto;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #1a1e3e 0%, var(--deck) 40%);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-top: 1px solid var(--rim);
  padding: 10px var(--gutter) calc(24px + env(safe-area-inset-bottom));
  animation: sheet-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet:focus {
  outline: none;
}
.sheet-grip {
  /* a 5px bar with a 44px tall touch area around it */
  width: 88px;
  height: 25px;
  margin: -10px auto 2px;
  background: linear-gradient(var(--rim), var(--rim)) center / 44px 5px no-repeat;
  border-radius: 3px;
}
.sheet-title {
  font-size: 23px;
  margin-bottom: 12px;
}
@keyframes sheet-in {
  from {
    transform: translate(-50%, 100%);
  }
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  transform: translate(-50%, 20px);
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
  background: var(--deck-2);
  border: 1px solid var(--rim);
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 600;
}
/* above the action bar, near the bottom where there is none (research R7) */
body:has(.actionbar) .toast {
  bottom: calc(100px + env(safe-area-inset-bottom));
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast i {
  flex: none;
  width: 10px;
  height: 11px;
  background: var(--orange);
}

/* Expired sign-in: above the screen, solid like every interactive surface */
.signin-banner {
  position: relative;
  z-index: 3;
  display: grid;
  gap: 10px;
  margin: 12px var(--gutter) 0;
  padding: 14px 16px;
  background: var(--deck-2);
  border: 1px solid var(--orange);
  border-radius: var(--r-md);
  box-shadow: var(--lift);
}
.signin-banner p {
  margin: 0;
  font-size: 14px;
}


/* Tablets and laptops use more of the screen (docs/design.md §6): a wider column, cards and game
   rows in a grid; sheets and the swipe card keep a readable width. */
@media (min-width: 768px) {
  :root {
    --column: 1040px;
  }
  .cards {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .rows {
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .sheet {
    max-width: 560px;
  }
  .hexboard {
    max-width: none;
  }
  .swipe-screen,
  .intro {
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .form,
  .share {
    max-width: 640px;
  }
}

/* Dragging a sheet down to close it follows the finger; it springs back if let go early */
.sheet.is-dragging {
  transition: none;
  animation: none;
}
.sheet.is-settling {
  transition: transform 0.2s ease-out;
}
.sheet-grip {
  touch-action: none;
}
/* a heading that reacts to taps (Config: five taps show the developer section): no text selection,
   no double-tap zoom swallowing taps, and the whole title width as target */
.top h1.tappable {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  justify-self: stretch;
}

/* the page keeps room at the bottom only while an action bar is shown (research R7) */
.app:not(:has(.actionbar)) {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

/* Collection heading (docs/design.md v2.0.0 "Collection screen", "Ticker"): the name runs as a
   ticker before the pencil instead of wrapping to two lines; the pencil keeps its place after it */
.top h1.ticker {
  flex: 0 1 auto;
  display: block;
  -webkit-line-clamp: unset;
  overflow-wrap: normal;
}
.edit-btn svg {
  width: 18px;
  height: 18px;
}

/* ---- src/app/theme/actionbar.css ---- */
/* Action bar and main button (docs/design.md v2.0.0 "Action bar", "Main button"); F003 tasks T016 */

/* Dock position, padding and safe area of the old tab bar (research R7) */
.actionbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  z-index: 20;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--column);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(13, 15, 31, 0.98) 70%, rgba(13, 15, 31, 0));
}
.actionbar-left,
.actionbar-right,
.actionbar-outer {
  display: contents;
}
.actionbar-left > .act {
  grid-column: 2;
  grid-row: 1;
}
.actionbar-right > .act {
  grid-column: 4;
  grid-row: 1;
}
/* F004: the fourth action at the outer right (docs/design.md "Action bar") */
.actionbar-outer > .act {
  grid-column: 5;
  grid-row: 1;
}

.act {
  display: grid;
  justify-items: center;
  gap: 3px;
  min-height: 52px;
  padding: 6px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font: 600 11px var(--font-body);
  text-decoration: none;
  cursor: pointer;
}
.act svg {
  transition:
    transform 0.25s var(--spring),
    color 0.2s;
}
.act:active svg {
  transform: scale(0.85);
}
.act.is-active svg {
  color: var(--orange);
}
@media (hover: hover) and (pointer: fine) {
  .act:hover {
    color: var(--text);
  }
  .act:hover svg {
    color: var(--orange-2);
  }
}

.main-btn {
  position: relative;
  grid-column: 3;
  grid-row: 1;
  justify-self: center;
  width: 62px;
  height: 68px;
  margin-top: -26px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 0;
  background: var(--grad-hot);
  color: var(--ink);
  cursor: pointer;
}
.main-btn svg {
  position: relative;
  z-index: 1;
  width: 26px;
  height: 26px;
}
/* a light shimmer passes over it every 5 s */
.main-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
  transform: translateX(-130%);
  animation: main-shimmer 5s ease-in-out infinite;
}
@keyframes main-shimmer {
  0%,
  70% {
    transform: translateX(-130%);
  }
  100% {
    transform: translateX(130%);
  }
}
/* not available yet: raised grey, no shimmer, no hover or press */
.main-btn.hex-btn:disabled {
  background: var(--raised);
  color: var(--placeholder);
  cursor: not-allowed;
  scale: none;
  filter: none;
}
.main-btn:disabled::after {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  .main-btn::after {
    display: none;
  }
}

@media (min-width: 768px) {
  .actionbar {
    max-width: 560px;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
}

/* ---- src/app/theme/components.css ---- */
/* Feature components: docs/design.md §7 (collection card, game row, group heading, hexagon picker, forms) */

/* Mark gradients (docs/design.md §4), used by pickers, pills and group dots */
[data-mark='new'],
[data-tone='new'] {
  --tone: var(--grad-white);
  --tone-text: var(--ink);
}
[data-mark='must_have'],
[data-tone='must_have'],
[data-tone='hot'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='interested'],
[data-tone='interested'] {
  --tone: var(--grad-cool);
  --tone-text: var(--ink);
}
[data-mark='unsure'],
[data-tone='unsure'] {
  --tone: var(--grad-violet);
  --tone-text: #fff;
}
[data-mark='poop'],
[data-tone='poop'] {
  --tone: var(--grad-mud);
  --tone-text: #fff;
}
[data-mark='skip'],
[data-tone='skip'] {
  --tone: var(--grad-red);
  --tone-text: #fff;
}
[data-mark='bought'] {
  --tone: var(--grad-got);
  --tone-text: var(--ink);
}
/* hall groups (group by booth): halls in the hot gradient, "No booth yet" muted */
[data-mark='hall'] {
  --tone: var(--grad-hot);
  --tone-text: var(--ink);
}
[data-mark='none'] {
  --tone: linear-gradient(135deg, #6e74a0, #9aa0c8);
  --tone-text: var(--ink);
}

.section-title {
  font-size: 18px;
  margin: 20px 0 10px;
}
.section-title small {
  font: 600 13px var(--font-body);
  color: var(--muted);
  margin-left: 6px;
}
.hint {
  margin: 8px 2px 0;
  font-size: 13px;
  color: var(--muted);
}
.hint.error {
  color: #ff8a95;
}
.form {
  display: grid;
  gap: 14px;
}
.field.is-disabled {
  opacity: 0.6;
  box-shadow: none;
}
.field svg {
  flex: none;
  color: var(--muted);
}

/* Dropdown: field look with an orange hexagon as arrow */
.field.select {
  position: relative;
}
.field.select select {
  appearance: none;
  padding-right: 24px;
  cursor: pointer;
}
.field.select select option {
  background: var(--deck);
}
.field.select::after {
  content: '';
  position: absolute;
  right: 16px;
  width: 12px;
  height: 14px;
  clip-path: var(--hex);
  background: var(--grad-hot);
  pointer-events: none;
}

/* Switch ("Essen collection") */
.toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  cursor: pointer;
}
.toggle-text {
  flex: 1;
  font-weight: 600;
}
.toggle-text small {
  display: block;
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
}
.switch {
  appearance: none;
  flex: none;
  position: relative;
  width: 52px;
  height: 32px;
  margin: 6px 0;
  border-radius: var(--r-pill);
  border: 1px solid var(--border-2);
  background: var(--raised);
  box-shadow: var(--lift);
  cursor: pointer;
  transition: background 0.2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  clip-path: var(--hex);
  background: var(--muted);
  transition: transform 0.25s var(--spring);
}
.switch:checked {
  background: var(--grad-hot);
  border-color: transparent;
}
.switch:checked::after {
  background: var(--ink);
  transform: translateX(20px);
}

/* Hexagon picker: honeycomb, every second hexagon offset down */
/* one straight, centred row of equal hexagons, whatever their labels and the phone's text scaling */
.picker {
  display: grid;
  grid-template-columns: repeat(var(--count, 4), minmax(0, 84px));
  justify-content: center;
  align-items: start;
  gap: 8px;
  margin: 12px 0 16px;
}
.picker-btn {
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 12px;
}
.picker-hex {
  display: block;
  aspect-ratio: 0.88;
  padding: 2px;
  background: var(--border-2);
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.picker-face {
  height: 100%;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 2px;
  padding: 0 4px;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  hyphens: auto;
  background: var(--raised);
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
}
.picker-emoji {
  font-style: normal;
  font-size: 22px;
}
.picker-btn[aria-pressed='true'] .picker-hex {
  background: var(--orange);
}
.picker-btn[aria-pressed='true'] .picker-face {
  background: var(--tone);
  color: var(--tone-text);
}
.picker-btn:is([data-tone='unsure'], [data-tone='poop'])[aria-pressed='true'] .picker-face {
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Collection cards with the hexagon cluster in the top-right corner */
.cards {
  display: grid;
  gap: var(--gap);
}
/* off-screen cards skip layout, paint and their cluster animation (long lists stay fast) */
.cards > .card {
  content-visibility: auto;
  contain-intrinsic-size: auto 96px;
}
.card {
  position: relative;
  display: block;
  overflow: hidden;
  color: var(--text);
  text-decoration: none;
}
.card-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  padding-right: 64px;
}
.card-name {
  min-width: 0;
  overflow-wrap: anywhere;
}
.card-sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}
/* the six counts always in one row; the text shrinks on narrow phones instead of wrapping */
.counts {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  margin: 10px 0 0;
  font: 700 clamp(12px, 3.7vw, 15px) var(--font-display);
  white-space: nowrap;
}
.cluster {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 58px;
  height: 52px;
  animation: sway 6s ease-in-out infinite;
}
.cluster i {
  position: absolute;
  width: 22px;
  height: 25px;
  background: var(--grad-dusk);
  filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
}
.cluster i:nth-child(1) {
  top: 0;
  right: 0;
}
.cluster i:nth-child(2) {
  top: 0;
  right: 24px;
  opacity: 0.7;
}
.cluster i:nth-child(3) {
  top: 20px;
  right: 12px;
  opacity: 0.85;
}
@keyframes sway {
  0%,
  100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(4deg);
  }
}
.soon-card {
  margin-bottom: 16px;
}
.soon-card .card-title {
  padding-right: 0;
}
/* F002 Share hint at the top of Config */
.hint-card .card-title {
  padding-right: 0;
}

.row-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.row-actions .btn {
  padding-inline: 10px;
}
.group {
  margin-bottom: 16px;
}
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 16px;
}
.group-title i {
  flex: none;
  width: 12px;
  height: 14px;
  background: var(--tone);
}
.group-count {
  color: var(--muted);
  font-weight: 700;
}
.fold {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  text-align: left;
}
.chev {
  margin-left: auto;
  font-size: 22px;
  transition: transform 0.2s;
}
.fold[aria-expanded='true'] .chev {
  transform: rotate(90deg);
}

.rows {
  display: grid;
  gap: var(--gap);
  margin: 0;
  padding: 0;
  list-style: none;
}
.rows[hidden] {
  display: none;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  text-align: left;
}
.row-meta {
  flex: 1;
  min-width: 0;
  display: grid;
}
.row-name {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-sub {
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* F002 "Just added": the hover highlight, kept until the user scrolls or taps (not an animation) */
.row.is-just-added {
  border-color: var(--orange);
  box-shadow: var(--lift), var(--glow);
}
.row.skip .row-name {
  text-decoration: line-through;
  color: var(--muted);
}
.row.skip .cover {
  opacity: 0.5;
}
.row .pill,
.detail-head .pill {
  flex: none;
  background: var(--tone);
  color: var(--tone-text);
}
.mark-pill {
  padding: 4px 8px;
}

/* Hexagon covers */
.cover {
  position: relative;
  flex: none;
  display: block;
}
.cover-hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--grad-dusk);
}
.cover-hex img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-initials {
  font: 700 17px var(--font-display);
  color: var(--ink);
}
.cover-got {
  position: absolute;
  right: -4px;
  bottom: -2px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--grad-got);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
}

/* Game details sheet */
.detail-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
}
.detail-sub {
  margin: 0 0 6px;
  color: var(--muted);
}
.link-out {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 700;
}
.sheet-actions {
  display: grid;
  gap: var(--gap);
  margin-top: 12px;
}

/* "Group by" under the filter in a collection */
.group-by {
  margin-top: 12px;
}

/* Config → Developer: plain links, each a full-width 44px target */
.dev-links {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.dev-links a {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  font-weight: 600;
}

/* Cancel and the main action side by side, the main action on the right */
.sheet-actions-row {
  grid-template-columns: 1fr 1fr;
}

/* Game info (docs/design.md §7 "Game info"): year beside the name, publisher, then three infos */
.row-year {
  font-weight: 500;
  color: var(--muted);
}
.row-info {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin-top: 2px;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  white-space: nowrap;
}
.row-info > span:first-child {
  flex: none;
}
.info-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}
.row-info .info-pills {
  flex-wrap: nowrap;
  overflow: hidden;
}
.info-pill {
  flex: none;
  padding: 1px 8px;
  border: 1px solid var(--border);
  background: var(--raised);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.info-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  margin: 0 0 12px;
}
.info-list > div {
  display: contents;
}
.info-list dt {
  color: var(--muted);
  font-size: 14px;
}
.info-list dd {
  margin: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* F003: the SPIEL preview suggestion above a BGG list link field */
.list-suggestion {
  margin-bottom: 10px;
}

/* ---- src/app/theme/fair.css ---- */
/* At the fair (US4): filter button and panel, bought line, game description, facts, price question (docs/design.md §7) */

/* Filter: one full-width button, a panel below it */
.chip {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
}
.chip[aria-pressed='true'] {
  border-color: var(--orange);
  background: var(--raised);
  box-shadow: var(--glow);
}
.seg-title {
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.seg {
  /* one column per option, all in one row */
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.seg button {
  min-height: var(--tap);
  min-width: 0;
  padding: 0 4px;
  overflow-wrap: anywhere;
  border: 0;
  border-radius: 13px;
  background: none;
  color: var(--muted);
  font-weight: 700;
  font-size: 14px;
}
.seg button[aria-pressed='true'] {
  background: var(--grad-hot);
  color: var(--ink);
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  border-top: 1px solid var(--rim);
  cursor: pointer;
}
.filter-row:first-child {
  border-top: 0;
}
.filter-row input {
  flex: none;
  width: 20px;
  height: 20px;
  accent-color: var(--orange);
}
.filter-row span {
  flex: 1;
}
.filter-row small {
  font: 600 14px var(--font-display);
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .chip:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}
.chip:active,
.seg button:active {
  scale: 0.96;
}

/* "✅ 1 game bought, €52 spent" under the filter */
.bought-line {
  margin: 10px 2px 0;
  font-weight: 700;
  color: #7cf0c5;
}

/* Game details: description, facts, price question */
.detail-head .pill {
  margin-top: 4px;
}
.desc {
  margin: 4px 0 12px;
  font-size: 14px;
}
.muted {
  color: var(--muted);
}
.facts-box {
  margin-bottom: 8px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
}
.facts-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0 12px;
}
.facts-by {
  font-size: 13px;
  font-weight: 700;
  color: var(--orange-2);
}
.link-btn {
  min-height: var(--tap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--orange-2);
  font-weight: 700;
  text-align: left;
}
.facts-add {
  margin-bottom: 8px;
}
.facts-form {
  margin-bottom: 12px;
}
.price-row {
  display: grid;
  grid-template-columns: 1fr 112px;
  gap: var(--gap);
}
.form-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.currency {
  font-weight: 700;
  color: var(--muted);
}

/* "Groups" with Select all / Select none on the same line */
.seg-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.seg-actions {
  display: flex;
  gap: 4px;
}
.seg-actions .link-btn {
  min-height: var(--tap);
  padding: 0 8px;
}

/* filter icon in the collection header; a dot while a filter or the hall grouping is active */
.filter-icon {
  position: relative;
}
.filter-icon.is-active::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 10px;
  height: 11px;
  clip-path: var(--hex);
  background: var(--grad-hot);
}
/* what is shown while narrowed; a tap opens "Filter and group" */
.filter-summary {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: var(--tap);
  margin-top: 10px;
  padding: 6px 14px;
  border: 1px solid var(--orange);
  border-radius: var(--r-pill);
  background: var(--deck);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  text-align: left;
}

/* ---- src/app/theme/lists.css ---- */
/* BGG lists: list cards, list rows with +, progress, list game sheet (docs/design.md §7) */

.example {
  color: var(--text);
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* Loading progress: pages loaded so far */
.progress {
  height: 6px;
  margin-top: 10px;
  border-radius: var(--r-pill);
  background: var(--rim);
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad-hot);
}
@media (prefers-reduced-motion: no-preference) {
  .progress span {
    transition: width 0.4s ease-out;
  }
}
.list-status {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--muted);
}
.list-status p {
  margin: 0;
}
.list-status.error {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  color: #ff8a95;
}

/* List rows: the row opens the game, the hexagon + next to it does the same */
.list-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.list-item .row {
  flex: 1;
  min-width: 0;
}
.in-mark {
  font-size: 12px;
  font-weight: 700;
  color: var(--teal);
}
.add-mini {
  flex: none;
  width: 48px;
  height: 54px;
  padding: 0;
  border: 0;
  background: none;
  filter: drop-shadow(0 6px 10px rgba(3, 4, 12, 0.55));
}
.add-mini .hex {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  background: var(--grad-hot);
  color: var(--ink);
  font: 700 26px var(--font-display);
}

/* List game sheet */
.description {
  margin: 8px 0 12px;
  color: var(--muted);
  font-size: 14px;
}

/* Multi-choice list: a hexagon tick per collection; the ticks always show the current truth */
.picks {
  display: grid;
  gap: var(--gap);
}
.pick {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck);
  box-shadow: var(--lift);
  cursor: pointer;
}
.pick:has(.pick-input:focus-visible) {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}
.pick-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.tick {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 32px;
  background: var(--border-2);
}
.tick::before {
  content: '';
  width: 24px;
  height: 28px;
  clip-path: var(--hex);
  background: var(--raised);
}
.pick-input:checked + .tick {
  background: var(--orange);
}
.pick-input:checked + .tick::before {
  background: var(--grad-hot);
}
.pick-input:checked + .tick::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ink);
  font-weight: 800;
}
.pick-text {
  flex: 1;
  min-width: 0;
  display: grid;
}
.pick-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.pick-text small {
  font-size: 13px;
  color: var(--muted);
}
@media (hover: hover) and (pointer: fine) {
  .pick:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
}

/* ---- src/app/theme/interaction.css ---- */
/* Interaction states: docs/design.md §8. Nothing moves on hover; press squishes; focus is orange. */
:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}

.btn,
.icon-btn,
.card,
.row,
.tile {
  transition:
    background 0.2s,
    border-color 0.2s,
    box-shadow 0.25s,
    color 0.2s,
    scale 0.25s var(--spring);
}

@media (hover: hover) and (pointer: fine) {
  .card:not([aria-disabled='true']):hover,
  .row:hover,
  .tile:hover,
  .field:hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .btn:not(:disabled):not(.btn-primary):not(.btn-bought):hover,
  .icon-btn:hover {
    background: var(--grad-hot);
    border-color: transparent;
    color: var(--ink);
  }
  .btn-danger:not(:disabled):hover {
    background: var(--grad-red);
    color: #fff;
  }
  .btn-primary:not(:disabled):hover,
  .btn-bought:not(:disabled):hover {
    box-shadow: var(--lift), 0 0 22px rgba(255, 176, 32, 0.55);
  }
  .hex-btn:hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Press: a short squish that springs back (touch and pointer) */
.card:active,
.row:active,
.tile:active {
  scale: 0.98;
  transition-duration: 0.08s;
}
.btn:not(:disabled):active,
.icon-btn:active {
  scale: 0.96;
  transition-duration: 0.08s;
}
.hex-btn {
  transition:
    scale 0.25s var(--spring),
    filter 0.2s;
}
.hex-btn:active {
  scale: 0.9;
  transition-duration: 0.08s;
}

/* Tap pulse: an orange hexagon expanding from the tap point */
.tap-pulse {
  position: fixed;
  z-index: 60;
  width: 56px;
  height: 64px;
  margin: -32px 0 0 -28px;
  clip-path: var(--hex);
  background: radial-gradient(circle, rgba(255, 176, 32, 0.55), rgba(255, 122, 26, 0) 70%);
  pointer-events: none;
  animation: tap-pulse 0.5s ease-out forwards;
}
@keyframes tap-pulse {
  from {
    transform: scale(0.3);
    opacity: 1;
  }
  to {
    transform: scale(1.6);
    opacity: 0;
  }
}

/* Reduced motion (docs/design.md §9): every animation and press squish off */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  .card:active,
  .row:active,
  .tile:active,
  .btn:active,
  .icon-btn:active,
  .hex-btn:active,
  .hex-btn:hover {
    scale: none;
  }
  .tap-pulse {
    display: none;
  }
}

/* ---- src/app/theme/ticker.css ---- */
/* Ticker for headings too long for their row (docs/design.md v2.0.0 "Ticker"); F003 tasks T024 */
.ticker {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  overflow-wrap: normal;
}
.ticker > span {
  display: inline-block;
}
/* soft fades at both edges; the left padding keeps the first letter clear of the fade */
.ticker.is-long {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 24px), transparent);
  padding-left: 10px;
  margin-left: -10px;
}
.ticker.is-long > span {
  animation: ticker var(--ticker-time, 8s) linear infinite;
}
@keyframes ticker {
  /* read the start */
  0%,
  18% {
    transform: translateX(0);
  }
  /* the end is visible, then start over */
  82%,
  100% {
    transform: translateX(calc(-1 * var(--ticker-shift)));
  }
}
/* reduced motion: the text stands still and ends in "…" */
@media (prefers-reduced-motion: reduce) {
  .ticker {
    text-overflow: ellipsis;
  }
  .ticker.is-long {
    -webkit-mask-image: none;
    mask-image: none;
    padding-left: 0;
    margin-left: 0;
  }
  .ticker.is-long > span {
    display: inline;
    animation: none;
  }
}

/* ---- src/app/theme/swipe.css ---- */
/* Swipe screen and list picker: docs/design.md §7 (swipe card), §9 (swipe motion) */

/* A card dragged or flung past the edge never scrolls the page sideways */
.swipe-screen {
  overflow-x: clip;
}

/* Source note: which list, whether facts are kept */
.swipe-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.swipe-note b {
  color: var(--text);
}
.swipe-note > .hex {
  flex: none;
  width: 14px;
  height: 16px;
  margin-top: 2px;
  background: var(--grad-dusk);
}

/* Card stack */
.deck {
  position: relative;
  height: min(400px, 54vh);
  min-height: 340px;
  margin: 0 0 14px;
}
.swipe-card {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  padding: 20px 18px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, #1f2350 0%, var(--deck) 70%);
  box-shadow: var(--lift);
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
}
.swipe-card > * {
  flex-shrink: 0;
}
.swipe-card.behind {
  transform: scale(0.95) translateY(14px);
  opacity: 0.6;
}
.swipe-card.top {
  touch-action: pan-y;
  cursor: grab;
  transition: transform 0.5s var(--spring);
}
.swipe-card.top.dragging {
  transition: none;
  cursor: grabbing;
}
.swipe-card.enter {
  animation: swipe-card-in 0.45s var(--spring);
}
@keyframes swipe-card-in {
  from {
    transform: scale(0.94) translateY(16px);
    opacity: 0.6;
  }
}
.swipe-card.leaving {
  pointer-events: none;
  animation: swipe-fling 0.38s cubic-bezier(0.5, 0, 0.75, 0) forwards;
}
@keyframes swipe-fling {
  from {
    transform: translateX(var(--from-x)) rotate(calc(var(--from-x) / 14px * 1deg));
  }
  to {
    transform: translate(calc(var(--dir) * 520px), -40px) rotate(calc(var(--dir) * 30deg));
    opacity: 0;
  }
}
.swipe-card .cover {
  margin-bottom: 12px;
}
.swipe-name {
  margin: 0;
  font: 700 24px/1.15 var(--font-display);
}
.swipe-year {
  margin: 2px 0 8px;
  color: var(--muted);
}
.swipe-desc {
  display: -webkit-box;
  margin: 0 0 10px;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
}
.swipe-wait {
  justify-content: center;
  gap: 12px;
  cursor: default;
}
.swipe-wait .hex {
  width: 56px;
  height: 64px;
  background: var(--grad-dusk);
  opacity: 0.85;
}
.swipe-wait p {
  margin: 0;
  color: var(--muted);
}

/* ADD / NOPE stamps grow while dragging; the leaving card shows its stamp in full */
.swipe-stamp {
  position: absolute;
  top: 20px;
  padding: 4px 10px;
  border: 2px solid;
  border-radius: 10px;
  font: 700 18px var(--font-display);
  opacity: 0;
  scale: 0.7;
}
.swipe-stamp.add {
  left: 16px;
  color: var(--teal);
  rotate: -12deg;
}
.swipe-stamp.nope {
  right: 16px;
  color: var(--danger);
  rotate: 12deg;
}
.leaving-right .swipe-stamp.add,
.leaving-left .swipe-stamp.nope {
  opacity: 1;
  scale: 1.2;
}

/* ✕ / ✓ hexagon buttons */
.swipe-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
}
.swipe-btn {
  display: grid;
  place-items: center;
  width: 72px;
  height: 80px;
  border: 0;
  clip-path: var(--hex);
  font: 700 28px var(--font-display);
  cursor: pointer;
}
.swipe-btn.no {
  background: var(--grad-red);
  color: #fff;
}
.swipe-btn.yes {
  background: var(--grad-cool);
  color: #04161a;
}
.swipe-btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.swipe-legend {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0 0;
  padding: 0 4px;
  color: var(--muted);
  font-size: 13px;
}

/* List picker */
.pick-list {
  display: grid;
  gap: var(--gap);
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
}
.pick {
  display: grid;
  gap: 4px;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--deck-2);
  box-shadow: var(--lift);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.pick:disabled {
  opacity: 0.45;
  cursor: default;
}
.pick-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-weight: 700;
}
.pick small {
  color: var(--muted);
  font-size: 13px;
}
@media (hover: hover) and (pointer: fine) {
  .pick:not(:disabled):hover {
    border-color: var(--orange);
    box-shadow: var(--lift), var(--glow);
  }
  .swipe-btn:not(:disabled):hover {
    scale: 1.07;
    filter: brightness(1.15);
  }
}

/* Reduced motion: no tilt, fling or pop-in; the card just changes */
@media (prefers-reduced-motion: reduce) {
  .swipe-card.leaving {
    display: none;
  }
}

/* "Add by list": the chosen list is clearly marked (orange edge, glow and a tick) */
.pick[aria-pressed='true'] {
  position: relative;
  border: 2px solid var(--orange);
  box-shadow: var(--lift), var(--glow);
  padding-right: 44px;
}
.pick[aria-pressed='true']::after {
  content: '✓';
  position: absolute;
  top: 50%;
  right: 12px;
  display: grid;
  place-items: center;
  width: 24px;
  height: 27px;
  transform: translateY(-50%);
  clip-path: var(--hex);
  background: var(--grad-hot);
  color: var(--ink);
  font-weight: 700;
}
.pick-list,
.pick-new,
.pick-empty {
  margin-top: 16px;
}
.pick-intro {
  margin: 0 0 14px;
}

/* All game info on the card (FR-010): compact, left-aligned; a long card scrolls up and down
   (pan-y), sideways stays the swipe */
.swipe-card.top {
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.swipe-card .info-list {
  width: 100%;
  margin: 4px 0 0;
  gap: 4px 12px;
  font-size: 14px;
  text-align: left;
}
.swipe-card .info-list dt {
  font-size: 13px;
}
.swipe-card .info-list dd {
  font-weight: 600;
}

/* ---- F005 prototype additions ---- */

.proto-bar { position: relative; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px; background: #05060e; border-bottom: 1px solid var(--rim); font-size: 12px; color: var(--muted); }
.proto-bar select { background: var(--deck-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; font: inherit; }

.proto-edge .crow::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 7px; border-radius: var(--r-md) 0 0 var(--r-md); background: var(--tone); }

function inText(g, here) {
  const l = (IN[g.id] || []).filter(n => n !== here)

  const pre = here ? 'also in ' : 'in '

}

const CATORDER = ['must_have', 'interested', 'unsure', 'later', 'poop', 'new', 'skip']
const F0 = () => ({ bought: 'all', price: 'all', cats: new Set(CATORDER), group: 'cat', bgg: 'all' })
const isDefault = f => f.bought === 'all' && f.price === 'all' && f.cats.size === CATORDER.length && f.group === 'cat' && f.bgg === 'all'
function shopGames() {
  const f = S.f
  return SHOP.map(byId).filter(g => {
    if (S.buyChip) return ['must_have', 'interested', 'unsure'].includes(g.cat) && !g.bought
    if (!f.cats.has(g.cat)) return false
    if (f.bought === 'no' && g.bought) return false
    if (f.bought === 'yes' && !g.bought) return false
    const pr = g.price || 0
    if (f.price === 'low' && !(pr && pr <= 3000)) return false
    if (f.price === 'mid' && !(pr > 3000 && pr <= 6000)) return false
    if (f.price === 'high' && !(pr > 6000)) return false
    if (f.bgg === 'own' && !has(g, 'own')) return false
    if (f.bgg === 'notown' && has(g, 'own')) return false
    if (f.bgg === 'wish' && !has(g, 'wish')) return false
    return true
  })
}

  let groups = ''

  } else {
    const hall = g => g.booth ? 'Hall ' + g.booth.split('-')[0] : 'No booth yet'
    const halls = [...new Set(games.map(hall))].sort((a, b) => (a === 'No booth yet') - (b === 'No booth yet') || a.localeCompare(b))
    groups = halls.map(h => { const gs = games.filter(g => hall(g) === h).sort((a, b) => CATORDER.indexOf(a.cat) - CATORDER.indexOf(b.cat) || (a.booth || '').localeCompare(b.booth || '')); return `<section class="group"><h3 class="group-title">${h} <span class="group-count">${gs.length}</span></h3><ul class="rows">${gs.map(row).join('')}</ul></section>` }).join('')
  }
  const active = !isDefault(S.f) || S.buyChip
  return `${heading('Essen 2026', true)}<main class="screen">

    <hr class="separator" />
    ${groups || '<p class="no-match">No game matches the filter.</p>'}
    <p class="proto-note">Grouped by category as today (Cat | Booth switches to halls and booths); Filter adds “BGG status”. Badges sit under the game infos. Tap Buy on a game you don't own yet (Arcs, Faraway): after “Got it” the app offers to mark it as owned on BGG.</p>
  </main>${actionbar(`<button type="button" class="act">${ICON.plus}<span>Add game</span></button>`, 'tinder', 'BG-Tinder: swipe a BGG list into this shopping list', `<button type="button" class="act${active ? ' is-active' : ''}" data-act="filter">${ICON.filter}<span>Filter</span></button>`, `<button type="button" class="act">${ICON.honey}<span>Show-off</span></button>`)}`

/* ---------- writing to BGG (simulated) ---------- */
function writeBgg(done) {
  if (S.offline) return toast("You're offline. Saving on BoardGameGeek needs a connection.")
  S.saving = true
  setTimeout(() => { S.saving = false; if ($('#refuse').checked) return done(false); done(true) }, 900)
}
function afterOwn(writePrice) {
  const g = byId(S.gameId)
  setSheet('<p class="result-status" role="status"><span class="spin-hex"></span>Saving on BoardGameGeek…</p>')
  writeBgg(ok => {
    if (!ok) { setSheet(`<h2 class="sheet-title">Not saved on BoardGameGeek</h2><div class="fail-line"><span>BoardGameGeek did not take the change. Nothing was changed there.</span><button class="link-btn" data-act="own-yes">Try again</button></div><div class="sheet-actions"><button class="btn btn-block" data-act="close">Close</button></div>`); return }
    g.st.own = 1; if (writePrice && S.paid) g.bggPrice = S.paid
    closeSheet(); render(); toast(`Saved on BoardGameGeek: ${g.name} owned${writePrice && S.paid ? ', price paid added' : ''}`)
  })
}
function ownYes() {
  const g = byId(S.gameId)
  if (!S.signedIn) { S.after = 'own'; S.sheet = 'signin'; S.signError = false; return setSheet(signInHTML()) }
  if (S.paid && g.bggPrice && g.bggPrice !== S.paid) return setSheet(replaceSheetHTML())
  afterOwn(true)
}

/* ---------- render and events ---------- */
function render() {
  const body = S.screen === 'shop' ? shopScreen() : S.screen === 'prices' ? pricesScreen() : S.screen === 'status' ? statusListScreen() : S.screen === 'swipe' ? swipeScreen()
    : S.place === 'buy' ? buyScreen() : S.place === 'lists' ? listsScreen() : configScreen()
  root.innerHTML = `<div class="app">${appbar()}${body}</div>${menuHTML()}`
  // the menu opens just below the app bar, wherever the prototype bar pushed it
  const m = $('.menu'); if (m) m.style.top = $('.appbar').getBoundingClientRect().bottom + 'px'
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return
  const a = t.dataset.act
  if (a !== 'st') e.preventDefault()
  if (a === 'menu') { S.menu = !S.menu; return render() }
  if (a === 'place') { S.menu = false; S.place = t.dataset.k; S.screen = 'main'; closeSheet(); return render() }
  if (a === 'tab') { if (t.dataset.place === 'Buy') S.buyTab = t.dataset.k; else S.listsTab = t.dataset.k; return render() }
  if (a === 'back') { S.screen = 'main'; return render() }
  if (a === 'toast') return toast(t.dataset.t)
  if (a === 'open-shop') { S.screen = 'shop'; return render() }
  if (a === 'new-list') return toast('Opens “New shopping list”')
  if (a === 'load') return toast('Opens “Load a BGG list”: preview, geeklist or BGG collection link')
  if (a === 'tinder') return toast('Opens BG-Tinder: choose a status list, preview or geeklist')
  if (a === 'add') return toast('Opens “Add to shopping lists”: tick shopping lists, optional category (as in feature 006)')
  if (a === 'fold-st') { S.stOpen = !S.stOpen; return setSheet(gameSheetHTML()) }
  if (a === 'fold-prices') { S.pricesOpen = !S.pricesOpen; return setSheet(gameSheetHTML()) }
  if (a === 'fold-cat') { S.catOpen = !S.catOpen; return setSheet(gameSheetHTML()) }
  if (a === 'cat') { const g = byId(S.gameId); g.cat = t.dataset.k; S.catOpen = false; render(); setSheet(gameSheetHTML()); return toast(`${g.name} → ${CAT[g.cat].join(' ')}`) }
  if (a === 'colour') { S.sheet = 'colour'; return openSheet('Badge colour', colourHTML(t.dataset.k)) }
  if (a === 'pick-colour') { S.colors[t.dataset.k] = t.dataset.c; render(); return setSheet(colourHTML(t.dataset.k)) }
  if (a === 'reset-colours') { S.colors = { ...COL0 }; render(); return toast('Badge colours reset') }
  if (a === 'status') { S.status = t.dataset.k; S.who = t.dataset.who; S.screen = 'status'; S.waiting = false; return render() }
  if (a === 'refresh') { S.waiting = true; render(); return setTimeout(() => { S.waiting = false; if (S.screen === 'status') render(); toast('Read again from BoardGameGeek') }, 1800) }
  if (a === 'swipe') { S.swipeAt++; return render() }
  if (a === 'sheet') return openGame(t.dataset.id, t.dataset.ctx || 'shop')
  if (a === 'filter') { S.sheet = 'filter'; return openSheet('Filter and group', filterHTML()) }
  if (a === 'f') { S.f[t.dataset.key] = t.dataset.v; S.buyChip = false; render(); return setSheet(filterHTML()) }
  if (a === 'f-clear') { S.f = F0(); S.buyChip = false; render(); return setSheet(filterHTML()) }
  if (a === 'cats-all' || a === 'cats-none') { S.f.cats = a === 'cats-all' ? new Set(CATORDER) : new Set(); S.buyChip = false; render(); return setSheet(filterHTML()) }
  if (a === 'group-toggle') { S.f.group = S.f.group === 'cat' ? 'booth' : 'cat'; return render() }
  if (a === 'buy-chip') { S.buyChip = !S.buyChip; return render() }
  if (a === 'cat-sheet') { S.gameId = +t.dataset.id; S.sheet = 'cat'; return openSheet('Category', catSheetHTML()) }
  if (a === 'set-cat') { const g = byId(S.gameId); g.cat = t.dataset.k; closeSheet(); render(); return toast(`${g.name} → ${CAT[g.cat].join(' ')}`) }
  if (a === 'buy') {
    const g = byId(t.dataset.id); S.gameId = g.id
    if (g.bought) { g.bought = false; g.paid = 0; render(); return toast(`${g.name}: not bought any more`) }
    S.sheet = 'buy'; return openSheet(`Bought ${g.name}?`, buySheetHTML())
  }
  if (a === 'own-yes') return ownYes()
  if (a === 'replace-price') return afterOwn(true)
  if (a === 'keep-price') return afterOwn(false)
  if (a === 'prio') { S.draft.wish = +t.dataset.p; return setSheet(gameSheetHTML()) }
  if (a === 'save-status') {
    S.saveError = false; setSheet(gameSheetHTML())
    writeBgg(ok => {
      if (!ok) { S.saveError = true; return setSheet(gameSheetHTML()) }
      const g = byId(S.gameId); ST.forEach(([k]) => { if (k === 'wish') g.st.wish = S.draft.wish; else g.st[k] = S.draft[k] ? 1 : 0 })
      closeSheet(); render(); toast('Saved on BoardGameGeek')
    })
    return setSheet(gameSheetHTML())
  }
  if (a === 'signin') { S.after = S.sheet === 'game' ? 'game' : null; S.sheet = 'signin'; S.signError = false; return layer.innerHTML ? setSheet(signInHTML()) : openSheet('Sign in to BoardGameGeek', signInHTML()) }
  if (a === 'close-or-back') { if (S.after === 'game') { S.sheet = 'game'; return setSheet(gameSheetHTML()) } if (S.after === 'own') return setSheet(ownSheetHTML()); return closeSheet() }
  if (a === 'sign-out') { S.signedIn = false; $('#signed').checked = false; render(); return toast('Signed out of BoardGameGeek on this device') }
  if (a === 'save-user') { S.username = $('#uname').value.trim(); render(); return toast(S.username ? `BGG username: ${S.username}` : 'BGG username removed') }
  if (a === 'close') { S.sheet = null; return closeSheet() }
})
document.addEventListener('change', e => {
  if (e.target.dataset.catf) { const k = e.target.dataset.catf; S.f.cats.has(k) ? S.f.cats.delete(k) : S.f.cats.add(k); S.buyChip = false; render(); return setSheet(filterHTML()) }
  if (e.target.dataset.act === 'st') { const k = e.target.dataset.k; S.draft[k] = k === 'wish' ? (e.target.checked ? 3 : 0) : e.target.checked; setSheet(gameSheetHTML()) }
})
document.addEventListener('submit', e => {
  e.preventDefault()
  const f = e.target.dataset.form
  if (f === 'signin') {
    if ($('#bp').value === 'wrong' || !$('#bp').value) { S.signError = true; return setSheet(signInHTML()) }
    S.signedIn = true; $('#signed').checked = true; if (!S.username) S.username = $('#bu').value.trim()
    toast(`Signed in to BoardGameGeek as ${$('#bu').value.trim()}`)
    if (S.after === 'game') { S.sheet = 'game'; render(); return setSheet(gameSheetHTML()) }
    if (S.after === 'own') { render(); return ownYes() }
    closeSheet(); return render()
  }
  if (f === 'buy') {
    const g = byId(S.gameId), v = parseFloat(($('#paid').value || '').replace(',', '.'))
    S.paid = isNaN(v) ? 0 : Math.round(v * 100)
    g.bought = true; g.paid = S.paid
    render(); toast(`${g.name}: got it${S.paid ? ' for ' + eur(S.paid) : ''}!`)
    if (!has(g, 'own') || S.paid) { S.sheet = 'own'; return setSheet(ownSheetHTML()) }
    return closeSheet()
  }
})
document.addEventListener('input', e => {
  if (e.target.id !== 'bq') return
  S.q = e.target.value; S.searched = false
  clearTimeout(S.timer)
  S.timer = setTimeout(() => { S.searched = true; const pos = e.target.selectionStart; render(); const f = $('#bq'); f.focus(); f.setSelectionRange(pos, pos) }, 750)
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); if (S.menu) { S.menu = false; render() } } })
$('#signed').onchange = e => { S.signedIn = e.target.checked; render(); if (S.sheet === 'game') setSheet(gameSheetHTML()) }
$('#offline').onchange = e => { S.offline = e.target.checked; render(); if (S.sheet === 'game') setSheet(gameSheetHTML()) }

function start() {
  const s = $('#start').value
  S = { place: 'buy', screen: 'main', menu: s === 'menu', buyTab: 'search', listsTab: 'status', q: '', searched: false, username: 'mrmikkl', signedIn: $('#signed').checked, offline: $('#offline').checked,
    bggFilter: 'all', f: F0(), buyChip: false, colors: S?.colors || { ...COL0 }, ctx: 'shop', stOpen: false, pricesOpen: false, status: 'own', who: 'me', waiting: false, swipeIds: [1, 2, 5, 3, 8], swipeAt: 0, sheet: null, draft: {}, paid: 0 }
  G.splice(0, G.length, ...JSON.parse(G0))
  closeSheet()
  if (s === 'buy-lists') S.buyTab = 'shopping'
  if (s === 'shop') S.screen = 'shop'
  if (s.startsWith('lists')) S.place = 'lists'
  if (s === 'lists-nouser') S.username = ''
  if (s === 'lists-previews') S.listsTab = 'previews'
  if (s.startsWith('status')) { S.place = 'lists'; S.screen = 'status'; S.status = s === 'status-wish' ? 'wish' : 'own'; S.waiting = s === 'status-wait' }
  if (s === 'swipe') S.screen = 'swipe'
  if (s === 'config') S.place = 'config'
  if (s === 'buy-search') { S.q = 'cas'; S.searched = true }
  render()
  if (s === 'sheet') { S.screen = 'shop'; render(); openGame(2, 'shop') }
  if (s === 'sheet-search') { S.q = 'cas'; S.searched = true; render(); openGame(7, 'search') }
  if (s === 'sheet-list') { S.place = 'lists'; S.screen = 'status'; S.status = 'wish'; render(); openGame(11, 'list') }
}
$('#start').onchange = start

start()
</script>
